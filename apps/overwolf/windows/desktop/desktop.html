<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP MDT Dispatch</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; background:#0f172a; color:#e2e8f0; font-family:'Segoe UI', sans-serif; overflow:hidden; }
        .title-bar { height:36px; background:linear-gradient(135deg,#0f172a,#1e293b); border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; padding:0 8px 0 12px; }
        .title-text { font-weight:700; font-size:.85em; color:#f1f5f9; }
        .title-mode { font-size:.7em; color:#67e8f9; background:rgba(6,182,212,0.15); border:1px solid rgba(6,182,212,0.4); padding:1px 8px; border-radius:10px; font-weight:600; margin-left:8px; }
        .btn-mini { width:28px; height:24px; background:transparent; border:none; color:#94a3b8; cursor:pointer; border-radius:4px; font-size:14px; transition:.15s; }
        .btn-mini:hover { background:rgba(255,255,255,0.08); color:#f1f5f9; }
        .btn-close:hover { background:#ef4444; color:white; }
        .content { height:calc(100% - 36px); position:relative; background:#0f172a; }
        .dispatch-frame { width:100%; height:100%; border:0; display:block; }
        .loading { position:absolute; inset:0; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:5; transition:opacity .3s; }
        .loading.hidden { opacity:0; pointer-events:none; }
        .spinner { width:48px; height:48px; border:3px solid #1e293b; border-top-color:#06b6d4; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <header class="title-bar">
        <div>
            <span class="title-text">RP MDT Dispatch</span>
            <span class="title-mode" id="title-mode">Desktop</span>
        </div>
        <div>
            <button class="btn-mini" id="btn-reload" title="Recharger">&#x21bb;</button>
            <button class="btn-mini" id="btn-min" title="Reduire">&#x2014;</button>
            <button class="btn-mini btn-close" id="btn-close" title="Fermer">&#x2715;</button>
        </div>
    </header>
    <main class="content">
        <iframe id="dispatch-frame" src="" class="dispatch-frame"></iframe>
        <div class="loading" id="loading"><div class="spinner"></div><div>Chargement du dispatch...</div></div>
    </main>
    <script src="desktop.js"></script>
</body>
</html>
