<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT - Plaintes</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="plainte"]{ --accent:#ec4899; --accent-2:#f472b6; --accent-rgb:236,72,153; }
.app a { color:inherit; text-decoration:none; }
.app a:hover { text-decoration:none; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 70px; }

.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#150109; }
.app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.app .btn-ghost:hover { border-color:var(--accent); }
.btn-sm { padding:7px 12px; font-size:.82em; }
.btn-danger { background:transparent; border:1px solid var(--border); color:var(--muted); }
.btn-danger:hover { border-color:var(--danger); color:var(--danger); }

.crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:7px; font-size:.82em; color:var(--muted); margin-bottom:18px; }
.crumbs a { color:var(--muted); }
.crumbs a:hover { color:var(--accent-2); }
.crumbs .sep { opacity:.5; }
.crumbs .here { color:var(--text); font-weight:600; overflow-wrap:anywhere; min-width:0; }

.sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.sec-head h1 { font-size:1.5em; display:flex; align-items:center; gap:11px; flex-wrap:wrap; min-width:0; overflow-wrap:anywhere; }
.sec-head h1 .ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.05em; flex:0 0 auto; background:rgba(var(--accent-rgb),.15); color:var(--accent-2); }
.sec-head p.sub { color:var(--muted); font-size:.9em; margin-top:5px; }

.pl-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
.pl-search { position:relative; flex:1 1 260px; min-width:200px; }
.pl-search i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.9em; }
.pl-search input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 14px 11px 36px; color:var(--text); font-family:inherit; font-size:.92em; }
.pl-search input:focus { outline:none; border-color:var(--accent); }
.pl-filter { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.85em; cursor:pointer; }
.pl-filter:focus { outline:none; border-color:var(--accent); }
.tag-filter-bar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:14px; }
.tag-filter-bar .fl-lbl { font-size:.76em; color:var(--muted-2); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.filter-tag { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:999px; font-size:.79em; font-weight:600; cursor:pointer; border:1px solid transparent; transition:.15s; user-select:none; }
.filter-tag.active { box-shadow:0 0 0 2px var(--accent) inset; }
.pl-count { color:var(--muted-2); font-size:.8em; margin-bottom:10px; }
.pl-tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pl-tab { padding:10px 16px; font-size:.9em; font-weight:700; color:var(--muted); border-bottom:2px solid transparent; display:inline-flex; align-items:center; gap:8px; }
.pl-tab.active { color:var(--accent-2); border-bottom-color:var(--accent); }
.pl-tab:hover { color:var(--text); }
.pl-tab-count { font-size:.78em; font-weight:800; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:1px 8px; }
.pl-tab.active .pl-tab-count { background:rgba(var(--accent-rgb),.15); color:var(--accent-2); border-color:transparent; }
.pl-closed-toggle { display:inline-flex; align-items:center; gap:7px; font-size:.83em; color:var(--muted); cursor:pointer; }
.pl-closed-toggle input { cursor:pointer; }
.pl-handler { display:inline-flex; align-items:center; gap:5px; font-size:.7em; font-weight:700; padding:2px 9px; border-radius:999px; background:rgba(var(--accent-rgb),.12); color:var(--accent-2); white-space:nowrap; }
.pl-handler.mine { background:rgba(16,185,129,.14); color:var(--success); }
.pl-handler-box { margin-top:16px; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:12px 15px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pl-handler-box .hb-txt { flex:1; min-width:0; font-size:.9em; }

.doc-list { display:flex; flex-direction:column; gap:9px; }
.pl-row { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 16px; cursor:pointer; transition:.15s; display:flex; align-items:center; gap:13px; }
.pl-row:hover { border-color:var(--accent); }
.pl-av { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#150109; font-weight:800; font-size:.82em; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.pl-rbody { flex:1; min-width:0; }
.pl-rtitle { font-weight:700; overflow-wrap:break-word; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.pl-rsub { color:var(--muted); font-size:.83em; margin-top:2px; display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pl-rtags { display:flex; flex-wrap:wrap; gap:5px; flex:0 0 auto; }
.pl-rwhen { font-size:.76em; color:var(--muted-2); flex:0 0 auto; white-space:nowrap; }
.pl-pj { font-size:.76em; color:var(--muted-2); flex:0 0 auto; white-space:nowrap; }
.pl-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:.72em; font-weight:600; white-space:nowrap; }

.pl-article { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 26px; }
.pl-a-head { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.pl-a-av { width:52px; height:52px; border-radius:13px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#150109; font-weight:800; font-size:1.1em; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.pl-a-htext { flex:1; min-width:0; }
.pl-a-htext h1 { font-size:1.35em; margin-bottom:3px; overflow-wrap:break-word; }
.pl-a-sub { color:var(--muted); font-size:.86em; }
.pl-a-actions { display:flex; flex-wrap:wrap; gap:8px; }
.pl-sec { margin-top:22px; }
.pl-sec-lbl { font-size:.73em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; margin-bottom:9px; }
.pl-faits { background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:15px 17px; line-height:1.65; white-space:pre-wrap; overflow-wrap:break-word; font-size:.94em; }
.pl-plaignant { display:flex; align-items:center; gap:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 13px; margin-bottom:8px; }
.pl-plaignant .nom { font-weight:650; }
.pl-plaignant .tel { font-size:.82em; color:var(--muted); }
.pl-mdt { font-size:.7em; padding:2px 9px; border-radius:12px; font-weight:700; margin-left:auto; white-space:nowrap; }
.pl-mdt-ok { background:rgba(16,185,129,.16); color:var(--success); }
.pl-mdt-no { background:rgba(148,163,184,.14); color:var(--muted); }
.pl-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:999px; font-size:.82em; font-weight:600; margin:0 6px 6px 0; }
.pl-chip-ind { background:rgba(99,102,241,.16); color:#a5b4fc; border:1px solid rgba(99,102,241,.35); }
.pl-chip-charge { background:rgba(var(--accent-rgb),.14); color:var(--accent-2); border:1px solid rgba(var(--accent-rgb),.3); }
.pl-chip-charge .cat { font-size:.82em; font-weight:800; opacity:.8; }
.pl-tags-wrap { display:flex; flex-wrap:wrap; gap:8px; }

.file-grid { display:flex; flex-wrap:wrap; gap:11px; }
.file-media { width:120px; height:120px; border-radius:10px; overflow:hidden; border:1px solid var(--border); position:relative; cursor:pointer; background:#000; }
.file-media img { width:100%; height:100%; object-fit:cover; }
.file-doc { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; max-width:100%; min-width:0; }
.file-doc:hover { border-color:var(--accent); }
.file-doc .fd-ic { font-size:1.4em; color:#f87171; }
.file-doc .fd-name { font-weight:600; font-size:.88em; overflow-wrap:anywhere; }
.file-doc .fd-size { font-size:.75em; color:var(--muted-2); }

.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .es-ic { font-size:2.4em; opacity:.4; margin-bottom:12px; }
.section-title { font-size:.82em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; margin:0 0 12px; }

#denied, #view-fatal, #view-error { display:none; text-align:center; padding:80px 20px; }
#denied .lock, #view-fatal .lock, #view-error .ecode { font-size:2.8em; margin-bottom:12px; }
#denied .lock { color:var(--danger); }
#view-fatal .lock { color:var(--warning); }
#view-error .ecode { font-weight:800; color:var(--accent); }
#denied h2, #view-fatal h2, #view-error h2 { font-size:1.25em; margin-bottom:8px; }
#denied p, #view-fatal p, #view-error p { color:var(--muted); max-width:460px; margin:0 auto 20px; line-height:1.6; }
.view { display:none; }
.view.on { display:block; }

#lb { display:none; position:fixed; inset:0; background:rgba(2,6,23,.92); z-index:9999; align-items:center; justify-content:center; padding:30px; }
#lb.open { display:flex; }
#lb img { max-width:92vw; max-height:88vh; border-radius:10px; }
#lb .lb-close { position:fixed; top:18px; right:18px; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(15,23,42,.8); color:#fff; font-size:1.05em; cursor:pointer; display:flex; align-items:center; justify-content:center; }

.ov { display:none; position:fixed; inset:0; background:rgba(2,6,23,.7); z-index:8000; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
.ov.open { display:flex; }
.editor { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:760px; padding:24px 26px; }
.editor h2 { font-size:1.2em; margin-bottom:18px; }
.editor .field { margin-bottom:15px; }
.editor label { display:block; font-size:.78em; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); margin-bottom:6px; }
.editor input[type=text], .editor input[type=tel], .editor input[type=datetime-local], .editor select, .editor textarea { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:11px 13px; color:var(--text); font-family:inherit; font-size:.95em; }
.editor textarea { min-height:120px; resize:vertical; line-height:1.5; }
.editor input:focus, .editor select:focus, .editor textarea:focus { outline:none; border-color:var(--accent); }
.ed-row { display:flex; gap:10px; flex-wrap:wrap; }
.ed-row > .field { flex:1 1 150px; margin-bottom:0; }
.ed-grp { display:flex; gap:8px; }
.ed-grp input { flex:1; }
.pl-drop { position:relative; }
.pl-dd { position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:9px; margin-top:4px; max-height:240px; overflow-y:auto; z-index:20; display:none; box-shadow:0 10px 30px rgba(0,0,0,.35); }
.pl-dd.show { display:block; }
.pl-dd-item { padding:9px 12px; cursor:pointer; font-size:.88em; display:flex; align-items:center; gap:7px; }
.pl-dd-item:hover { background:var(--surface-2); }
.cat-badge { font-size:.72em; font-weight:800; padding:1px 6px; border-radius:5px; background:rgba(var(--accent-rgb),.18); color:var(--accent-2); }
.chips-box { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
.mini-chip { display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:.83em; }
.mini-chip .x { cursor:pointer; color:var(--muted-2); }
.mini-chip .x:hover { color:var(--danger); }
.plg-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; }
.plg-row input { background:var(--surface); }
.plg-row .p-nom { flex:2 1 130px; }
.plg-row .p-tel { flex:1 1 90px; }
.plg-row select { flex:0 0 auto; background:var(--surface); }
.plg-row .p-del { background:none; border:none; color:var(--muted-2); cursor:pointer; margin-left:auto; }
.plg-row .p-del:hover { color:var(--danger); }
.dashed-btn { background:transparent; border:1px dashed var(--border); color:var(--accent-2); border-radius:9px; padding:8px 13px; font-size:.83em; cursor:pointer; font-family:inherit; }
.dashed-btn:hover { border-color:var(--accent); }
.ed-files { display:flex; flex-wrap:wrap; gap:9px; margin-top:9px; }
.ed-file { position:relative; width:84px; }
.ed-thumb { width:84px; height:84px; border-radius:9px; object-fit:cover; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:1.6em; color:#f87171; }
.ed-thumb img { width:100%; height:100%; object-fit:cover; }
.ed-file .ef-del { position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff; border:none; cursor:pointer; font-size:.75em; }
.ed-file .ef-name { font-size:.66em; color:var(--muted-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ed-foot { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
.tagset-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.tagset-row:last-child { border-bottom:none; }
.tagset-prev { flex:1; }
.tag-assign-list { display:flex; flex-direction:column; gap:3px; max-height:260px; overflow-y:auto; }
.tag-assign-list label { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; cursor:pointer; font-size:.9em; text-transform:none; letter-spacing:0; font-weight:500; color:var(--text); }
.tag-assign-list label:hover { background:var(--surface-2); }

@media (max-width:640px) {
  .wrap { padding:18px 14px 60px; }
  .pl-article { padding:18px 16px; }
  .editor { padding:18px 16px; }
  .ov { padding:20px 12px; }
  .file-media { width:96px; height:96px; }
  .pl-rwhen { display:none; }
}
</style>
</head>
<body class="app">
<div class="app-bg"></div>
<div class="wrap">

  <div id="denied">
    <div class="lock"><i class="fa-solid fa-lock"></i></div>
    <h2>Accès aux Plaintes refusé</h2>
    <p>Ta session n'est pas valide ou a expiré. Reconnecte-toi depuis le menu.</p>
    <a class="btn btn-ghost" href="/"><i class="fa-solid fa-arrow-left"></i> Retour au menu</a>
  </div>

  <div id="view-fatal">
    <div class="lock"><i class="fa-solid fa-plug-circle-xmark"></i></div>
    <h2>Module indisponible</h2>
    <p>Impossible de charger les Plaintes. Le serveur ne répond pas, ou ta session a expiré.</p>
    <button class="btn btn-primary" onclick="window.location.reload()"><i class="fa-solid fa-rotate-right"></i> Réessayer</button>
  </div>

  <div id="view-error">
    <div class="ecode" id="err-code">404</div>
    <h2 id="err-title">Page introuvable</h2>
    <p id="err-msg"></p>
    <a class="btn btn-ghost" href="/plainte/"><i class="fa-solid fa-house"></i> Retour aux plaintes</a>
  </div>

  <div id="view-home" class="view"></div>
  <div id="view-plainte" class="view"></div>
  <div id="view-search" class="view"></div>

</div>

<div id="ov-editor" class="ov">
  <div class="editor">
    <h2 id="ed-title">Nouvelle plainte</h2>
    <div class="ed-row">
      <div class="field pl-drop"><label>Agent rédacteur</label><input type="text" id="ed-red" autocomplete="off" placeholder="Rechercher un agent…" oninput="rosterFilter(this.value)" onfocus="rosterFilter(this.value)"><div class="pl-dd" id="ed-red-dd"></div></div>
      <div class="field"><label>Grade</label><input type="text" id="ed-grade" placeholder="Ex : Trooper"></div>
      <div class="field"><label>Date &amp; heure</label><input type="datetime-local" id="ed-date"></div>
    </div>
    <div class="field">
      <label>Plaignant(s)</label>
      <div id="ed-plaignants"></div>
      <button type="button" class="dashed-btn" onclick="addPlaignant()"><i class="fa-solid fa-user-plus"></i> Ajouter un plaignant</button>
    </div>
    <div class="field"><label>Audition — déroulé des faits</label><textarea id="ed-faits" placeholder="Relatez ici le déroulé des faits…"></textarea></div>
    <div class="field">
      <label>Individus incriminés</label>
      <div class="ed-grp"><input type="text" id="ed-ind" autocomplete="off" placeholder="Nom de l'individu…" onkeydown="if(event.key==='Enter'){event.preventDefault();addIndividu();}"><button type="button" class="btn btn-ghost btn-sm" onclick="addIndividu()"><i class="fa-solid fa-plus"></i></button></div>
      <div class="chips-box" id="ed-ind-list"></div>
    </div>
    <div class="field">
      <label>Faits reprochés</label>
      <div class="ed-grp pl-drop" style="position:relative"><input type="text" id="ed-charge" autocomplete="off" placeholder="Rechercher une infraction (code, libellé)…" oninput="chargeFilter(this.value)" onfocus="chargeFilter(this.value)"><button type="button" class="btn btn-ghost btn-sm" onclick="addCharge()"><i class="fa-solid fa-plus"></i></button><div class="pl-dd" id="ed-charge-dd"></div></div>
      <div class="chips-box" id="ed-charge-list"></div>
    </div>
    <div class="field">
      <label>Pièces jointes</label>
      <div class="ed-files" id="ed-files"></div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:9px" onclick="document.getElementById('ed-file-in').click()"><i class="fa-solid fa-paperclip"></i> Ajouter un fichier</button>
      <input type="file" id="ed-file-in" style="display:none" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" onchange="edUpload(this.files); this.value='';">
    </div>
    <div class="ed-foot">
      <button class="btn btn-ghost" onclick="closeEditor()">Annuler</button>
      <button class="btn btn-primary" id="ed-save" onclick="savePlainte()"><i class="fa-solid fa-check"></i> Enregistrer</button>
    </div>
  </div>
</div>

<div id="ov-modal" class="ov"><div class="editor" id="modal-box" style="max-width:520px"></div></div>

<div id="lb" onclick="closeLb(event)">
  <button type="button" class="lb-close" aria-label="Fermer" onclick="closeLb()"><i class="fa-solid fa-xmark"></i></button>
  <img id="lb-img" src="" alt="">
</div>

<script>
window.MDT_SHELL = {
  module: 'plainte',
  title: 'Plaintes',
  icon: 'fa-file-signature',
  back: { href: '/', label: 'Menu' },
  nav: [
    { key:'home', label:'Consulter', icon:'fa-list', href:'/plainte/' },
    { key:'search', label:'Rechercher', icon:'fa-magnifying-glass', href:'/plainte/recherche' }
  ]
};
</script>

<script>
var API = '/plainte/plainte_api.php';

function authHeaders(extra) { var h = extra || {}; try { var t = localStorage.getItem('mdt_auth_token') || ''; if (t) h['Authorization'] = 'Bearer ' + t; } catch(e) {} return h; }
function jsonHeaders() { return authHeaders({ 'Content-Type': 'application/json' }); }
function toast(msg, ok) { if (window.MDT_TOAST) { ok ? MDT_TOAST.ok(msg) : MDT_TOAST.err(msg); } }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

var PERMS = {}, ME = {};
var PLAINTES = [], P_BY_ID = {}, TAGS = [], TAG_BY_ID = {};
var activeTagFilters = [];
var HOME_TAB = 'mine', SHOW_CLOSED = false;
var ROSTER = [], PENAL = [], SUSPECTS = [], AUXLOADED = false;

function fmtDate(s) { if (!s) return ''; var d = new Date(String(s).replace(' ', 'T')); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }); }
function fmtDateTime(s) { if (!s) return ''; var d = new Date(String(s).replace(' ', 'T')); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function fmtSize(n) { n = n || 0; if (n < 1024) return n + ' o'; if (n < 1048576) return (n/1024).toFixed(0) + ' Ko'; return (n/1048576).toFixed(1) + ' Mo'; }
function initials(name) { if (!name) return '??'; var p = String(name).replace(/^\d+\s*\|\s*/, '').trim().split(/\s+/); if (p.length >= 2 && p[0] && p[1]) return (p[0][0] + p[1][0]).toUpperCase(); return (p[0] || '??').substring(0, 2).toUpperCase(); }
function can(p) { return !!PERMS[p]; }
function plaignantPrincipal(p) { var pl = (p.plaignants && p.plaignants[0]) || null; return (pl && pl.nom) || p.pe_prenom_nom || 'Plaignant inconnu'; }

function boot() {
  fetch(API + '?action=bootstrap', { headers: authHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.error) { if (d && d.code === 'E-SEC-401') { document.getElementById('denied').style.display = 'block'; } else { showFatal(); } return; }
      if (!d.access) { document.getElementById('denied').style.display = 'block'; return; }
      PERMS = d.perms || {}; ME = d.me || {};
      buildIndexes(d);
      startRouter();
    })
    .catch(function(e){ if (window.console && console.error) console.error('[PL] boot', e); showFatal(); });
}
function showFatal() { document.getElementById('view-fatal').style.display = 'block'; }

function buildIndexes(d) {
  PLAINTES = d.plaintes || []; P_BY_ID = {};
  PLAINTES.forEach(function(p){ P_BY_ID[p.id] = p; });
  TAGS = d.tags || []; TAG_BY_ID = {};
  TAGS.forEach(function(t){ TAG_BY_ID[t.id] = t; });
}
function reloadBootstrap(cb) {
  fetch(API + '?action=bootstrap', { headers: authHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.access) { PERMS = d.perms || PERMS; buildIndexes(d); if (cb) cb(); else MDT_ROUTER.refresh(); } })
    .catch(function(){ toast('Rechargement impossible', false); });
}

var lbReturn = null;
function openLb(url) { lbReturn = document.activeElement; document.getElementById('lb-img').src = url; document.getElementById('lb').classList.add('open'); var b = document.querySelector('#lb .lb-close'); if (b) b.focus(); }
function closeLb() { document.getElementById('lb').classList.remove('open'); document.getElementById('lb-img').removeAttribute('src'); if (lbReturn && lbReturn.focus) lbReturn.focus(); lbReturn = null; }
document.addEventListener('click', function(e){ var z = e.target.closest ? e.target.closest('[data-zoom]') : null; if (z && z.getAttribute('src')) { e.preventDefault(); openLb(z.getAttribute('src')); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeLb(); closeEditor(); closeModal(); } });

function viewShow(id) {
  ['denied','view-fatal','view-error'].forEach(function(x){ document.getElementById(x).style.display = 'none'; });
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === id); });
  window.scrollTo(0, 0);
}
function crumbs(items) {
  return '<div class="crumbs">' + items.map(function(it, i){
    var sep = i > 0 ? '<span class="sep">/</span>' : '';
    if (it.href) return sep + '<a href="' + esc(it.href) + '">' + esc(it.label) + '</a>';
    return sep + '<span class="here">' + esc(it.label) + '</span>';
  }).join('') + '</div>';
}
function hexA(hex, a) { hex = String(hex || '#6366f1'); if (!/^#[0-9a-f]{6}$/i.test(hex)) hex = '#6366f1'; var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
function tagPillHTML(t) {
  var ic = t.icon ? '<i class="fa-solid ' + esc(t.icon) + '"></i>' : '';
  return '<span class="pl-tag" style="background:' + hexA(t.color, .16) + ';color:' + esc(t.color) + '">' + ic + esc(t.name) + '</span>';
}

function showHome(vue) {
  shellActive('home');
  HOME_TAB = (vue === 'historique') ? 'all' : 'mine';
  var mineActive = PLAINTES.filter(function(p){ return p.mine && !p.closed; }).length;
  var h = crumbs([{ label:'Plaintes' }]);
  h += '<div class="sec-head"><h1><span class="ic"><i class="fa-solid fa-file-signature"></i></span> Plaintes</h1>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    (can('tag_manage') ? '<button class="btn btn-ghost btn-sm" onclick="openTagSettings()"><i class="fa-solid fa-tags"></i> Tags</button>' : '') +
    (can('create') ? '<button class="btn btn-primary btn-sm" onclick="openEditor(null)"><i class="fa-solid fa-plus"></i> Nouvelle plainte</button>' : '') +
    '</div></div>';
  h += '<div class="pl-tabs">' +
    '<a class="pl-tab' + (HOME_TAB === 'mine' ? ' active' : '') + '" href="/plainte/"><i class="fa-solid fa-user-check"></i> Mes plaintes' + (mineActive ? ' <span class="pl-tab-count">' + mineActive + '</span>' : '') + '</a>' +
    '<a class="pl-tab' + (HOME_TAB === 'all' ? ' active' : '') + '" href="/plainte/?vue=historique"><i class="fa-solid fa-clock-rotate-left"></i> Historique des plaintes</a>' +
    '</div>';
  h += '<div class="pl-toolbar"><div class="pl-search"><i class="fa-solid fa-magnifying-glass"></i><input id="home-q" type="text" placeholder="Rechercher (plaignant, rédacteur, individu, faits…)" oninput="renderList()"></div>' +
    (HOME_TAB === 'all' ? '<select class="pl-filter" id="home-red" onchange="renderList()"><option value="">Tous les rédacteurs</option></select>' : '') +
    (HOME_TAB === 'mine' ? '<label class="pl-closed-toggle"><input type="checkbox" id="home-closed"' + (SHOW_CLOSED ? ' checked' : '') + ' onchange="SHOW_CLOSED=this.checked;renderList()"> Voir aussi les traitées</label>' : '') +
    '</div>';
  h += '<div class="tag-filter-bar" id="tag-filter-bar"></div>';
  h += '<div class="pl-count" id="pl-count"></div><div id="pl-list"></div>';
  document.getElementById('view-home').innerHTML = h;
  viewShow('view-home');
  if (HOME_TAB === 'all') fillRedFilter();
  renderTagFilters();
  renderList();
}
function fillRedFilter() {
  var sel = document.getElementById('home-red'); if (!sel) return;
  var seen = {}; var reds = [];
  PLAINTES.forEach(function(p){ var r = p.redacteur || ''; if (r && !seen[r]) { seen[r] = 1; reds.push(r); } });
  reds.sort();
  reds.forEach(function(r){ var o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
}
function renderTagFilters() {
  var bar = document.getElementById('tag-filter-bar'); if (!bar) return;
  if (!TAGS.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  var h = '<span class="fl-lbl">Filtrer</span>';
  h += TAGS.map(function(t){
    var active = activeTagFilters.indexOf(t.id) !== -1;
    var ic = t.icon ? '<i class="fa-solid ' + esc(t.icon) + '"></i>' : '';
    return '<span class="filter-tag' + (active ? ' active' : '') + '" onclick="toggleTagFilter(\'' + esc(t.id) + '\')" style="background:' + hexA(t.color, .15) + ';color:' + esc(t.color) + '">' + ic + esc(t.name) + '</span>';
  }).join('');
  bar.innerHTML = h;
}
function toggleTagFilter(id) { var i = activeTagFilters.indexOf(id); if (i === -1) activeTagFilters.push(id); else activeTagFilters.splice(i, 1); renderTagFilters(); renderList(); }
function currentFilter() {
  var q = ''; var red = '';
  var qi = document.getElementById('home-q'); if (qi) q = norm(qi.value);
  var ri = document.getElementById('home-red'); if (ri) red = ri.value;
  return { q: q, red: red };
}
function matchPlainte(p, f) {
  if (f.red && p.redacteur !== f.red) return false;
  if (activeTagFilters.length) {
    var ids = (p.tag_ids || (p.tags || []).map(function(t){ return t.id; }));
    if (!activeTagFilters.some(function(x){ return ids.indexOf(x) !== -1; })) return false;
  }
  if (f.q) {
    var hay = norm([p.redacteur, plaignantPrincipal(p), (p.plaignants || []).map(function(x){ return x.nom; }).join(' '), (p.individus || []).join(' '), (p.faits || []).map(function(x){ return x.code + ' ' + x.label; }).join(' '), p.deroule_faits].join(' '));
    if (hay.indexOf(f.q) === -1) return false;
  }
  return true;
}
function renderList() {
  var list = document.getElementById('pl-list'); if (!list) return;
  var f = currentFilter();
  var rows = PLAINTES.filter(function(p){
    if (HOME_TAB === 'mine') { if (!p.mine) return false; if (!SHOW_CLOSED && p.closed) return false; }
    return matchPlainte(p, f);
  });
  var cnt = document.getElementById('pl-count'); if (cnt) cnt.textContent = rows.length + ' plainte' + (rows.length > 1 ? 's' : '') + (HOME_TAB === 'mine' && !SHOW_CLOSED ? ' en cours' : '');
  if (!rows.length) {
    var msg = HOME_TAB === 'mine'
      ? (SHOW_CLOSED ? 'Tu n\'as aucune plainte (rédigée ou prise en charge).' : 'Aucune plainte en cours à toi. Coche « Voir aussi les traitées » ou va dans l\'Historique.')
      : 'Aucune plainte ne correspond.';
    list.innerHTML = '<div class="empty-state"><div class="es-ic"><i class="fa-regular fa-folder-open"></i></div>' + msg + '</div>';
    return;
  }
  list.innerHTML = '<div class="doc-list">' + rows.map(plainteRowHTML).join('') + '</div>';
}
function plainteRowHTML(p) {
  var nom = plaignantPrincipal(p);
  var extra = (p.plaignants && p.plaignants.length > 1) ? ' +' + (p.plaignants.length - 1) : '';
  var tags = (p.tags || []).map(tagPillHTML).join('');
  var nPj = (p.attachments || []).length;
  var sub = (p.deroule_faits || '').replace(/\s+/g, ' ').trim();
  var handler = p.handler_name ? '<span class="pl-handler' + (p.handled_by_me ? ' mine' : '') + '"><i class="fa-solid fa-user-shield"></i> ' + esc(p.handled_by_me ? 'Moi' : p.handler_name) + '</span>' : '';
  return '<a class="pl-row" href="/plainte/plainte/' + encodeURIComponent(p.id) + '">' +
    '<span class="pl-av">' + esc(initials(p.redacteur)) + '</span>' +
    '<span class="pl-rbody"><span class="pl-rtitle">' + esc(nom) + (extra ? '<span style="color:var(--accent-2);font-size:.8em">' + esc(extra) + '</span>' : '') + handler + '</span>' +
    '<span class="pl-rsub">' + esc(p.redacteur || '') + (sub ? ' — ' + esc(sub) : '') + '</span></span>' +
    (tags ? '<span class="pl-rtags">' + tags + '</span>' : '') +
    (nPj ? '<span class="pl-pj"><i class="fa-solid fa-paperclip"></i> ' + nPj + '</span>' : '') +
    '<span class="pl-rwhen">' + esc(fmtDate(p.date_plainte || p.created_at)) + '</span></a>';
}

function sharePlainte(id) {
  var p = null;
  try { p = (PLAINTES || []).filter(function (x) { return String(x.id) === String(id); })[0]; } catch (e) {}
  if (typeof window.MDT_SHARE !== 'function') { toast('Partage indisponible', false); return; }
  window.MDT_SHARE({
    type: 'plainte', id: id,
    label: 'Plainte de ' + ((p && p.pe_prenom_nom) || 'plaignant inconnu'),
    sub: (p && p.date_plainte) ? 'Déposée le ' + p.date_plainte : ''
  });
}

function showPlainte(id) {
  shellActive('home');
  var p = P_BY_ID[id];
  if (!p) { showError('404', 'Plainte introuvable', 'Cette plainte a été supprimée, ou n\'existe pas.'); return; }
  var nom = plaignantPrincipal(p);
  var h = crumbs([{ label:'Plaintes', href:'/plainte/' }, { label:nom }]);
  var acts = '';
  acts += '<button class="btn btn-ghost btn-sm" onclick="sharePlainte(\'' + esc(p.id) + '\')" title="Partager dans la messagerie"><i class="fa-solid fa-share-nodes"></i> Partager</button>';
  if (can('edit')) acts += '<button class="btn btn-ghost btn-sm" onclick="openEditor(\'' + esc(p.id) + '\')"><i class="fa-solid fa-pen"></i> Modifier</button>';
  if (can('tag_manage')) acts += '<button class="btn btn-ghost btn-sm" onclick="openAssignTags(\'' + esc(p.id) + '\')"><i class="fa-solid fa-tags"></i> Tags</button>';
  if (can('delete')) acts += '<button class="btn btn-danger btn-sm" onclick="confirmDelete(\'' + esc(p.id) + '\')"><i class="fa-solid fa-trash"></i> Supprimer</button>';

  h += '<div class="pl-article">';
  h += '<div class="pl-a-head"><span class="pl-a-av">' + esc(initials(p.redacteur)) + '</span>' +
    '<span class="pl-a-htext"><h1>' + esc(nom) + '</h1><span class="pl-a-sub">Déposée le ' + esc(fmtDateTime(p.date_plainte || p.created_at)) + ' · par ' + esc(p.redacteur || '—') + (p.grade_redacteur ? ' (' + esc(p.grade_redacteur) + ')' : '') + '</span></span>' +
    (acts ? '<span class="pl-a-actions">' + acts + '</span>' : '') + '</div>';

  if ((p.tags || []).length) h += '<div class="pl-sec"><div class="pl-tags-wrap">' + p.tags.map(tagPillHTML).join('') + '</div></div>';

  h += handlerBoxHTML(p);

  h += '<div class="pl-sec"><div class="pl-sec-lbl">Plaignant(s)</div>';
  (p.plaignants || []).forEach(function(pl){
    var ok = pl.mdt === 'Oui';
    h += '<div class="pl-plaignant"><span class="nom">' + esc(pl.nom || '—') + '</span>' + (pl.tel ? '<span class="tel"><i class="fa-solid fa-phone" style="font-size:.85em"></i> ' + esc(pl.tel) + '</span>' : '') +
      '<span class="pl-mdt ' + (ok ? 'pl-mdt-ok' : 'pl-mdt-no') + '">' + (ok ? 'MDT vérifié' : 'MDT non vérifié') + '</span></div>';
  });
  h += '</div>';

  h += '<div class="pl-sec"><div class="pl-sec-lbl">Audition — déroulé des faits</div><div class="pl-faits">' + (p.deroule_faits ? esc(p.deroule_faits) : '<span style="color:var(--muted)">Aucun détail.</span>') + '</div></div>';

  if ((p.individus || []).length) {
    h += '<div class="pl-sec"><div class="pl-sec-lbl">Individus incriminés</div><div>';
    h += p.individus.map(function(x){ return '<span class="pl-chip pl-chip-ind"><i class="fa-solid fa-user"></i> ' + esc(x) + '</span>'; }).join('');
    h += '</div></div>';
  }
  if ((p.faits || []).length) {
    h += '<div class="pl-sec"><div class="pl-sec-lbl">Faits reprochés</div><div>';
    h += p.faits.map(function(f){ return '<span class="pl-chip pl-chip-charge">' + (f.cat ? '<span class="cat">' + esc(f.cat) + '</span>' : '') + esc(f.code) + (f.label ? ' · ' + esc(f.label) : '') + '</span>'; }).join('');
    h += '</div></div>';
  }

  var atts = p.attachments || [];
  if (atts.length) {
    var imgs = atts.filter(function(a){ return (a.mime || '').indexOf('image/') === 0; });
    var docs = atts.filter(function(a){ return (a.mime || '').indexOf('image/') !== 0; });
    h += '<div class="pl-sec"><div class="pl-sec-lbl"><i class="fa-solid fa-paperclip"></i> Pièces jointes</div><div class="file-grid">';
    h += imgs.map(function(a){ return '<div class="file-media"><img src="' + esc(a.url) + '" data-zoom alt="' + esc(a.original_name || '') + '"></div>'; }).join('');
    h += docs.map(function(a){ return '<a class="file-doc" href="' + esc(a.url) + '" target="_blank" rel="noopener" data-native><span class="fd-ic"><i class="fa-solid fa-file-pdf"></i></span><span><span class="fd-name">' + esc(a.original_name || 'Document') + '</span><br><span class="fd-size">' + fmtSize(a.size) + '</span></span></a>'; }).join('');
    h += '</div></div>';
  }

  h += '</div>';
  document.getElementById('view-plainte').innerHTML = h;
  viewShow('view-plainte');
}

function showSearch(q) {
  shellActive('search');
  var h = crumbs([{ label:'Plaintes', href:'/plainte/' }, { label:'Recherche' }]);
  h += '<div class="pl-toolbar"><div class="pl-search"><i class="fa-solid fa-magnifying-glass"></i><input id="search-q" type="text" placeholder="Rechercher une plainte…" value="' + esc(q || '') + '" oninput="runSearch(this.value)"></div></div>';
  h += '<div class="pl-count" id="s-count"></div><div id="s-list"></div>';
  document.getElementById('view-search').innerHTML = h;
  viewShow('view-search');
  var inp = document.getElementById('search-q'); if (inp) inp.focus();
  runSearch(q || '');
}
function runSearch(q) {
  var list = document.getElementById('s-list'); if (!list) return;
  var nq = norm(q);
  var cnt = document.getElementById('s-count');
  if (!nq) { list.innerHTML = '<div class="empty-state"><div class="es-ic"><i class="fa-solid fa-magnifying-glass"></i></div>Tape pour rechercher parmi les plaintes.</div>'; if (cnt) cnt.textContent = ''; return; }
  var rows = PLAINTES.filter(function(p){ return matchPlainte(p, { q: nq, red: '' }); });
  if (cnt) cnt.textContent = rows.length + ' résultat' + (rows.length > 1 ? 's' : '');
  if (!rows.length) { list.innerHTML = '<div class="empty-state"><div class="es-ic"><i class="fa-regular fa-face-frown"></i></div>Aucun résultat pour « ' + esc(q) + ' ».</div>'; return; }
  list.innerHTML = '<div class="doc-list">' + rows.map(plainteRowHTML).join('') + '</div>';
}

function showError(code, title, msg) {
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  document.getElementById('denied').style.display = 'none';
  document.getElementById('view-fatal').style.display = 'none';
  document.getElementById('err-code').textContent = code;
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent = msg || '';
  document.getElementById('view-error').style.display = 'block';
  window.scrollTo(0, 0);
}

function shellActive(key) { if (typeof window.MDT_SHELL_SET_ACTIVE === 'function') MDT_SHELL_SET_ACTIVE(key === 'search' ? 1 : 0); }
window.MDT_BACK = function () {
  var p = (location.pathname || '/plainte/').replace(/^\/plainte\/?/, '').replace(/\/+$/, '');
  if (p === '' || p === 'recherche') return '/';
  return '/plainte/';
};

function startRouter() {
  MDT_ROUTER.define({
    base: '/plainte',
    routes: [
      { path:'/', view:'home' },
      { path:'/recherche', view:'search' },
      { path:'/plainte/:id', view:'plainte' }
    ],
    onRoute: onRoute,
    onNotFound: function(){ showError('404', 'Page introuvable', 'Cette page n\'existe pas.'); }
  }).start();
}
var CURRENT_VIEWNAME = null;
function onRoute(m) {
  var view = m.route.view, p = m.params || {}, q = m.query || {};
  CURRENT_VIEWNAME = view;
  if (view === 'home') return showHome(q.vue);
  if (view === 'search') return showSearch(q.q || '');
  if (view === 'plainte') return showPlainte(p.id);
}

function loadAux(cb) {
  if (AUXLOADED) { if (cb) cb(); return; }
  fetch(API + '?action=aux', { headers: authHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d) { ROSTER = d.roster || []; PENAL = (d.penal || []).map(function(x){ return { code:x.code, cat:x.cat, label:x.label }; }); SUSPECTS = d.suspects || []; fillSuspectsDatalist(); } AUXLOADED = true; if (cb) cb(); })
    .catch(function(){ AUXLOADED = true; if (cb) cb(); });
}
function fillSuspectsDatalist() {
  var dl = document.getElementById('dl-suspects'); if (!dl) return;
  dl.innerHTML = SUSPECTS.map(function(n){ return '<option value="' + esc(n) + '">'; }).join('');
}

var edId = null, edPlaignants = [], edIndividus = [], edCharges = [], edFiles = [], edTempCharge = null;
function openEditor(id) {
  edId = id || null;
  loadAux();
  var p = id ? P_BY_ID[id] : null;
  document.getElementById('ed-title').textContent = p ? 'Modifier la plainte' : 'Nouvelle plainte';
  document.getElementById('ed-red').value = p ? (p.redacteur || '') : (meName() || '');
  document.getElementById('ed-grade').value = p ? (p.grade_redacteur || '') : '';
  document.getElementById('ed-date').value = toLocalInput(p ? (p.date_plainte || p.created_at) : null);
  document.getElementById('ed-faits').value = p ? (p.deroule_faits || '') : '';
  edPlaignants = p && p.plaignants && p.plaignants.length ? p.plaignants.map(function(x){ return { nom:x.nom || '', tel:x.tel || '', mdt:x.mdt === 'Oui' ? 'Oui' : 'Non' }; }) : [{ nom:'', tel:'', mdt:'Non' }];
  edIndividus = p ? (p.individus || []).slice() : [];
  edCharges = p ? (p.faits || []).slice() : [];
  edFiles = p ? (p.attachments || []).map(function(a){ return { id:a.id, url:a.url, mime:a.mime, original_name:a.original_name, linked:true }; }) : [];
  edTempCharge = null;
  renderPlaignants(); renderEdIndividus(); renderEdCharges(); renderEdFiles();
  suspectAC(document.getElementById('ed-ind'), function(){});
  document.getElementById('ed-red-dd').classList.remove('show');
  document.getElementById('ed-charge-dd').classList.remove('show');
  document.getElementById('ov-editor').classList.add('open');
}
function closeEditor() { document.getElementById('ov-editor').classList.remove('open'); }
function meName() { try { var u = JSON.parse(localStorage.getItem('mdt_user') || '{}'); return u.nom_prenom || u.name || u.username || ''; } catch(e) { return ''; } }
function toLocalInput(s) {
  var d = s ? new Date(String(s).replace(' ', 'T')) : new Date();
  if (isNaN(d.getTime())) d = new Date();
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function suspectAC(input, apply) {
  if (!window.MDT_AUTOCOMPLETE) return;
  MDT_AUTOCOMPLETE.attach(input, { source: function(){ return SUSPECTS; }, onSelect: function(it){ input.value = it.value; apply(it.value); } });
}
function renderPlaignants() {
  var box = document.getElementById('ed-plaignants');
  Array.prototype.forEach.call(box.querySelectorAll('.p-nom'), function(inp){ if (inp._sac) inp._sac.destroy(); });
  box.innerHTML = '';
  edPlaignants.forEach(function(pl, i){
    var row = document.createElement('div'); row.className = 'plg-row';
    row.innerHTML = '<input type="text" class="p-nom" autocomplete="off" placeholder="Nom Prénom" value="' + esc(pl.nom) + '" oninput="edPlaignants[' + i + '].nom=this.value">' +
      '<input type="tel" class="p-tel" placeholder="Téléphone" value="' + esc(pl.tel) + '" oninput="edPlaignants[' + i + '].tel=this.value">' +
      '<select onchange="edPlaignants[' + i + '].mdt=this.value"><option value="Non"' + (pl.mdt !== 'Oui' ? ' selected' : '') + '>MDT non vérifié</option><option value="Oui"' + (pl.mdt === 'Oui' ? ' selected' : '') + '>MDT vérifié</option></select>' +
      (edPlaignants.length > 1 ? '<button type="button" class="p-del" onclick="removePlaignant(' + i + ')"><i class="fa-solid fa-xmark"></i></button>' : '');
    box.appendChild(row);
    suspectAC(row.querySelector('.p-nom'), function(v){ edPlaignants[i].nom = v; });
  });
}
function addPlaignant() { edPlaignants.push({ nom:'', tel:'', mdt:'Non' }); renderPlaignants(); }
function removePlaignant(i) { edPlaignants.splice(i, 1); if (!edPlaignants.length) edPlaignants.push({ nom:'', tel:'', mdt:'Non' }); renderPlaignants(); }

function addIndividu() { var inp = document.getElementById('ed-ind'); var v = inp.value.trim(); if (!v) return; edIndividus.push(v); inp.value = ''; renderEdIndividus(); }
function removeIndividu(i) { edIndividus.splice(i, 1); renderEdIndividus(); }
function renderEdIndividus() {
  document.getElementById('ed-ind-list').innerHTML = edIndividus.map(function(x, i){ return '<span class="mini-chip">' + esc(x) + '<span class="x" onclick="removeIndividu(' + i + ')"><i class="fa-solid fa-xmark"></i></span></span>'; }).join('');
}

function rosterFilter(v) {
  var dd = document.getElementById('ed-red-dd'); var nv = norm(v);
  var res = ROSTER.filter(function(x){ return norm(x).indexOf(nv) !== -1; }).slice(0, 40);
  if (!res.length) { dd.classList.remove('show'); return; }
  dd.innerHTML = res.map(function(x){ return '<div class="pl-dd-item" onmousedown="pickRoster(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')">' + esc(x) + '</div>'; }).join('');
  dd.classList.add('show');
}
function pickRoster(x) { document.getElementById('ed-red').value = x; document.getElementById('ed-red-dd').classList.remove('show'); }

function chargeFilter(v) {
  var dd = document.getElementById('ed-charge-dd'); var nv = norm(v);
  var res = PENAL.filter(function(c){ return norm(c.code + ' ' + c.label).indexOf(nv) !== -1; }).slice(0, 40);
  if (!res.length) { dd.classList.remove('show'); return; }
  dd.innerHTML = res.map(function(c, i){ return '<div class="pl-dd-item" onmousedown="pickCharge(' + i + ',' + JSON.stringify(nv).replace(/"/g,'&quot;') + ')"><span class="cat-badge">' + esc(c.cat) + '</span>' + esc(c.code + ' - ' + c.label) + '</div>'; }).join('');
  dd._res = res;
  dd.classList.add('show');
}
function pickCharge(i, nv) {
  var dd = document.getElementById('ed-charge-dd'); var res = dd._res || [];
  var c = res[i]; if (!c) return;
  edTempCharge = c;
  document.getElementById('ed-charge').value = c.code + ' - ' + c.label;
  dd.classList.remove('show');
}
function addCharge() {
  if (!edTempCharge) { toast('Choisis une infraction dans la liste', false); return; }
  edCharges.push({ code:edTempCharge.code, cat:edTempCharge.cat, label:edTempCharge.label });
  edTempCharge = null; document.getElementById('ed-charge').value = ''; renderEdCharges();
}
function removeCharge(i) { edCharges.splice(i, 1); renderEdCharges(); }
function renderEdCharges() {
  document.getElementById('ed-charge-list').innerHTML = edCharges.map(function(c, i){ return '<span class="mini-chip">' + (c.cat ? '<span class="cat-badge">' + esc(c.cat) + '</span>' : '') + esc(c.code) + (c.label ? ' · ' + esc(c.label) : '') + '<span class="x" onclick="removeCharge(' + i + ')"><i class="fa-solid fa-xmark"></i></span></span>'; }).join('');
}

function edUpload(files) {
  if (!files || !files.length) return;
  Array.prototype.forEach.call(files, function(f){
    var fd = new FormData(); fd.append('file', f);
    fetch(API + '?action=upload_attachment', { method:'POST', headers: authHeaders(), body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.success) { edFiles.push({ id:d.id, url:d.url, mime:d.mime, original_name:d.original_name, linked:false }); renderEdFiles(); } else toast((d && d.error) || 'Upload refusé', false); })
      .catch(function(){ toast('Upload impossible', false); });
  });
}
function renderEdFiles() {
  document.getElementById('ed-files').innerHTML = edFiles.map(function(a, i){
    var thumb = (a.mime || '').indexOf('image/') === 0 ? '<div class="ed-thumb"><img src="' + esc(a.url) + '" alt=""></div>' : '<div class="ed-thumb"><i class="fa-solid fa-file-pdf"></i></div>';
    return '<div class="ed-file">' + thumb + '<button type="button" class="ef-del" onclick="removeEdFile(' + i + ')"><i class="fa-solid fa-xmark"></i></button><div class="ef-name">' + esc(a.original_name || '') + '</div></div>';
  }).join('');
}
function removeEdFile(i) {
  var a = edFiles[i]; if (!a) return;
  edFiles.splice(i, 1); renderEdFiles();
  fetch(API + '?action=delete_attachment', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: a.id }) }).catch(function(){});
}

function savePlainte() {
  var red = document.getElementById('ed-red').value.trim();
  var faits = document.getElementById('ed-faits').value.trim();
  edPlaignants = edPlaignants.filter(function(pl){ return (pl.nom || '').trim(); });
  if (!red) { toast('Agent rédacteur requis', false); return; }
  if (!edPlaignants.length) { toast('Au moins un plaignant est requis', false); return; }
  if (!faits) { toast('Le déroulé des faits est requis', false); return; }
  var payload = {
    redacteur: red,
    grade_redacteur: document.getElementById('ed-grade').value.trim(),
    date_plainte: document.getElementById('ed-date').value,
    deroule_faits: faits,
    plaignants: edPlaignants,
    individus: edIndividus,
    faits: edCharges,
    attachment_ids: edFiles.filter(function(a){ return !a.linked; }).map(function(a){ return a.id; })
  };
  if (edId) payload.id = edId;
  var btn = document.getElementById('ed-save'); btn.disabled = true;
  fetch(API + '?action=' + (edId ? 'update' : 'create'), { method:'POST', headers: jsonHeaders(), body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      btn.disabled = false;
      if (d && d.success) {
        toast(edId ? 'Plainte modifiée' : 'Plainte déposée', true);
        var newId = edId || d.id;
        closeEditor();
        reloadBootstrap(function(){ MDT_ROUTER.go('/plainte/plainte/' + encodeURIComponent(newId)); });
      } else { toast((d && d.error) || 'Erreur', false); }
    })
    .catch(function(){ btn.disabled = false; toast('Erreur réseau', false); });
}

function openAssignTags(id) {
  var p = P_BY_ID[id]; if (!p) return;
  var ids = (p.tag_ids || (p.tags || []).map(function(t){ return t.id; }));
  var h = '<h2>Tags de la plainte</h2>';
  if (!TAGS.length) h += '<p style="color:var(--muted)">Aucun tag. Crée-en via « Tags ».</p>';
  else {
    h += '<div class="tag-assign-list">' + TAGS.map(function(t){
      var ic = t.icon ? '<i class="fa-solid ' + esc(t.icon) + '" style="color:' + esc(t.color) + '"></i>' : '';
      return '<label><input type="checkbox" value="' + esc(t.id) + '"' + (ids.indexOf(t.id) !== -1 ? ' checked' : '') + '>' + ic + '<span style="color:' + esc(t.color) + '">' + esc(t.name) + '</span></label>';
    }).join('') + '</div>';
  }
  h += '<div class="ed-foot"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="saveAssignTags(\'' + esc(id) + '\')"><i class="fa-solid fa-check"></i> Enregistrer</button></div>';
  document.getElementById('modal-box').innerHTML = h;
  document.getElementById('ov-modal').classList.add('open');
}
function saveAssignTags(id) {
  var checks = document.querySelectorAll('#modal-box input[type=checkbox]:checked');
  var ids = Array.prototype.map.call(checks, function(c){ return c.value; });
  fetch(API + '?action=assign_tags', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ plainte_id: id, tag_ids: ids }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success) { toast('Tags mis à jour', true); closeModal(); reloadBootstrap(function(){ MDT_ROUTER.refresh(); }); } else toast('Erreur', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}
function closeModal() { document.getElementById('ov-modal').classList.remove('open'); }

var TAG_COLORS = ['#ef4444','#f59e0b','#10b981','#6366f1','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#64748b'];
var TAG_ICONS = ['fa-check','fa-clock','fa-ban','fa-gavel','fa-magnifying-glass','fa-flag','fa-star','fa-triangle-exclamation',''];
var tagEditId = null;
function openTagSettings() {
  tagEditId = null;
  renderTagSettings();
  document.getElementById('ov-modal').classList.add('open');
}
function renderTagSettings() {
  var h = '<h2>Gérer les tags</h2><div id="tagset-list">';
  h += TAGS.map(function(t){
    return '<div class="tagset-row"><span class="tagset-prev">' + tagPillHTML(t) + '</span>' +
      '<button class="btn btn-ghost btn-sm" onclick="startEditTag(\'' + esc(t.id) + '\')"><i class="fa-solid fa-pen"></i></button>' +
      '<button class="btn btn-danger btn-sm" onclick="deleteTag(\'' + esc(t.id) + '\')"><i class="fa-solid fa-trash"></i></button></div>';
  }).join('') || '<p style="color:var(--muted)">Aucun tag pour l\'instant.</p>';
  h += '</div><hr style="border:none;border-top:1px solid var(--border);margin:16px 0">';
  var editing = tagEditId ? TAG_BY_ID[tagEditId] : null;
  h += '<div class="field"><label>' + (editing ? 'Modifier le tag' : 'Nouveau tag') + '</label><input type="text" id="tag-name" maxlength="100" placeholder="Nom du tag" value="' + esc(editing ? editing.name : '') + '"></div>';
  h += '<div class="field"><label>Couleur</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="tag-colors">' + TAG_COLORS.map(function(c){ var sel = editing && editing.color === c; return '<span onclick="pickTagColor(\'' + c + '\')" data-c="' + c + '" style="width:28px;height:28px;border-radius:7px;cursor:pointer;background:' + c + ';border:2px solid ' + (sel ? 'var(--text)' : 'transparent') + '"></span>'; }).join('') + '</div></div>';
  h += '<div class="field"><label>Icône</label><div id="tag-iconpick"></div></div>';
  h += '<div class="field"><label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:500;cursor:pointer"><input type="checkbox" id="tag-closed" style="width:auto;margin-top:3px"' + (editing && editing.is_closed ? ' checked' : '') + '> <span>Ce tag <b>clôture</b> la plainte (Traité / Classé) — elle sort alors de « Mes plaintes en cours »</span></label></div>';
  h += '<div class="ed-foot">' + (tagEditId ? '<button class="btn btn-ghost" onclick="tagEditId=null;renderTagSettings()">Annuler</button>' : '<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>') + '<button class="btn btn-primary" onclick="saveTag()"><i class="fa-solid fa-check"></i> ' + (editing ? 'Modifier' : 'Créer') + '</button></div>';
  document.getElementById('modal-box').innerHTML = h;
  tagForm = { color: editing ? editing.color : TAG_COLORS[0], icon: (editing ? (editing.icon || '') : 'fa-check') || 'fa-tag' };
  MDT_ICONPICKER.mount(document.getElementById('tag-iconpick'), { value: tagForm.icon, onChange: function(v){ tagForm.icon = v; } });
}
var tagForm = { color:'#ef4444', icon:'fa-check' };
function pickTagColor(c) { tagForm.color = c; document.querySelectorAll('#tag-colors span').forEach(function(s){ s.style.border = '2px solid ' + (s.getAttribute('data-c') === c ? 'var(--text)' : 'transparent'); }); }
function pickTagIcon(ic) { tagForm.icon = ic; document.querySelectorAll('#tag-icons span').forEach(function(s){ s.style.border = '2px solid ' + (s.getAttribute('data-i') === ic ? 'var(--accent)' : 'var(--border)'); }); }
function startEditTag(id) { tagEditId = id; renderTagSettings(); }
function saveTag() {
  var name = document.getElementById('tag-name').value.trim();
  if (!name) { toast('Nom du tag requis', false); return; }
  var closedEl = document.getElementById('tag-closed');
  var payload = { name: name, color: tagForm.color, icon: tagForm.icon, is_closed: (closedEl && closedEl.checked) ? 1 : 0 };
  if (tagEditId) payload.id = tagEditId;
  fetch(API + '?action=' + (tagEditId ? 'update_tag' : 'create_tag'), { method:'POST', headers: jsonHeaders(), body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success) { toast(tagEditId ? 'Tag modifié' : 'Tag créé', true); tagEditId = null; reloadBootstrap(function(){ renderTagSettings(); if (CURRENT_VIEWNAME === 'home') { renderTagFilters(); renderList(); } }); } else toast((d && d.error) || 'Erreur', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}
function deleteTag(id) {
  var t = TAG_BY_ID[id];
  confirmModal('Supprimer le tag « ' + esc(t ? t.name : '') + ' » ? Il sera retiré de toutes les plaintes.', function(){
    fetch(API + '?action=delete_tag', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.success) { toast('Tag supprimé', true); reloadBootstrap(function(){ openTagSettings(); if (CURRENT_VIEWNAME === 'home') { renderTagFilters(); renderList(); } }); } else toast('Erreur', false); })
      .catch(function(){ toast('Erreur réseau', false); });
  });
}

function confirmDelete(id) {
  confirmModal('Supprimer définitivement cette plainte ? Cette action est irréversible.', function(){
    fetch(API + '?action=delete', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.success) { toast('Plainte supprimée', true); delete P_BY_ID[id]; reloadBootstrap(function(){ MDT_ROUTER.go('/plainte/'); }); } else toast((d && d.error) || 'Suppression refusée', false); })
      .catch(function(){ toast('Erreur réseau', false); });
  });
}
function confirmModal(msg, onYes) {
  document.getElementById('modal-box').innerHTML = '<h2>Confirmation</h2><p style="color:var(--muted);line-height:1.6;margin-bottom:8px">' + msg + '</p>' +
    '<div class="ed-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" id="cm-yes"><i class="fa-solid fa-check"></i> Confirmer</button></div>';
  document.getElementById('ov-modal').classList.add('open');
  document.getElementById('cm-yes').onclick = function(){ closeModal(); onYes(); };
}

function handlerBoxHTML(p) {
  var canRelease = p.handled_by_me || (p.handler_name && ME.is_admin);
  var btn = '';
  if (!p.handled_by_me) btn += '<button class="btn btn-primary btn-sm" onclick="takePlainte(\'' + esc(p.id) + '\')"><i class="fa-solid fa-hand"></i> ' + (p.handler_name ? 'Reprendre' : 'Prendre en charge') + '</button>';
  if (canRelease) btn += '<button class="btn btn-ghost btn-sm" onclick="releasePlainte(\'' + esc(p.id) + '\')"><i class="fa-solid fa-hand-point-up"></i> Lâcher</button>';
  var txt = p.handler_name
    ? '<i class="fa-solid fa-user-shield" style="color:var(--accent-2)"></i> Prise en charge par <b>' + esc(p.handled_by_me ? 'toi' : p.handler_name) + '</b>' + (p.handler_at ? ' · depuis le ' + esc(fmtDate(p.handler_at)) : '')
    : '<i class="fa-regular fa-hand"></i> Personne ne gère cette plainte pour l\'instant.';
  return '<div class="pl-handler-box"><span class="hb-txt">' + txt + '</span>' + btn + '</div>';
}
function takePlainte(id) {
  fetch(API + '?action=take', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success) { toast('Plainte prise en charge', true); reloadBootstrap(function(){ MDT_ROUTER.refresh(); }); } else toast((d && d.error) || 'Erreur', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}
function releasePlainte(id) {
  fetch(API + '?action=release', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success) { toast('Plainte lâchée', true); reloadBootstrap(function(){ MDT_ROUTER.refresh(); }); } else toast((d && d.error) || 'Erreur', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}

boot();
</script>
</body>
</html>
