<!DOCTYPE html>
<html lang="fr" data-module="messagerie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT - Messagerie</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="messagerie"]{ --accent:#6366f1; --accent-2:#818cf8; --accent-rgb:99,102,241; }
body.embed { overflow:hidden; margin:0; }
body.embed .app-topbar, body.embed .dock, body.embed .dock-toggle, body.embed .ash-shell { display:none !important; }
body.embed .msg-root { position:fixed; inset:0; height:auto; border:none; max-width:100%; }
body.embed .msg-side { width:190px !important; display:flex !important; }
body.embed .msg-root.in-conv .msg-side { display:flex !important; }
body.embed .msg-root:not(.in-conv) .msg-main { display:flex !important; }
body.embed .conv-head .back-m { display:none !important; }
.app a { color:inherit; text-decoration:none; }
.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#fff; } .app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); } .app .btn-ghost:hover { border-color:var(--accent); }
.app .btn-danger { background:#dc2626; color:#fff; } .app .btn-danger:hover { background:#ef4444; }
.field textarea { width:100%; min-height:96px; resize:vertical; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.9em; line-height:1.5; }
.field textarea:focus { outline:none; border-color:var(--accent); }
.app .btn-sm { padding:7px 12px; font-size:.82em; }

#denied { display:none; text-align:center; padding:60px 20px; }
#denied .lock { width:64px; height:64px; border-radius:50%; background:rgba(var(--accent-rgb),.12); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:1.6em; margin:0 auto 18px; }

/* ===== Layout 2 volets ===== */
.msg-root { display:flex; height:var(--msg-h, calc(100vh - 56px)); max-width:1500px; margin:0 auto; border-left:1px solid var(--border-soft); border-right:1px solid var(--border-soft); }
.msg-side { width:320px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface-2); }
.msg-main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }

/* ---- liste conversations ---- */
.side-top { display:flex; gap:8px; padding:12px 12px 10px; border-bottom:1px solid var(--border-soft); }
.side-search { position:relative; flex:1; }
.side-search i { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.82em; }
.side-search input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 10px 8px 30px; color:var(--text); font-family:inherit; font-size:.85em; }
.side-search input:focus { outline:none; border-color:var(--accent); }
.side-new { width:38px; flex-shrink:0; border:1px solid var(--border); background:var(--surface); color:var(--accent-2); border-radius:9px; cursor:pointer; font-size:.95em; }
.side-new:hover { border-color:var(--accent); }
.side-scroll { flex:1; overflow-y:auto; padding:6px 8px 20px; }
.side-sec { margin-top:8px; }
.side-sec-h { display:flex; align-items:center; justify-content:space-between; padding:8px 8px 5px; font-size:.7em; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted-2); }
.mini-add { border:none; background:none; color:var(--muted-2); cursor:pointer; font-size:.95em; padding:2px 5px; border-radius:6px; }
.mini-add:hover { color:var(--accent-2); background:var(--surface-hover); }
.conv-item { display:flex; align-items:center; gap:10px; padding:9px 9px; border-radius:10px; cursor:pointer; transition:.1s; position:relative; }
.conv-item:hover { background:var(--surface-hover); }
.conv-item.on { background:rgba(var(--accent-rgb),.14); }
.conv-av { width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9em; color:#fff; overflow:hidden; }
.av-wrap { position:relative; display:inline-flex; flex-shrink:0; }
.pres-dot { position:absolute; right:-2px; bottom:-2px; width:12px; height:12px; border-radius:50%; border:2px solid var(--surface); box-sizing:border-box; z-index:1; }
.pres-dot.online { background:#22c55e; }
.pres-dot.away { background:#f59e0b; }
.pres-dot.offline { background:#64748b; }
.pres-dot.inline { position:static; display:inline-block; width:8px; height:8px; border:none; margin-right:6px; vertical-align:middle; }
.conv-av img { width:100%; height:100%; object-fit:cover; }
.conv-meta { flex:1; min-width:0; }
.conv-top { display:flex; align-items:center; gap:6px; }
.conv-name { font-weight:600; font-size:.9em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.conv-time { font-size:.68em; color:var(--muted-2); flex-shrink:0; }
.conv-last { font-size:.78em; color:var(--muted-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.conv-bot { display:flex; align-items:center; gap:6px; }
.conv-bot .conv-last { flex:1; margin-top:0; }
.conv-right { flex-shrink:0; display:flex; align-items:center; }
.conv-item.unread .conv-name { color:var(--text-strong); font-weight:800; } .conv-item.unread .conv-last { color:var(--text); font-weight:600; }
.conv-item.on .conv-name { color:var(--text-strong); }
.conv-item.unread::before { content:""; position:absolute; left:2px; top:50%; transform:translateY(-50%); width:3px; height:26px; border-radius:3px; background:var(--accent); }
.conv-badge { min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:var(--accent); color:#fff; font-size:.68em; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.conv-mute { color:var(--muted-2); font-size:.72em; }
.side-empty { text-align:center; color:var(--muted-2); font-size:.8em; padding:14px 8px; }

/* ---- panneau conversation ---- */
.conv-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted-2); gap:12px; text-align:center; padding:20px; }
.conv-empty i { font-size:2.6em; opacity:.4; }
.conv-wrap { flex:1; display:flex; flex-direction:column; min-height:0; }
.conv-head { display:flex; align-items:center; gap:11px; padding:11px 16px; border-bottom:1px solid var(--border); background:var(--surface-2); flex-shrink:0; }
.conv-head .back-m { display:none; border:none; background:none; color:var(--muted); font-size:1.1em; cursor:pointer; padding:4px; }
.conv-head .h-av { width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:.85em; overflow:hidden; }
.conv-head .h-av img { width:100%; height:100%; object-fit:cover; }
.conv-head .h-info { flex:1; min-width:0; }
.conv-head .h-title { font-weight:800; font-size:.98em; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-head .h-sub { font-size:.74em; color:var(--muted-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-head .h-act { border:none; background:none; color:var(--muted-2); cursor:pointer; font-size:.95em; padding:7px 9px; border-radius:8px; }
.conv-head .h-act:hover { color:var(--accent-2); background:var(--surface-hover); }
.conv-find { border-bottom:1px solid var(--border); background:var(--surface-2); flex-shrink:0; }
.cf-box { display:flex; align-items:center; gap:9px; padding:9px 14px; }
.cf-box > i { color:var(--muted-2); font-size:.85em; }
.cf-box input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 11px; color:var(--text); font-family:inherit; font-size:.88em; }
.cf-box input:focus { outline:none; border-color:var(--accent); }
.cf-close { border:none; background:none; color:var(--muted-2); cursor:pointer; padding:4px 7px; }
.cf-results { max-height:240px; overflow-y:auto; }
.cf-res { padding:8px 14px; cursor:pointer; border-top:1px solid var(--border-soft); }
.cf-res:hover { background:var(--surface-hover); }
.cf-res .cf-h { display:flex; justify-content:space-between; gap:8px; font-size:.75em; margin-bottom:2px; }
.cf-res .cf-a { color:var(--accent-2); font-weight:700; }
.cf-res .cf-d { color:var(--muted-2); flex-shrink:0; }
.cf-res .cf-s { font-size:.84em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.m-pin { color:var(--accent-2); font-size:.72em; margin-left:5px; }
.read-by { display:flex; align-items:center; justify-content:flex-end; gap:5px; font-size:.72em; color:var(--muted-2); padding:3px 8px 5px; }
.read-by i { color:var(--accent-2); font-size:.9em; }
.pin-item { padding:9px 10px; border-radius:9px; cursor:pointer; border:1px solid var(--border-soft); margin-bottom:6px; }
.pin-item:hover { background:var(--surface-hover); border-color:var(--accent); }
.msg.flash { animation:msgFlash 1.7s ease; }
@keyframes msgFlash { 0%,100%{ background:transparent; } 18%,55%{ background:rgba(var(--accent-rgb),.22); } }
.conv-msgs { flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:2px; }
.load-more { text-align:center; padding:8px; } .load-more button { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:6px 14px; font-size:.78em; cursor:pointer; font-family:inherit; }
.day-sep { text-align:center; margin:14px 0 8px; position:relative; }
.new-sep { display:flex; align-items:center; gap:10px; margin:14px 4px 6px; color:#f87171; }
.new-sep::before, .new-sep::after { content:''; flex:1; height:1px; background:rgba(248,113,113,.35); }
.new-sep span { font-size:.68em; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
.day-sep span { background:var(--surface-2); padding:2px 12px; font-size:.7em; color:var(--muted-2); border:1px solid var(--border-soft); border-radius:999px; position:relative; z-index:1; }
.msg { display:flex; gap:11px; padding:2px 6px; border-radius:8px; position:relative; }
.msg:hover { background:var(--surface-hover); }
.msg .m-av { width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82em; color:#fff; overflow:hidden; margin-top:3px; }
.msg .m-av img { width:100%; height:100%; object-fit:cover; }
.msg.grouped { padding-top:0; padding-bottom:0; }
.msg.grouped .m-av { visibility:hidden; height:0; margin:0; }
.msg.grouped .m-head { display:none; }
.m-body-wrap { flex:1; min-width:0; }
.m-head { display:flex; align-items:baseline; gap:8px; margin-bottom:1px; }
.m-author { font-weight:700; font-size:.9em; color:var(--text-strong); }
.m-time { font-size:.68em; color:var(--muted-2); }
.m-text { font-size:.9em; line-height:1.5; color:var(--text); white-space:pre-wrap; word-break:break-word; background:var(--surface-3); border:1px solid var(--border-soft); border-radius:5px 13px 13px 13px; padding:7px 11px; display:inline-block; max-width:100%; }
.msg.me { flex-direction:row-reverse; }
.msg.me .m-body-wrap { display:flex; flex-direction:column; align-items:flex-end; }
.msg.me .m-head { flex-direction:row-reverse; justify-content:flex-end; gap:6px; }
.msg.me .m-author { display:none; }
.msg.me .m-av { align-self:flex-start; }
.msg.me .m-text { background:var(--accent); border-color:transparent; color:#fff; border-radius:13px 5px 13px 13px; }
.msg.me .m-text a { color:#e0e7ff; }
.msg.me .m-text .mention { background:rgba(255,255,255,.24); color:#fff; }
.msg.me .m-reply { border-left:none; border-right:2px solid var(--border); padding-left:2px; padding-right:8px; }
.msg.me .m-atts, .msg.me .m-reacts, .msg.me .m-deleted { justify-content:flex-end; text-align:right; }
.msg.me .m-tools { right:auto; left:8px; }
.m-text a { color:var(--accent-2); text-decoration:underline; }
.m-text code { background:var(--surface); padding:1px 6px; border-radius:5px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.86em; }
.m-text strong { font-weight:800; color:var(--text-strong); }
.m-text del { opacity:.65; }
.m-text .mention { background:rgba(var(--accent-rgb),.22); color:var(--accent-2); border-radius:4px; padding:0 3px; font-weight:600; }
.m-edited { font-size:.68em; color:var(--muted-2); margin-left:5px; }
.m-deleted { font-style:italic; color:var(--muted-2); font-size:.86em; }
.m-reply { display:flex; align-items:center; gap:6px; font-size:.76em; color:var(--muted); margin-bottom:2px; padding-left:2px; border-left:2px solid var(--border); padding-left:8px; }
.m-reply b { color:var(--muted); font-weight:700; }
.m-atts { display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; }
.att-img { max-width:280px; max-height:220px; border-radius:10px; border:1px solid var(--border); cursor:pointer; display:block; }
.att-vid { max-width:320px; border-radius:10px; border:1px solid var(--border); }
.att-file { display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; text-decoration:none; max-width:260px; }
.att-file i { font-size:1.3em; color:var(--accent-2); } .att-file .af-n { font-size:.82em; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .att-file .af-s { font-size:.7em; color:var(--muted-2); }
.m-tools { position:absolute; top:-9px; right:8px; display:none; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:2px; }
.msg:hover .m-tools { display:flex; }
.m-tools button { border:none; background:none; color:var(--muted); cursor:pointer; font-size:.8em; padding:5px 7px; border-radius:6px; }
.m-tools button:hover { color:var(--accent-2); background:var(--surface-hover); }

/* ---- composer ---- */
.conv-reply { display:flex; align-items:center; gap:8px; padding:7px 16px; border-top:1px solid var(--border-soft); background:var(--surface-2); font-size:.8em; color:var(--muted); }
.conv-reply b { color:var(--accent-2); } .conv-reply .rc { margin-left:auto; cursor:pointer; color:var(--muted-2); padding:2px 6px; }
.conv-atts { display:flex; flex-wrap:wrap; gap:8px; padding:9px 16px; border-top:1px solid var(--border-soft); background:var(--surface-2); }
.pend-att { display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:6px 9px; font-size:.78em; position:relative; }
.pend-att img { width:34px; height:34px; border-radius:6px; object-fit:cover; }
.pend-att i.pi { color:var(--accent-2); }
.pend-att .rm { cursor:pointer; color:var(--muted-2); margin-left:2px; }
.pend-att.up { opacity:.6; }
.typing-bar { padding:2px 18px 3px; font-size:.78em; color:var(--muted); display:flex; align-items:center; gap:7px; min-height:16px; }
.typing-dots { display:inline-flex; gap:3px; }
.typing-dots span { width:5px; height:5px; border-radius:50%; background:var(--muted); display:inline-block; animation:typingBounce 1.2s infinite ease-in-out; }
.typing-dots span:nth-child(2){ animation-delay:.18s; } .typing-dots span:nth-child(3){ animation-delay:.36s; }
@keyframes typingBounce { 0%,60%,100%{ transform:translateY(0); opacity:.45; } 30%{ transform:translateY(-5px); opacity:1; } }
.thread-panel { position:absolute; top:0; right:0; bottom:0; width:380px; max-width:100%; background:var(--surface-2); border-left:1px solid var(--border); display:flex; flex-direction:column; z-index:30; box-shadow:-8px 0 24px rgba(0,0,0,.25); }
.thread-head { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.thread-head .th-info { flex:1; font-weight:800; color:var(--text-strong); display:flex; align-items:center; gap:8px; min-width:0; }
.thread-head .th-info i { color:var(--accent-2); }
.thread-head .th-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.th-close { border:none; background:none; color:var(--muted); cursor:pointer; font-size:1.1em; padding:4px 8px; border-radius:8px; } .th-close:hover { color:var(--text); background:var(--surface-hover); }
.thread-msgs { flex:1; overflow-y:auto; padding:12px 12px 6px; display:flex; flex-direction:column; gap:3px; }
.tmsg { display:flex; gap:9px; padding:3px 5px; border-radius:8px; position:relative; }
.tmsg:hover { background:var(--surface-hover); }
.tmsg .m-av { width:32px; height:32px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.72em; color:#fff; overflow:hidden; }
.tmsg .m-av img { width:100%; height:100%; object-fit:cover; }
.thread-composer { display:flex; align-items:flex-end; gap:7px; padding:10px 12px 12px; border-top:1px solid var(--border); flex-shrink:0; }
#threadComposer { flex:1; resize:none; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:.88em; line-height:1.4; max-height:120px; overflow-y:hidden; }
#threadComposer:focus { outline:none; border-color:var(--accent); }
.th-send { border:none; background:var(--accent); color:#fff; width:36px; height:36px; border-radius:9px; cursor:pointer; flex-shrink:0; } .th-send:hover { background:var(--accent-2); }
.m-reacts { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
.m-react { display:inline-flex; align-items:center; gap:4px; background:var(--surface-3); border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-size:.8em; cursor:pointer; color:var(--text); font-family:inherit; }
.m-react.me { background:rgba(var(--accent-rgb),.18); border-color:var(--accent); color:var(--accent-2); }
.m-react:hover { border-color:var(--accent); }
.msg-thread { display:inline-flex; align-items:center; gap:7px; margin-top:5px; padding:5px 11px; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:.8em; color:var(--accent-2); font-weight:600; }
.msg-thread:hover { border-color:var(--accent); }
@media (max-width:760px){ .thread-panel { width:100%; } }
.conv-composer { display:flex; align-items:flex-end; gap:8px; padding:12px 16px 14px; border-top:1px solid var(--border); background:var(--surface-2); position:relative; }
.cmp-attach { border:none; background:var(--surface); color:var(--muted); width:40px; height:40px; border-radius:10px; cursor:pointer; flex-shrink:0; font-size:1em; }
.cmp-attach:hover { color:var(--accent-2); }
#composer { flex:1; resize:none; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 13px; color:var(--text); font-family:inherit; font-size:.9em; line-height:1.4; max-height:160px; overflow-y:hidden; }
#composer:focus { outline:none; border-color:var(--accent); }
.cmp-emoji { border:none; background:var(--surface); color:var(--muted); width:40px; height:40px; border-radius:10px; cursor:pointer; flex-shrink:0; font-size:1.05em; }
.cmp-emoji:hover { color:var(--accent-2); }
.ui-inrow { position:relative; }
.ui-input { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 38px 10px 12px; color:var(--text); font-family:inherit; font-size:.9em; }
.ui-input:focus { outline:none; border-color:var(--accent); }
.ui-inrow textarea { padding-right:38px; }
.ui-emoji-btn { position:absolute; right:8px; top:8px; border:none; background:none; color:var(--muted-2); cursor:pointer; font-size:1em; padding:2px 4px; }
.ui-emoji-btn:hover { color:var(--accent-2); }
.cmp-send { border:none; background:var(--accent); color:#fff; width:40px; height:40px; border-radius:10px; cursor:pointer; flex-shrink:0; font-size:1em; }
.cmp-send:hover { background:var(--accent-2); } .cmp-send:disabled { opacity:.4; cursor:default; }
.mention-pop { position:absolute; bottom:72px; left:64px; right:64px; max-width:340px; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:0 12px 30px rgba(0,0,0,.4); overflow:hidden; z-index:20; }
.mention-pop .mp-i { display:flex; align-items:center; gap:9px; padding:8px 11px; cursor:pointer; font-size:.85em; }
.mention-pop .mp-i:hover, .mention-pop .mp-i.on { background:rgba(var(--accent-rgb),.16); }
.mention-pop .mp-av { width:26px; height:26px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; font-size:.72em; font-weight:800; }
.mention-pop .mp-av img { width:100%; height:100%; object-fit:cover; }

/* ---- modales ---- */
.ov { position:fixed; inset:0; background:rgba(2,6,23,.72); display:none; align-items:flex-start; justify-content:center; padding:70px 16px 30px; z-index:120; overflow-y:auto; }
.ov.open { display:flex; }
.mbox { width:100%; max-width:480px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; }
.mbox h3 { font-size:1.12em; margin-bottom:16px; display:flex; align-items:center; gap:9px; }
.mbox h3 i { color:var(--accent-2); }
.field { margin-bottom:14px; } .field label { display:block; font-size:.8em; font-weight:700; color:var(--muted); margin-bottom:6px; }
.field > input[type=text], .field > input:not([type]) { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.9em; }
.field > input:focus { outline:none; border-color:var(--accent); }
.mbox-foot { display:flex; justify-content:flex-end; gap:9px; margin-top:6px; }
.people-res { max-height:230px; overflow-y:auto; margin-top:6px; }
.people-i { display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:9px; cursor:pointer; }
.people-i:hover { background:var(--surface-hover); }
.people-av { width:30px; height:30px; border-radius:9px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; font-size:.75em; font-weight:800; } .people-av img{ width:100%;height:100%;object-fit:cover; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip { display:flex; align-items:center; gap:6px; background:rgba(var(--accent-rgb),.16); color:var(--accent-2); border-radius:999px; padding:4px 10px; font-size:.8em; font-weight:600; }
.chip .x { cursor:pointer; opacity:.7; } .chip .x:hover { opacity:1; }
.color-row { display:flex; gap:8px; flex-wrap:wrap; }
.color-sw { width:30px; height:30px; border-radius:9px; cursor:pointer; border:2px solid transparent; }
.color-sw.on { border-color:#fff; }
.color-custom { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(135deg,#ef4444,#eab308,#22c55e,#3b82f6,#a855f7); }
.color-custom input[type=color] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; }
.color-custom i { pointer-events:none; font-size:.8em; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.side-folder { margin-top:2px; }
.folder-head { display:flex; align-items:center; gap:7px; padding:6px 9px; font-size:.72em; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--muted-2); cursor:pointer; border-radius:8px; }
.folder-head:hover { color:var(--muted); background:var(--surface-hover); }
.folder-head > i { font-size:.9em; width:10px; text-align:center; }
.fh-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.fh-gear { opacity:0; cursor:pointer; padding:2px 4px; }
.folder-head:hover .fh-gear { opacity:.75; }
.folder-body { padding-left:5px; min-height:4px; }
.chan-top { min-height:6px; border-radius:10px; }
.conv-item[draggable="true"] { cursor:grab; }
.drop-hint { outline:2px dashed var(--accent); outline-offset:-2px; background:rgba(var(--accent-rgb),.10); border-radius:10px; }
.conv-item.drop-before { box-shadow: inset 0 3px 0 -1px var(--accent); }
.conv-item.drop-after { box-shadow: inset 0 -3px 0 -1px var(--accent); }
.ch-logo-row { display:flex; align-items:center; gap:12px; }
.ch-logo-prev { width:54px; height:54px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--accent-2); font-size:1.3em; flex-shrink:0; }
.ch-logo-prev img { width:100%; height:100%; object-fit:cover; }
.ch-mem { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; font-size:.85em; }
.ch-mem:hover { background:var(--surface-hover); }
.ch-mem .rm { margin-left:auto; cursor:pointer; color:var(--muted-2); }
.ch-mem .rm:hover { color:#f87171; }
select.mbox-sel { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.9em; }
.imgview { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:200; padding:24px; overflow:hidden; }
.imgview.open { display:flex; }
.imgview img { max-width:94%; max-height:94%; border-radius:8px; transform-origin:center center; transition:transform .08s linear; user-select:none; -webkit-user-drag:none; }
.iv-toolbar { position:absolute; top:16px; right:18px; display:flex; align-items:center; gap:4px; background:rgba(30,41,59,.85); border:1px solid var(--border); border-radius:12px; padding:5px 7px; backdrop-filter:blur(8px); z-index:2; }
.iv-toolbar button, .iv-toolbar .iv-dl { width:34px; height:34px; border:none; background:none; color:var(--text); border-radius:8px; cursor:pointer; font-size:.95em; display:flex; align-items:center; justify-content:center; text-decoration:none; }
.iv-toolbar button:hover, .iv-toolbar .iv-dl:hover { background:rgba(255,255,255,.1); color:var(--accent-2); }
.iv-toolbar #ivPct { font-size:.78em; color:var(--muted); min-width:42px; text-align:center; }

@media (max-width:760px){
  .msg-root { border:none; }
  .msg-side { width:100%; }
  .msg-root.in-conv .msg-side { display:none; }
  .msg-root:not(.in-conv) .msg-main { display:none; }
  .conv-head .back-m { display:block; }

}
.m-embed { display:block; margin-top:7px; max-width:420px; border:1px solid var(--border); border-left:3px solid var(--emb,#22d3ee);
  border-radius:11px; background:var(--surface-2); padding:10px 13px; text-decoration:none; color:inherit; transition:.14s; }
.m-embed:hover { border-color:var(--emb,#22d3ee); transform:translateY(-1px); }
.m-embed.locked { opacity:.6; cursor:not-allowed; }
.emb-kind { font-size:.68em; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--emb,#22d3ee);
  display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.emb-title { font-size:.92em; font-weight:700; line-height:1.3; }
.emb-sub { font-size:.8em; color:var(--muted-2); margin-top:3px; line-height:1.4; }
.emb-go { font-size:.75em; font-weight:700; color:var(--emb,#22d3ee); margin-top:7px; display:flex; align-items:center; gap:5px; }
</style>

<script>
var API = '/messagerie/messagerie_api.php';
function authHeaders(extra){ var h = extra || {}; try { var t = localStorage.getItem('mdt_auth_token') || ''; if (t) h['Authorization'] = 'Bearer ' + t; } catch(e){} return h; }
function jsonHeaders(){ return authHeaders({ 'Content-Type':'application/json' }); }
function toast(m, ok){ if (window.MDT_TOAST) { ok ? MDT_TOAST.ok(m) : MDT_TOAST.err(m); } }
function esc(s){ if (s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function api(action, opts){ return fetch(API + '?action=' + action, opts).then(function(r){ return r.json().catch(function(){ return {}; }); }); }
function initials(n){ n = String(n||'?').replace(/^[\d|\s]+/,'').trim() || String(n||'?'); var p = n.split(/\s+/); return ((p[0]||'?')[0] + (p[1]? p[1][0]:'')).toUpperCase(); }
function hueOf(s){ s = String(s||''); var h = 0; for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360; return h; }
function avatarHtml(name, url, did){ if (url) return '<img src="'+esc(url)+'" alt="" onerror="this.style.display=\'none\'">'; return esc(initials(name)); }
function avStyle(seed, color){ if (color) return 'background:'+esc(color); var h = hueOf(seed); return 'background:hsl('+h+',45%,42%)'; }

function fmtTime(s){ var d = new Date(String(s).replace(' ','T')); if (isNaN(d)) return ''; return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDay(s){ var d = new Date(String(s).replace(' ','T')); if (isNaN(d)) return ''; var now = new Date(); var y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString()===now.toDateString()) return "Aujourd'hui";
  if (d.toDateString()===y.toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }
function fmtListTime(s){ var d = new Date(String(s).replace(' ','T')); if (isNaN(d)) return ''; var now = new Date();
  if (d.toDateString()===now.toDateString()) return fmtTime(s);
  var y = new Date(now); y.setDate(now.getDate()-1); if (d.toDateString()===y.toDateString()) return 'hier';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}); }
function linkify(text){ var e = esc(text);
  e = e.replace(/(https?:\/\/[^\s<]+)/g, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'; });
  e = e.replace(/(^|\s)(@[\wÀ-ÿ][\wÀ-ÿ'’-]{0,40})/g, function(m,p,mt){ return p + '<span class="mention">'+mt+'</span>'; });
  return e; }
function fmtSize(b){ b = +b||0; if (b<1024) return b+' o'; if (b<1048576) return (b/1024).toFixed(0)+' Ko'; return (b/1048576).toFixed(1)+' Mo'; }

var ME = { did:'', name:'' }, IS_ADMIN = false;
var CONVS = {}, CUR = null, MSGS = [], lastMsgId = 0, oldestMsgId = 0, hasMore = false;
var pendAtt = [], replyTo = null, mentionSet = {};
var listTimer = null, convTimer = null, pendingFilter = '';
var SIDE_CH = [], SIDE_DM = [], loadedOnce = false;
function rerenderSide(){ renderSide(SIDE_CH, SIDE_DM); }
var GUILD_ROLES = null;
var FOLDERS = [];
var chLogo = null, chLogoUrl = null;

function setDenied(){ var d = document.getElementById('denied'); if (d) d.style.display='block'; document.getElementById('msgRoot').style.display='none'; }

function loadConvs(cb){
  if (!loadedOnce) { MDT_SKEL.show('#chanList', 'list-rows', { rows: 5 }); }
  api('list_convs', { headers: authHeaders() }).then(function(d){
    if (!d || !d.success){ if (cb) cb(); return; }
    IS_ADMIN = !!d.is_admin; ME = d.me || ME;
    document.getElementById('btnNewChan').hidden = !IS_ADMIN;
    var _bnf = document.getElementById('btnNewFolder'); if (_bnf) _bnf.hidden = !IS_ADMIN;
    var prevUnread = {}; Object.keys(CONVS).forEach(function(id){ prevUnread[id] = CONVS[id].unread || 0; });
    CONVS = {}; SIDE_CH = d.channels||[]; SIDE_DM = d.dms||[]; FOLDERS = d.folders||[]; PRESENCE = d.presence||{};
    SIDE_CH.forEach(function(c){ CONVS[c.id] = c; });
    SIDE_DM.forEach(function(c){ CONVS[c.id] = c; });
    if (loadedOnce){ SIDE_CH.concat(SIDE_DM).forEach(function(c){ if (c.id !== CUR && c.type !== 'channel' && (c.unread||0) > (prevUnread[c.id]||0) && c.last && c.last.author_did !== ME.did){ toast('\uD83D\uDCAC ' + (c.last.author||'') + (c.type==='channel' && c.title ? ' \u00b7 '+c.title : '') + ' : ' + String(c.last.preview).slice(0,60), true); } }); }
    loadedOnce = true;
    renderSide(SIDE_CH, SIDE_DM);
    if (CUR && CONVS[CUR] && CONVS[CUR].type === 'dm') renderHead();
    if (document.body.classList.contains('embed') && window.parent && window.parent !== window){ var _tu=0; SIDE_CH.concat(SIDE_DM).forEach(function(c){ if(!c.muted) _tu+=(c.unread||0); }); try { window.parent.postMessage({ type:'mdt-msg-unread', total:_tu }, '*'); } catch(e){} }
    if (cb) cb();
  }).catch(function(){ if (cb) cb(); });
}

function convIcon(c){
  if (c.type === 'channel') return c.logo_url ? '<img src="'+esc(c.logo_url)+'" alt="">' : '<i class="fa-solid fa-hashtag"></i>';
  if (c.type === 'group') return '<i class="fa-solid fa-user-group"></i>';
  return avatarHtml(c.title, dmAvatar(c));
}
function dmAvatar(c){ if (c.type!=='dm') return null; var o = (c.members||[]).filter(function(m){ return m.did !== ME.did; })[0]; return o ? o.avatar : null; }
function convColor(c){ if (c.type==='channel') return c.color || '#6366f1'; if (c.type==='group') return '#0ea5e9'; return null; }

var PRESENCE = {};
function presStatus(did){ return (did && PRESENCE[did]) ? PRESENCE[did] : 'offline'; }
function presDotHtml(did){ var s = presStatus(did); return (s==='online'||s==='away') ? '<span class="pres-dot '+s+'"></span>' : ''; }
function presLabel(did){ var s = presStatus(did); if (s==='online') return {cls:'online', text:'En ligne'}; if (s==='away') return {cls:'away', text:'Absent'}; return {cls:'offline', text:'Hors ligne'}; }
function convItemHtml(c){
  var unread = c.unread > 0;
  var pd = (c.type==='dm' && c.peer_did) ? presDotHtml(c.peer_did) : '';
  var av = '<div class="av-wrap"><div class="conv-av" style="'+avStyle(c.title||String(c.id), convColor(c))+'">'+convIcon(c)+'</div>'+pd+'</div>';
  var last = c.last ? ((c.last.author_did===ME.did?'Vous : ':'') + c.last.preview) : 'Aucun message';
  var right = unread ? '<span class="conv-badge">'+(c.unread>99?'99+':c.unread)+'</span>' : (c.muted?'<i class="fa-solid fa-bell-slash conv-mute"></i>':'');
  var drag = (c.type==='channel' && IS_ADMIN) ? ' draggable="true" ondragstart="chanDragStart(event,'+c.id+')" ondragend="chanDragEnd(event)" ondragover="chanDragOverItem(event)" ondragleave="chanDragLeaveItem(event)" ondrop="chanDropOnItem(event,'+c.id+')"' : '';
  return '<div class="conv-item'+(unread?' unread':'')+(CUR===c.id?' on':'')+'" data-id="'+c.id+'"'+drag+' onclick="navConv('+c.id+')">'+
    av + '<div class="conv-meta"><div class="conv-top"><span class="conv-name">'+esc(c.title||'Sans nom')+'</span>'+
    (c.last?'<span class="conv-time">'+esc(fmtListTime(c.last.created_at))+'</span>':'')+'</div>'+
    '<div class="conv-bot"><span class="conv-last">'+esc(last)+'</span>'+(right?'<span class="conv-right">'+right+'</span>':'')+'</div></div></div>';
}
function folderCollapsed(id){ try { return (localStorage.getItem('msgFolderCol')||'').split(',').indexOf(String(id))>=0; } catch(e){ return false; } }
function toggleFolder(id){ try { var a=(localStorage.getItem('msgFolderCol')||'').split(',').filter(Boolean); var i=a.indexOf(String(id)); if(i>=0)a.splice(i,1); else a.push(String(id)); localStorage.setItem('msgFolderCol', a.join(',')); } catch(e){} rerenderSide(); }
var draggedChan = null;
function chanDropAttr(fid){ return IS_ADMIN ? ' ondragenter="chanDragOver(event)" ondragover="chanDragOver(event)" ondragleave="chanDragLeave(event)" ondrop="chanDropOnFolder(event,'+fid+')"' : ''; }
function chanDragStart(e, id){ draggedChan = id; try { e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(id)); } catch(_){} }
function chanDragEnd(e){ clearHints(); draggedChan = null; }
function chanDragOver(e){ if (draggedChan!=null){ e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect='move'; if (e.currentTarget) e.currentTarget.classList.add('drop-hint'); } }
function chanDragLeave(e){ if (e.currentTarget) e.currentTarget.classList.remove('drop-hint'); }
function chanDragOverItem(e){ if (draggedChan==null) return; e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect='move'; var el=e.currentTarget; var r=el.getBoundingClientRect(); if ((e.clientY - r.top) > r.height/2){ el.classList.add('drop-after'); el.classList.remove('drop-before'); } else { el.classList.add('drop-before'); el.classList.remove('drop-after'); } }
function chanDragLeaveItem(e){ if (e.currentTarget) e.currentTarget.classList.remove('drop-before','drop-after'); }
function clearHints(){ var h = document.querySelectorAll('.drop-hint,.drop-before,.drop-after'); for (var i=0;i<h.length;i++) h[i].classList.remove('drop-hint','drop-before','drop-after'); }
function chanDropOnItem(e, targetId){ e.preventDefault(); e.stopPropagation(); var after = e.currentTarget.classList.contains('drop-after'); clearHints(); if (draggedChan==null || draggedChan===targetId){ draggedChan=null; return; } var t = CONVS[targetId]; moveChannel(draggedChan, t?(t.folder_id||0):0, targetId, after); draggedChan=null; }
function chanDropOnFolder(e, folderId){ e.preventDefault(); e.stopPropagation(); clearHints(); if (draggedChan==null){ return; } moveChannel(draggedChan, folderId, null); draggedChan=null; }
function moveChannel(draggedId, targetFolderId, beforeChannelId, after){
  var arr = SIDE_CH, di = -1, i;
  for (i=0;i<arr.length;i++){ if (arr[i].id===draggedId){ di=i; break; } }
  if (di<0) return;
  var dragged = arr.splice(di,1)[0];
  var tf = targetFolderId ? targetFolderId : null;
  dragged.folder_id = tf;
  if (beforeChannelId){
    var ti=-1; for (i=0;i<arr.length;i++){ if (arr[i].id===beforeChannelId){ ti=i; break; } }
    if (ti>=0) arr.splice(after?ti+1:ti,0,dragged); else arr.push(dragged);
  } else {
    var lastIdx=-1; for (i=0;i<arr.length;i++){ if ((arr[i].folder_id||null)===tf) lastIdx=i; }
    arr.splice(lastIdx+1,0,dragged);
  }
  rerenderSide();
  var channels = SIDE_CH.map(function(c,idx){ return { id:c.id, folder_id:(c.folder_id||''), ordre:idx }; });

function msgMD(raw){
  if (raw==null) return '';
  var s = esc(raw), links=[];
  function stash(h){ links.push(h); return '\uE000'+(links.length-1)+'\uE001'; }
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function(m,t,u){ return stash('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'); });
  s = s.replace(/(^|[^">=\/\uE000])(https?:\/\/[^\s<]+)/g, function(m,pre,u){ var tr='',mt=u.match(/[),.;:!?\u00bb\u2019]+$/); if(mt){tr=mt[0];u=u.slice(0,-tr.length);} return pre+stash('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>')+tr; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^\w*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[\s>(])@([\w\u00c0-\u00ff][\w\u00c0-\u00ff'\u2019-]{0,40})/g, '$1<span class="mention">@$2</span>');
  return s.replace(/\uE000(\d+)\uE001/g, function(m,i){ return links[+i]; });
}

function applyIv(){ var img=document.getElementById('imgViewImg'); if(!img) return; img.style.transform='translate('+ivX+'px,'+ivY+'px) scale('+ivScale+')'; img.style.cursor=ivScale>1?(ivDrag?'grabbing':'grab'):'default'; var p=document.getElementById('ivPct'); if(p) p.textContent=Math.round(ivScale*100)+'%'; }

(function(){ var iv=document.getElementById('imgView'); if(!iv) return; var img=document.getElementById('imgViewImg');
  iv.addEventListener('click', function(e){ if(e.target===iv) closeImgView(); });

  img.addEventListener('dblclick', function(e){ e.preventDefault(); if(ivScale>1) ivReset(); else { ivScale=2.4; applyIv(); } });
  img.addEventListener('mousedown', function(e){ if(ivScale<=1) return; e.preventDefault(); ivDrag={ x:e.clientX-ivX, y:e.clientY-ivY }; applyIv(); });

})();

function composerKey(e){

  if (!pop.hidden && mpItems.length){
    if (e.key==='ArrowDown'){ e.preventDefault(); mpIndex=(mpIndex+1)%mpItems.length; showMentionPop(); return; }

        (c?'<button class="btn btn-ghost" style="margin-right:auto;color:'+(c.archived?'#22c55e':'#f87171')+'" onclick="archiveChan('+c.id+','+(c.archived?0:1)+')"><i class="fa-solid '+(c.archived?'fa-box-open':'fa-box-archive')+'"></i> '+(c.archived?'Réactiver':'Archiver')+'</button>':'')+
        '<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>'+
        '<button class="btn btn-primary" onclick="saveChan('+(c?c.id:0)+')"><i class="fa-solid fa-check"></i> '+(c?'Enregistrer':'Créer')+'</button>'+
      '</div>';
    document.getElementById('ovModal').classList.add('open');
    renderChLogo();
    chRoleSel = MDT_ROLESELECT.mount(document.getElementById('chRoles'), { roles: roles, selected: c ? (c.roles||[]) : [], onChange: function(){} });
    if (window.MDT_EMOJI) MDT_EMOJI.attach(document.getElementById('chNameEmoji'), function(){ return document.getElementById('chName'); });
    if (c) loadChannelMembers(c.id);
  });
}
function renderChLogo(){ var p = document.getElementById('chLogoPrev'); if (!p) return; p.innerHTML = chLogoUrl ? '<img src="'+esc(chLogoUrl)+'" alt="">' : '<i class="fa-solid fa-hashtag"></i>'; var cl = document.getElementById('chLogoClear'); if (cl) cl.style.display = chLogoUrl ? '' : 'none'; }
function pickChLogo(){ document.getElementById('chLogoInput').click(); }
function clearChLogo(){ chLogo = null; chLogoUrl = null; renderChLogo(); }
function onChLogoFile(ev){ var file = ev.target.files && ev.target.files[0]; ev.target.value=''; if (!file) return;
  var fd = new FormData(); fd.append('file', file);
  var p = document.getElementById('chLogoPrev'); if (p) p.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  fetch(API + '?action=upload', { method:'POST', headers: authHeaders(), body: fd }).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.success || !d.attachment || !d.attachment.is_image){ toast((d&&d.error)||'Image invalide', false); renderChLogo(); return; }
    chLogo = d.attachment.id; chLogoUrl = d.attachment.url; renderChLogo();
  }).catch(function(){ toast('Échec upload', false); renderChLogo(); });
}
function loadChannelMembers(id){
  api('channel_members&conv='+id, { headers: authHeaders() }).then(function(d){
    var box = document.getElementById('chMembers'); if (!box) return;
    var m = (d&&d.members)||[];
    if (d && d.presence) { for (var k in d.presence) PRESENCE[k] = d.presence[k]; }
    box.innerHTML = m.length ? m.map(function(p){ return '<div class="ch-mem"><div class="av-wrap"><div class="people-av">'+avatarHtml(p.name,p.avatar)+'</div>'+presDotHtml(p.did)+'</div><span>'+esc(p.name)+'</span><span class="rm" onclick="removeChMember('+id+',\''+p.did+'\')"><i class="fa-solid fa-xmark"></i></span></div>'; }).join('') : '<div class="side-empty" style="text-align:left;padding:4px 8px">Aucun membre ajouté à la main</div>';
  });
}
function chMemberSearchGo(){
  var q = document.getElementById('chMemberSearch').value.trim(); var res = document.getElementById('chMemberRes');
  if (q.length<1){ res.innerHTML=''; return; }
  api('search_people&q='+encodeURIComponent(q), { headers: authHeaders() }).then(function(d){
    if (!d||!d.success){ res.innerHTML=''; return; }
    res.innerHTML = (d.people||[]).map(function(p){ return '<div class="people-i" onclick="addChMember(\''+p.did+'\')"><div class="people-av">'+avatarHtml(p.name,p.avatar)+'</div><span>'+esc(p.name)+'</span></div>'; }).join('') || '<div class="side-empty">Aucun résultat</div>';
  });
}
function addChMember(did){ api('channel_add_member', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ conv:chSettingsId, did:did }) }).then(function(d){ if (d&&d.success){ document.getElementById('chMemberSearch').value=''; document.getElementById('chMemberRes').innerHTML=''; loadChannelMembers(chSettingsId); } else toast((d&&d.error)||'Erreur', false); }); }
function removeChMember(id, did){ api('channel_remove_member', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ conv:id, did:did }) }).then(function(d){ if (d&&d.success) loadChannelMembers(id); }); }
function openGroupAdd(){
  var c = CONVS[CUR]; if (!c) return;
  var isDm = c.type === 'dm';
  var others = (c.members||[]).filter(function(m){ return m.did !== ME.did; });
  dmSel = {};
  document.getElementById('modalBox').innerHTML =
    '<h3><i class="fa-solid fa-user-plus"></i> '+(isDm?'Créer un groupe':'Ajouter des membres')+'</h3>'+
    (isDm ? '<div style="font-size:.82em;color:var(--muted);margin-bottom:12px">Un nouveau groupe sera créé avec <b>'+esc(others.map(function(m){return m.name;}).join(', '))+'</b> et les personnes ajoutées (le MP reste intact).</div>' : '')+
    '<div class="field"><label>Personnes à ajouter</label><div class="chips" id="dmChips"></div><input type="text" id="dmSearch" placeholder="Rechercher un agent…" autocomplete="off" oninput="dmSearchGo()"><div class="people-res" id="dmRes"></div></div>'+
    '<div class="mbox-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="'+(isDm?'groupCreateFromDm()':'groupAddMembers()')+'"><i class="fa-solid fa-check"></i> '+(isDm?'Créer le groupe':'Ajouter')+'</button></div>';
  document.getElementById('ovModal').classList.add('open');
  setTimeout(function(){ var el=document.getElementById('dmSearch'); if(el) el.focus(); }, 60);
}
function groupCreateFromDm(){
  var c = CONVS[CUR]; if (!c) return;
  if (!Object.keys(dmSel).length){ toast('Ajoute au moins une personne', false); return; }
  var others = (c.members||[]).filter(function(m){ return m.did !== ME.did; }).map(function(m){ return m.did; });
  var dids = others.concat(Object.keys(dmSel));
  api('create_dm', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ dids:dids }) }).then(function(d){ if (!d||!d.success){ toast((d&&d.error)||'Erreur', false); return; } closeModal(); loadConvs(function(){ navConv(d.conv_id); }); });
}
function groupAddMembers(){
  if (!Object.keys(dmSel).length){ toast('Choisis au moins une personne', false); return; }
  api('group_add_member', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ conv:CUR, dids:Object.keys(dmSel) }) }).then(function(d){ if (!d||!d.success){ toast((d&&d.error)||'Erreur', false); return; } closeModal(); loadConvs(function(){ if (CUR) renderHead(); }); toast('Membres ajoutés', true); });
}
function pickColor(col){ chColor = col; document.querySelectorAll('#chColors .color-sw').forEach(function(el){ el.classList.toggle('on', el.dataset.c===col); }); }
function pickColorCustom(v){ chColor = v; document.querySelectorAll('#chColors .color-sw').forEach(function(el){ el.classList.remove('on'); }); var cs=document.querySelector('#chColors .color-custom'); if(cs){ cs.style.background=v; cs.classList.add('on'); } }
function saveChan(id){
  var name = document.getElementById('chName').value.trim(); if (!name){ toast('Nom requis', false); return; }
  var roles = chRoleSel ? chRoleSel.get() : [];
  var folder = document.getElementById('chFolder') ? document.getElementById('chFolder').value : '';
  var act = id ? 'update_channel' : 'create_channel';
  var payload = { name:name, color:chColor, roles:roles, logo: chLogo || '', folder_id: folder || '' }; if (id) payload.id = id;
  api(act, { method:'POST', headers: jsonHeaders(), body: JSON.stringify(payload) }).then(function(d){
    if (!d||!d.success){ toast((d&&d.error)||'Erreur', false); return; }
    closeModal(); var openId = d.conv_id || id; loadConvs(function(){ if (CUR===openId) renderHead(); });
    toast(id?'Canal mis à jour':'Canal créé', true);
  });
}
function archiveChan(id, arch){
  api('archive_channel', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id:id, archived:arch }) }).then(function(d){
    if (!d||!d.success){ toast((d&&d.error)||'Erreur', false); return; }
    closeModal(); if (CUR===id && arch){ backToList(); } loadConvs(); toast(arch?'Canal archivé':'Canal réactivé', true);
  });
}
function renderSide2(){ }
function closeModal(){ document.getElementById('ovModal').classList.remove('open'); }

function startListPoll(){ if (listTimer) return; listTimer = setInterval(function(){ if (!document.hidden) loadConvs(); }, 6000); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ loadConvs(); if (CUR) fetchNew(); } });

function startRouter(){
  MDT_ROUTER.define({
    base: '/messagerie',
    routes: [ { path:'/', view:'home' }, { path:'/:id', view:'conv' } ],
    onRoute: function(m){
      var view = m.route.view, p = m.params||{}, q = m.query||{};
      if (view==='conv'){ var id = parseInt(p.id,10); if (id) { ensureOpen(id); return; } }
      if (q.c){ var cid = parseInt(q.c,10); if (cid){ ensureOpen(cid); return; } }
    },
    onNotFound: function(){}
  }).start();
}
function ensureOpen(id){ if (CONVS[id]) openConv(id); else loadConvs(function(){ if (CONVS[id]) openConv(id); }); }
function navConv(id){ if (window.MDT_ROUTER) MDT_ROUTER.go('/messagerie/' + id); else openConv(id); }

document.getElementById('btnNewDM').addEventListener('click', openNewDM);
document.getElementById('btnNewChan').addEventListener('click', openNewChan);
document.getElementById('btnNewFolder').addEventListener('click', newFolder);
document.getElementById('chLogoInput').addEventListener('change', onChLogoFile);
document.getElementById('btnAttach').addEventListener('click', pickFiles);
if (window.MDT_EMOJI) MDT_EMOJI.attach(document.getElementById('btnEmoji'), function(){ return document.getElementById('composer'); });
document.getElementById('fileInput').addEventListener('change', onFiles);
document.getElementById('btnSend').addEventListener('click', sendMessage);
document.getElementById('thSend').addEventListener('click', sendThread);
document.getElementById('threadComposer').addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendThread(); } });
document.getElementById('threadComposer').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(120,this.scrollHeight)+'px'; this.style.overflowY=this.scrollHeight>120?'auto':'hidden'; });
if (window.MDT_EMOJI) MDT_EMOJI.attach(document.getElementById('thEmoji'), function(){ return document.getElementById('threadComposer'); });
document.getElementById('composer').addEventListener('input', onComposerInput);
document.getElementById('composer').addEventListener('keydown', composerKey);
document.getElementById('convSearch').addEventListener('input', function(){ pendingFilter = this.value; loadConvs(); });

(function(){
  var t; try { t = localStorage.getItem('mdt_auth_token'); } catch(e){}
  if (!t){ setDenied(); return; }
  var EMBED = /[?&]embed\b/.test(location.search); if (EMBED){ document.body.classList.add('embed'); document.documentElement.classList.add('embed-h'); }
  function measure(){ if (EMBED){ document.documentElement.style.setProperty('--msg-h', window.innerHeight + 'px'); return; } var top = document.querySelector('.app-topbar'); var h = top ? top.getBoundingClientRect().height : 56; var reserve = (document.body.classList.contains('has-dock') && !document.body.classList.contains('dock-off')) ? 76 : 14; document.documentElement.style.setProperty('--msg-h', (window.innerHeight - h - reserve) + 'px'); }
  setTimeout(measure, 60); setTimeout(measure, 500); window.addEventListener('resize', measure);
  document.addEventListener('click', function(e){ if (e.target.closest && e.target.closest('.dock-toggle')) setTimeout(measure, 300); });
  loadConvs(function(){ if (window.MDT_ROUTER) startRouter(); startListPoll(); });
})();
</script>
<script src="/assets/credit.js" defer></script>
</body>
