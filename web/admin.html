<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT - Administration</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="admin"]{ --accent:#ef4444; --accent-2:#f87171; --accent-rgb:239,68,68; }
.app a { color:inherit; text-decoration:none; }
.wrap { max-width:1560px; margin:0 auto; padding:24px 24px 70px; }
.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#fff; } .app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); } .app .btn-ghost:hover { border-color:var(--accent); }
.btn-sm { padding:7px 12px; font-size:.8em; }
.sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.sec-head h1 { font-size:1.5em; display:flex; align-items:center; gap:11px; }
.sec-head h1 .ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:rgba(var(--accent-rgb),.15); color:var(--accent-2); }
.sub { color:var(--muted); font-size:.9em; margin-top:4px; }
.section-title, .app .section-title { font-size:.82em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin:22px 0 11px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,240px)); gap:12px; justify-content:start; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:15px 17px; }
.stat-card .sv { font-size:1.9em; font-weight:800; line-height:1; } .stat-card .sl { color:var(--muted); font-size:.8em; margin-top:6px; }
.stat-card.accent .sv { color:var(--accent-2); }
.view { display:none; } .view.on { display:block; }
#denied, #view-fatal, #view-error { display:none; text-align:center; padding:60px 20px; }
#denied .lock, #view-fatal .lock { width:64px; height:64px; border-radius:50%; background:rgba(var(--accent-rgb),.12); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:1.6em; margin:0 auto 18px; }
#view-error .ecode { font-size:3em; font-weight:800; color:var(--accent-2); }
#denied h2, #view-fatal h2, #view-error h2 { margin:6px 0 8px; } #denied p, #view-fatal p, #view-error p { color:var(--muted); margin-bottom:18px; }
.crumb-back { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:.85em; margin-bottom:14px; } .crumb-back:hover { color:var(--accent-2); }
.tabbar { display:flex; gap:5px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; overflow-y:hidden; }
.tabbar a { padding:10px 15px; font-weight:700; font-size:.86em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.tabbar a:hover { color:var(--text); } .tabbar a.on { color:var(--accent-2); border-bottom-color:var(--accent); }
.soon { font-size:.7em; font-weight:700; text-transform:uppercase; letter-spacing:.03em; background:rgba(245,158,11,.15); color:#fbbf24; border:1px solid rgba(245,158,11,.32); border-radius:999px; padding:2px 8px; white-space:nowrap; }
/* tuiles modules (home admin) */
.adm-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:14px; }
@media(min-width:1100px){ .adm-tiles { grid-template-columns:repeat(3,1fr); } }
.adm-tile { display:flex; align-items:center; gap:15px; background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:16px 18px; text-decoration:none; transition:transform .16s, border-color .16s, box-shadow .16s; }
.adm-tile.live { cursor:pointer; }
.adm-tile.live:hover { border-color:var(--tc,var(--accent)); transform:translateY(-2px); box-shadow:0 10px 26px -10px rgba(0,0,0,.5); }
.adm-tile.soon-tile { background:var(--surface-2); } .adm-tile.soon-tile .ti-ic { opacity:.55; } .adm-tile.soon-tile .ti-title { color:var(--muted); }
.adm-tile .ti-ic { width:46px; height:46px; flex:0 0 auto; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:1.12em; }
.adm-tile .ti-body { min-width:0; flex:1; }
.adm-tile .ti-title { font-weight:800; font-size:1em; color:var(--text); display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.adm-tile .ti-desc { color:var(--muted); font-size:.83em; margin-top:4px; line-height:1.4; }
.adm-tile .ti-go { color:var(--muted-2); font-size:.9em; flex:0 0 auto; transition:transform .16s, color .16s; }
.adm-tile.live:hover .ti-go { color:var(--tc,var(--accent-2)); transform:translateX(3px); }
.tb { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.wsel { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.wsel select { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; color:var(--text); font-family:inherit; font-size:.9em; }
.subtabs { display:inline-flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:4px; margin-bottom:16px; }
.subtabs button { border:none; background:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:.85em; padding:8px 15px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.subtabs button.on { background:var(--accent); color:#fff; }
.pill { font-size:.7em; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:999px; padding:2px 9px; }
.pill.cur { background:rgba(16,185,129,.16); color:#34d399; } .pill.arch { background:var(--surface-2); color:var(--muted-2); border:1px solid var(--border); }
.eff-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
table.eff { width:100%; border-collapse:collapse; font-size:.88em; }
table.eff th { text-align:left; font-size:.68em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; padding:13px 14px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; white-space:nowrap; }
table.eff td { padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.eff tbody tr:not(.grp):hover { background:rgba(var(--accent-rgb),.05); }
table.eff tr.grp td { font-weight:800; font-size:.8em; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-2); padding:11px 14px; background:var(--surface-2); }
table.eff tr.grp td .gcount { opacity:.65; font-weight:700; }
.mat-badge { display:inline-block; min-width:32px; text-align:center; font-weight:800; font-size:.92em; padding:3px 10px; border-radius:8px; letter-spacing:.02em; }
table.eff td.namecell { font-weight:600; white-space:nowrap; }
.eff-in { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text); font-family:inherit; font-size:.92em; }
.eff-in.date { width:150px; } .eff-in.note { min-width:180px; }
.eff-in:focus { outline:none; border-color:var(--accent); }
.eff-chk { width:18px; height:18px; accent-color:var(--accent); }
.jdays { color:var(--muted-2); font-size:.82em; white-space:nowrap; }
.old-grade { display:block; font-weight:600; font-size:.72em; color:#f59e0b; white-space:nowrap; margin-top:2px; }
.old-grade.down { color:#f87171; }
.old-grade i { font-size:.9em; margin-right:3px; }
.promo-cell { display:flex; flex-direction:column; gap:4px; width:150px; }
.qchips { display:flex; flex-wrap:wrap; gap:5px; min-width:150px; max-width:320px; }
.qchip { font-size:.66em; font-weight:800; padding:3px 8px; border-radius:6px; letter-spacing:.02em; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.22); }
.cer-toolbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.cer-modes { display:inline-flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:4px; }
.cer-modes button { border:none; background:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:.85em; padding:8px 16px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.cer-modes button.on { background:var(--accent); color:#fff; }
.cer-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:18px; }
.cer-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 3px 14px rgba(0,0,0,.18); }
.cer-head { display:flex; align-items:center; gap:12px; padding:15px 18px; color:#fff; font-weight:800; font-size:.98em; letter-spacing:.01em; }
.cer-head .cer-ic { width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:.95em; }
.cer-body { padding:16px 18px; }
.cer-resp-in { display:flex; align-items:center; gap:9px; margin-bottom:15px; }
.cer-resp-in i { color:var(--muted-2); }
.cer-resp-in input { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:.88em; }
.cer-resp-in input:focus { outline:none; border-color:var(--accent); }
.cer-lbl { font-size:.72em; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:700; margin:0 0 7px; }
.cer-field { margin-bottom:16px; } .cer-field:last-child { margin-bottom:0; }
.cer-items { display:flex; flex-direction:column; gap:7px; margin-bottom:9px; }
.cer-item { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:.9em; }
.cer-item .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.cer-item .txt { flex:1; overflow-wrap:anywhere; line-height:1.4; }
.cer-item .del { background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:.9em; padding:2px 4px; flex:0 0 auto; }
.cer-item .del:hover { color:#ef4444; }
.cer-add { display:flex; gap:8px; }
.cer-add input { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.88em; }
.cer-add input:focus { outline:none; border-color:var(--accent); }
.cer-add-ta { flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.9em; line-height:1.45; resize:vertical; min-height:44px; }
.cer-add-ta:focus { outline:none; border-color:var(--accent); }
.cer-add { align-items:flex-start; }
.cer-add button { flex:0 0 auto; border:none; border-radius:9px; padding:0 15px; color:#fff; font-family:inherit; font-weight:700; font-size:.82em; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.cer-add button:hover { filter:brightness(1.08); }
.cer-row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; } @media(max-width:560px){ .cer-row3 { grid-template-columns:1fr; } }
.cer-text-in { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.92em; text-align:center; font-weight:600; }
.cer-text-in:focus { outline:none; border-color:var(--accent); }
.cer-empty { color:var(--muted-2); font-size:.84em; font-style:italic; padding:2px 0; }
.savestate { font-size:.85em; color:var(--muted-2); margin-left:8px; }
.empty-state { text-align:center; padding:44px 20px; color:var(--muted); }
.todo-box { text-align:center; padding:50px 20px; color:var(--muted); background:var(--surface); border:1px dashed var(--border); border-radius:14px; }
.todo-box .ei { font-size:2em; margin-bottom:12px; color:var(--muted-2); }
/* colonne menu + heures */
table.eff th.menucol, table.eff td.menucol { width:34px; padding-left:10px; padding-right:0; }
.row-menu-btn { width:28px; height:28px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted-2); cursor:pointer; font-size:.95em; display:inline-flex; align-items:center; justify-content:center; transition:.13s; }
.row-menu-btn:hover { background:var(--surface-2); border-color:var(--border); color:var(--accent-2); }
.heures-cell { white-space:nowrap; } .heures-val { font-weight:700; }
.sanc-chip { display:inline-block; font-size:.74em; font-weight:800; padding:3px 9px; border-radius:7px; border:1px solid transparent; letter-spacing:.02em; white-space:nowrap; }
.sanc-chip.sanc-free { background:var(--surface-2); color:var(--muted); border-color:var(--border); }
/* menu déroulant de ligne */
.row-menu { position:fixed; z-index:9000; width:280px; background:var(--surface); border:1px solid var(--border); border-radius:13px; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:6px; animation:rmIn .12s ease; }
@keyframes rmIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
.row-menu .rm-head { padding:9px 11px 8px; font-size:.9em; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); margin-bottom:5px; }
.row-menu .rm-head .rm-mat { display:inline-block; background:rgba(var(--accent-rgb),.16); color:var(--accent-2); font-weight:800; padding:1px 8px; border-radius:6px; margin-right:6px; }
.row-menu .rm-head .rm-grade { font-size:.82em; color:var(--muted-2); font-weight:600; margin-top:3px; }
.row-menu .rm-item { width:100%; display:flex; align-items:center; gap:11px; background:none; border:none; color:var(--text); font-family:inherit; font-size:.9em; font-weight:600; text-align:left; padding:10px 11px; border-radius:9px; cursor:pointer; transition:.12s; }
.row-menu .rm-item i { width:16px; text-align:center; color:var(--muted-2); }
.row-menu .rm-item:hover:not([disabled]) { background:var(--surface-2); }
.row-menu .rm-item[disabled] { opacity:.4; cursor:not-allowed; }
.row-menu .rm-item .rm-tgt { margin-left:auto; font-size:.82em; font-weight:700; color:var(--muted-2); }
.row-menu .rm-up:hover:not([disabled]) i, .row-menu .rm-up:hover:not([disabled]) .rm-tgt { color:#22c55e; }
.row-menu .rm-down:hover:not([disabled]) i, .row-menu .rm-down:hover:not([disabled]) .rm-tgt { color:#f59e0b; }
.row-menu .rm-sanc:hover i { color:#eab308; }
.row-menu .rm-danger { color:#f87171; } .row-menu .rm-danger i { color:#f87171; } .row-menu .rm-danger:hover { background:rgba(239,68,68,.12); }
.row-menu .rm-sep { height:1px; background:var(--border); margin:5px 4px; }
/* modale sanction */
.adm-modal-back { position:fixed; inset:0; background:rgba(2,6,23,.72); z-index:9500; display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow-y:auto; animation:rmIn .12s ease; }
.adm-modal { background:var(--surface); border:1px solid var(--border); border-radius:18px; width:100%; max-width:640px; box-shadow:0 24px 70px rgba(0,0,0,.55); }
.adm-modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); font-weight:800; font-size:1.02em; }
.adm-modal-head .rm-mat { display:inline-block; background:rgba(var(--accent-rgb),.16); color:var(--accent-2); font-weight:800; padding:1px 8px; border-radius:6px; }
.adm-modal-head i.fa-gavel { color:#eab308; margin-right:4px; }
.adm-x { background:none; border:none; color:var(--muted-2); font-size:1.15em; cursor:pointer; padding:4px 8px; border-radius:8px; } .adm-x:hover { background:var(--surface-2); color:var(--text); }
.adm-modal-body { padding:20px 22px; }
.adm-lbl { display:block; font-size:.76em; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:700; margin:16px 0 8px; } .adm-modal-body .adm-lbl:first-child { margin-top:0; }
.adm-lbl .adm-hint { text-transform:none; letter-spacing:0; font-weight:600; color:var(--muted); }
.adm-in, .adm-ta { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-family:inherit; font-size:.93em; line-height:1.5; }
.adm-in:focus, .adm-ta:focus { outline:none; border-color:var(--accent); } .adm-ta { resize:vertical; min-height:110px; }
.sanc-types { display:flex; flex-wrap:wrap; gap:8px; }
.sanc-type-btn { border:1.5px solid var(--sc); background:transparent; color:var(--sc); font-family:inherit; font-weight:800; font-size:.82em; padding:8px 14px; border-radius:9px; cursor:pointer; transition:.13s; opacity:.75; }
.sanc-type-btn:hover { opacity:1; } .sanc-type-btn.on { background:var(--sc); color:#0b1220; opacity:1; box-shadow:0 2px 10px -2px var(--sc); }
.sanc-thumbs { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:10px; min-height:8px; }
.sanc-thumb { position:relative; width:78px; height:78px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
.sanc-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.sanc-thumb-x { position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:6px; border:none; background:rgba(2,6,23,.75); color:#fff; cursor:pointer; font-size:.7em; display:flex; align-items:center; justify-content:center; }
.sanc-add-photo { display:inline-flex; align-items:center; gap:8px; cursor:pointer; background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:10px 15px; font-size:.86em; font-weight:600; color:var(--muted); transition:.13s; }
.sanc-add-photo:hover { border-color:var(--accent); color:var(--accent-2); }
.adm-modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); }
.adm-modal-foot .btn.ghost { background:var(--surface-2); color:var(--text); border:1px solid var(--border); } .adm-modal-foot .btn.ghost:hover { border-color:var(--accent); }
.adm-modal-foot .btn.danger { background:#dc2626; color:#fff; } .adm-modal-foot .btn.danger:hover { background:#ef4444; } .adm-modal-foot .btn.danger:disabled { opacity:.6; cursor:default; }
/* Roster */
.ros-toolbar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.ros-search { position:relative; flex:1; max-width:380px; min-width:220px; }
.ros-search i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.85em; pointer-events:none; }
.ros-search input { width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; color:var(--text); font-family:inherit; font-size:.9em; }
.ros-search input:focus { outline:none; border-color:var(--accent); }
.ros-av { width:34px; height:34px; border-radius:50%; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.85em; vertical-align:middle; border:1px solid var(--border); flex:0 0 auto; }
table.ros-table th:nth-child(2), table.ros-table td:nth-child(2) { width:44px; padding-right:0; }
.grade-chip { display:inline-block; font-size:.76em; font-weight:800; padding:3px 10px; border-radius:7px; white-space:nowrap; letter-spacing:.02em; }
.disc-ok { color:#22c55e; font-size:.82em; font-weight:700; white-space:nowrap; } .disc-ok i, .disc-no i, .disc-warn i { margin-right:5px; }
.disc-no { color:var(--muted-2); font-size:.82em; } .disc-warn { color:#f59e0b; font-size:.82em; font-weight:700; white-space:nowrap; }
.ros-hint { color:var(--muted); font-size:.85em; margin-bottom:14px; }
.ros-legend { display:flex; gap:14px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:.85em; margin-bottom:16px; } .ros-legend b { color:var(--text); } .ros-legend span { display:inline-flex; align-items:center; gap:5px; }
.ros-legend .mat-lg { font-size:1.1em; line-height:1; } .mat-lg.mat-used { color:var(--muted); } .mat-lg.mat-free { color:var(--surface-3); } .mat-lg.mat-blocked { color:#f87171; }
.ros-dev-note { color:var(--muted-2); font-style:italic; }
.ros-attente { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:12px; }
.ros-wait-card { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px 14px; }
.ros-wait-body { flex:1; min-width:0; } .ros-wait-name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .ros-wait-sub { color:var(--muted-2); font-size:.82em; margin-top:2px; }
.mat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px; }
.mat-cell { position:relative; text-align:center; padding:12px 4px; border-radius:10px; font-weight:800; font-size:.95em; border:1px solid var(--border); }

<script>
var API = '/admin_api.php';
function authHeaders(extra) { var h = extra || {}; try { var t = localStorage.getItem('mdt_auth_token') || ''; if (t) h['Authorization'] = 'Bearer ' + t; } catch(e) {} return h; }
function toast(msg, ok) { if (window.MDT_TOAST) { ok ? MDT_TOAST.ok(msg) : MDT_TOAST.err(msg); } }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function can(p) { return !!PERMS[p]; }
function loadingHTML() { return '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Chargement…</div>'; }
function fmtDate(s) { if (!s) return ''; var d = new Date(String(s).replace(' ', 'T')); if (isNaN(d.getTime())) return String(s); return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }); }
var PERMS = {}, ME = {}, STATS = {}, GRADE_ORDER = [], QUALIF_COLS = [], GRADE_COLORS = {}, QUALIF_COLORS = {}, SANCTION_TYPES = [];
function sancColor(code) { for (var i = 0; i < SANCTION_TYPES.length; i++) if (SANCTION_TYPES[i].code === code) return SANCTION_TYPES[i].color; return ''; }
function hexA(hex, a) { hex = String(hex || '').replace('#', ''); if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; if (hex.length < 6) return 'rgba(148,163,184,'+a+')'; var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function contrastOn(hex) { hex = String(hex || '').replace('#', ''); if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; if (hex.length < 6) return '#fff'; var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16); return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#0b1220' : '#fff'; }
function gradeColor(g) { return GRADE_COLORS[g] || (SUP.week && SUP.week.grade_colors ? SUP.week.grade_colors[g] : '') || ''; }

var ADMIN_TABS = [
  { key:'supervision', label:'Supervision', icon:'fa-user-shield',        href:'/admin/supervision', live:true,  color:'#ef4444', desc:'Effectifs hebdomadaires & fiche de cérémonie' },
  { key:'roster',      label:'Roster',      icon:'fa-id-badge',           href:'/admin/roster',      live:true,  color:'#f59e0b', desc:'Agents, matricules, arrivées & départs' },
  { key:'penal',       label:'Code Pénal',  icon:'fa-scale-balanced',     href:'/penal/gestion',     live:true,  color:'#a855f7', desc:'Infractions, amendes & simulateur' },
  { key:'permissions', label:'Permissions', icon:'fa-key',                href:'/admin/permissions', live:true,  color:'#22c55e', desc:'Accès modules, capacités & droits par rôle' },
  { key:'dispatch',    label:'Dispatch',    icon:'fa-tower-broadcast',    href:'/admin/dispatch',    live:true,  color:'#06b6d4', desc:'Statuts du board, types de patrouille, boutons & flotte' },
  { key:'verif',       label:'Vérif Discord', icon:'fa-brands fa-discord',href:'/admin/verif',       live:true,  color:'#5865f2', desc:'Diagnostic & santé des liaisons Discord' },
  { key:'avertos',     label:'Avertissements', icon:'fa-triangle-exclamation', href:'/admin/avertos', live:true,  color:'#ef4444', desc:'Retraits de service forces & annulation des heures' },
  { key:'journal',     label:'Journal',     icon:'fa-clipboard-list',     href:'/admin/journal',     live:true,  color:'#64748b', desc:'Journal global des modifications & erreurs' }
];
function faClass(ic) { return String(ic || '').indexOf('fa-brands') > -1 ? ic : 'fa-solid ' + ic; }

function boot() {
  fetch(API + '?action=bootstrap', { headers: authHeaders() }).then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.error) { if (d && d.code === 'E-SEC-401') document.getElementById('denied').style.display = 'block'; else showFatal(); return; }
      if (!d.access || !(d.perms && d.perms.admin)) { document.getElementById('denied').style.display = 'block'; return; }
      PERMS = d.perms || {}; ME = d.me || {}; STATS = d.stats || {}; GRADE_ORDER = d.grade_order || []; QUALIF_COLS = d.qualif_cols || []; GRADE_COLORS = d.grade_colors || {}; QUALIF_COLORS = d.qualif_colors || {};
      startRouter();
    })
    .catch(function(e){ if (window.console) console.error('[ADMIN] boot', e); showFatal(); });
}
function showFatal() { document.getElementById('view-fatal').style.display = 'block'; }
function viewShow(id) { ['denied','view-fatal','view-error'].forEach(function(x){ document.getElementById(x).style.display = 'none'; }); document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === id); }); window.scrollTo(0, 0); }
function showError(code, title, msg) { document.getElementById('err-code').textContent = code; document.getElementById('err-title').textContent = title; document.getElementById('err-msg').textContent = msg || ''; document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); }); ['denied','view-fatal'].forEach(function(x){ document.getElementById(x).style.display = 'none'; }); document.getElementById('view-error').style.display = 'block'; window.scrollTo(0, 0); }

function tabbar(active) {
  return '<div class="tabbar">' + ADMIN_TABS.map(function(t){
    return '<a class="' + (active === t.key ? 'on' : '') + '" href="' + t.href + '"><i class="' + faClass(t.icon) + '"></i> ' + esc(t.label) + (t.live ? '' : ' <span class="soon">à venir</span>') + '</a>';
  }).join('') + '</div>';
}
function statCard(cls, val, label) { return '<div class="stat-card ' + cls + '"><div class="sv">' + val + '</div><div class="sl">' + esc(label) + '</div></div>'; }

function startRouter() {
  MDT_ROUTER.define({
    base: '/admin', can: can,
    routes: [
      { path:'/', view:'home' },
      { path:'/supervision', view:'supervision' },
      { path:'/supervision/:id', view:'supervision' },
      { path:'/roster', view:'roster' }, { path:'/roster/:sub', view:'roster' },
      { path:'/permissions', view:'permissions' }, { path:'/permissions/:sub', view:'permissions' },
      { path:'/verif', view:'verif' }, { path:'/verif/:sub', view:'verif' },
      { path:'/journal', view:'journal' },
      { path:'/avertos', view:'avertos' },
      { path:'/penal', view:'todo' },
      { path:'/dispatch', view:'dispatchcfg' }, { path:'/dispatch/:sub', view:'dispatchcfg' }
    ],
    onRoute: onRoute,
    onNotFound: function(){ showError('404', 'Page introuvable', 'Cette page n\'existe pas dans l\'administration V2.'); }
  }).start();
}
var CURRENT = null;
function onRoute(m) {
  var view = m.route.view, p = m.params || {};
  CURRENT = view;
  if (view === 'home') return showHome();
  if (view === 'supervision') return showSupervision(p.id || null);
  if (view === 'roster') return showRoster(p.sub || 'liste');
  if (view === 'permissions') return showPermissions(p.sub || 'modules');
  if (view === 'verif') return showVerif(p.sub || 'recherche');
  if (view === 'journal') return showJournal();
  if (view === 'avertos') return showAvertos();
  if (view === 'dispatchcfg') return showDispatchCfg(p.sub || 'statuts');
  if (view === 'todo') return showTodo(m.path);
}

function showHome() {
  var s = STATS || {};
  var h = '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-sliders"></i></span> Administration</h1>'
    + '<div class="sub">' + (ME.name ? esc(ME.name) + ' · ' : '') + 'Commandement &amp; supervision.</div></div></div>'
    + tabbar('home')
    + '<div class="stat-grid">' + statCard('accent', s.effectifs || 0, 'Effectifs') + statCard('', s.semaines || 0, 'Semaines de supervision') + '</div>'
    + '<div class="section-title">Modules d\'administration</div>'
    + '<div class="adm-tiles">' + ADMIN_TABS.map(function(t){
        var ic = '<span class="ti-ic" style="background:' + hexA(t.color, .18) + ';color:' + t.color + ';border:1px solid ' + hexA(t.color, .38) + '"><i class="' + faClass(t.icon) + '"></i></span>';
        var body = '<div class="ti-body"><div class="ti-title">' + esc(t.label) + (t.live ? '' : ' <span class="soon">à venir</span>') + '</div><div class="ti-desc">' + esc(t.desc || '') + '</div></div>';
        if (t.live) return '<a class="adm-tile live" href="' + t.href + '" style="--tc:' + t.color + '">' + ic + body + '<i class="ti-go fa-solid fa-arrow-right"></i></a>';
        return '<div class="adm-tile soon-tile">' + ic + body + '</div>';
      }).join('') + '</div>';
  document.getElementById('view-home').innerHTML = h; viewShow('view-home');
}
function showTodo(path) {
  var tab = ADMIN_TABS.filter(function(t){ return path && path.indexOf(t.href) === 0; })[0];

function vrfSearch() {
  var inp = document.getElementById('vrf-q'); var q = inp ? inp.value.trim() : (VRF.q || ''); VRF.q = q;
  var res = document.getElementById('vrf-results'); if (!res) return;
  if (q.length < 2) { res.innerHTML = '<div class="empty-state">Tape au moins 2 caractères.</div>'; return; }
  res.innerHTML = loadingHTML();
  MDT_SKEL.show('#vrf-results', 'cards');
  fetch(API + '?action=verif_search&q=' + encodeURIComponent(q), { headers: authHeaders() }).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.success) { res.innerHTML = '<div class="empty-state">Erreur de recherche.</div>'; return; }
    VRF.grade_colors = d.grade_colors || {}; VRF.qualif_colors = d.qualif_colors || {};
    res.innerHTML = vrfResultsHtml(d);
  }).catch(function(){ res.innerHTML = '<div class="empty-state">Erreur réseau.</div>'; });
}
function vrfResultsHtml(d) {
  var users = d.users || [], rbm = d.roster_by_matricule || [], rbd = d.roster_by_discord || [];
  if (!users.length && !rbm.length && !rbd.length) return '<div class="empty-state">Aucun résultat pour « ' + esc(d.query || '') +' ».</div>';
  var linked = {}; users.forEach(function(u){ if (u.discord_id) linked[String(u.discord_id)] = 1; });
  var h = '';
  rbm.concat(rbd).forEach(function(r){ if (!r.discord_id || !linked[String(r.discord_id)]) h += vrfRosterCard(r); });
  users.forEach(function(u){ h += vrfUserCard(u); });
  return h;
}
function vrfRosterCard(r) {

    + '<div class="adm-mini" style="margin-top:8px">' + (r.discord_id ? 'Discord <code>' + esc(r.discord_id) + '</code> présent dans le roster mais <b>aucun compte MDT</b> lié.' : 'Aucun Discord dans le roster pour ce matricule.') + ' À corriger via le module <a href="/admin/roster">Roster</a>.</div></div>';

function vrfCardData(btn) { var c = btn.closest ? btn.closest('.vrf-card') : null; return c ? { uid:c.getAttribute('data-uid'), did:c.getAttribute('data-did'), username:c.getAttribute('data-username') } : {}; }
function vrfRefresh(btn) {

  fetch(PERMS_API + '?action=admin_refresh_member', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify({ discord_id: d.did }) })
    .then(function(r){ return r.json().then(function(x){ return { ok:r.ok, d:x }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.success) { toast(x.d.cached ? 'Bot indisponible — rôles inchangés' : 'Rôles rafraîchis (' + x.d.roles_count + ')', true); vrfSearch(); } else { toast((x.d && x.d.error) || 'Échec', false); if (ic) ic.className = 'fa-solid fa-rotate'; } })
    .catch(function(){ toast('Erreur réseau', false); if (ic) ic.className = 'fa-solid fa-rotate'; });
}
async function vrfUnlink(btn) {
  var d = vrfCardData(btn); if (!d.uid) return;
  if (!await MDT_CONFIRM('Détacher le Discord du compte « ' + (d.username || '') + ' » ?\n\nL\'agent pourra ensuite lier un autre Discord via /login.', { title: 'Détacher le Discord', okLabel: 'Détacher', danger: true, icon: 'fa-link-slash' })) return;
  fetch(API + '?action=verif_unlink', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify({ user_id: parseInt(d.uid, 10) }) })
    .then(function(r){ return r.json(); }).then(function(x){ if (x && x.success) { toast('Discord détaché', true); vrfSearch(); } else toast((x && x.error) || 'Échec', false); }).catch(function(){ toast('Erreur réseau', false); });
}
function vrfLinkModal(btn) {

function vrfLinkSave(uid) {
  var did = ((document.getElementById('vrf-did') || {}).value || '').trim();
  if (!/^\d{10,30}$/.test(did)) { toast('Discord ID invalide (chiffres uniquement)', false); return; }
  var btn = document.getElementById('vrf-apply'); if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }
  fetch(API + '?action=verif_link', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify({ user_id: parseInt(uid, 10), discord_id: did }) })
    .then(function(r){ return r.json().then(function(x){ return { ok:r.ok, d:x }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.success) { toast('Discord lié', true); closeModal(); vrfSearch(); } else { toast((x.d && x.d.error) || 'Échec', false); if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-link"></i> Lier'; } } })
    .catch(function(){ toast('Erreur réseau', false); if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-link"></i> Lier'; } });
}

var PRM = { sub:'modules', roles:[], rolesById:{} };
var PERMS_API = '/login/permissions_api.php';
function prmLoadRoles(cb) {
  if (PRM.roles.length) return cb();
  fetch(PERMS_API + '?action=list_roles', { headers: authHeaders() }).then(function(r){ return r.json(); })
    .then(function(d){ var arr = Array.isArray(d) ? d : (d.roles || []); PRM.roles = arr.map(function(r){ return { id:String(r.role_id || r.id), name:r.name, color:r.color, position:r.position }; }); PRM.rolesById = {}; PRM.roles.forEach(function(r){ PRM.rolesById[r.id] = r; }); cb(); })
    .catch(function(){ cb(); });
}
function prmRoleName(id) { var r = PRM.rolesById[id]; return r ? r.name : id; }
function prmRoleColor(id) { var r = PRM.rolesById[id]; return (r && r.color) ? r.color : '#8b98a5'; }
function showPermissions(sub) {
  PRM.sub = (sub === 'capacites' || sub === 'avances') ? sub : 'modules';
  var host = document.getElementById('view-permissions'); host.innerHTML = loadingHTML(); viewShow('view-permissions');
  prmLoadRoles(function(){ renderPrmShell(); });
}
function prmSubBtn(key, icon, label) { return '<button class="' + (PRM.sub === key ? 'on' : '') + '" onclick="MDT_ROUTER.go(\'/admin/permissions' + (key === 'modules' ? '' : '/' + key) + '\')"><i class="fa-solid ' + icon + '"></i> ' + esc(label) + '</button>'; }
function renderPrmShell() {

  h += '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-key"></i></span> Permissions</h1><div class="sub">Accès des rôles Discord aux modules &amp; capacités.</div></div>'
     + '<button class="btn btn-ghost btn-sm" onclick="prmSyncRoles()" title="Rafraîchir le cache des rôles depuis Discord"><i class="fa-solid fa-rotate"></i> Synchroniser les rôles</button></div>';
  h += '<div class="subtabs">' + prmSubBtn('modules', 'fa-cubes', 'Accès modules') + prmSubBtn('capacites', 'fa-sliders', 'Capacités par module') + prmSubBtn('avances', 'fa-user-lock', 'Droits avancés') + '</div>';

function renderPrmBody() {

function prmSyncRoles() {
  toast('Synchronisation des rôles…', true);
  fetch(PERMS_API + '?action=refresh_roles', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body:'{}' })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.error) { toast(x.d.error, false); return; } PRM.roles = []; toast('Rôles synchronisés', true); showPermissions(PRM.sub); })
    .catch(function(){ toast('Erreur réseau', false); });

    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.success) { toast('« ' + key + ' » mis à jour', true); prmUpdatePublicBadge(idx, ids.length); } else toast((x.d && x.d.error) || 'Refusé', false); })
    .catch(function(){ toast('Erreur réseau', false); });

    var t = ev.target; if (!t || !t.getAttribute) return;
    var f = t.getAttribute('data-f'); if (!f) return;
    var isDC = (t.type === 'date' || t.type === 'checkbox');

    if (ev.type === 'change' && !isDC) return;
    var tr = t.closest('tr[data-mat]'); if (!tr) return;
    var mat = tr.getAttribute('data-mat');
    if (f === 'effectif') return effEdit(mat, 'effectif', t.checked);

  tbl.addEventListener('change', handle);

    var btn = ev.target.closest ? ev.target.closest('.row-menu-btn') : null; if (!btn) return;

    var h = '<div class="subtabs" style="margin-bottom:16px">'
      + '<button type="button" onclick="avtSemaine(-1)"><i class="fa-solid fa-chevron-left"></i></button>'
      + '<button type="button" class="on" style="cursor:default">Semaine ' + esc(avtLabel(AVT.semaine)) + (courante ? ' · en cours' : '') + '</button>'
      + '<button type="button" onclick="avtSemaine(1)"' + (courante ? ' disabled style="opacity:.35;cursor:not-allowed"' : '') + '><i class="fa-solid fa-chevron-right"></i></button>'
      + '</div>'
      + '<div class="stat-grid">'
      + statCard('', ordre.length, 'Agents avertis')
      + statCard('', list.length, 'Avertissements')
      + statCard(sanctionnes ? 'accent' : '', sanctionnes, 'Semaines annulées')
      + '</div>';

    if (!ordre.length) {
      body.innerHTML = h + '<div class="empty-state"><div class="ei"><i class="fa-solid fa-circle-check"></i></div>Aucun avertissement sur cette semaine.</div>';
      return;
    }

    h += '<table class="eff"><thead><tr><th>Agent</th><th>Rang</th><th>Motif</th><th>Posé par</th><th>Date</th><th style="width:40px"></th></tr></thead><tbody>';
    ordre.forEach(function (k) {
      var g = par[k], puni = g.total >= 3;
      h += '<tr class="grp"><td colspan="6">' + esc(g.mat) + ' — ' + esc(g.nom)
        + ' <span class="gcount">' + g.total + '/3</span>'
        + (puni ? ' <span style="color:#ef4444;font-weight:800"><i class="fa-solid fa-ban"></i> heures de la semaine annulées</span>' : '')
        + '</td></tr>';
      g.lignes.forEach(function (a) {
        h += '<tr>'
          + '<td class="namecell" style="padding-left:26px;color:var(--muted)">' + esc(a.matricule) + '</td>'
          + '<td><b style="color:' + (parseInt(a.rang, 10) >= 3 ? '#ef4444' : 'var(--accent-2)') + '">' + esc(a.rang) + '/3</b></td>'
          + '<td>' + esc(a.motif || '—') + '</td>'
          + '<td>' + esc((a.by_mat ? a.by_mat + ' — ' : '') + (a.by_name || '—')) + '</td>'
          + '<td style="white-space:nowrap;color:var(--muted-2)">' + esc(a.created_at || '') + '</td>'
          + '<td><button type="button" title="Retirer cet avertissement" onclick="avtRetirer(' + parseInt(a.id, 10) + ')" style="border:none;background:none;color:#ef4444;cursor:pointer;padding:4px 6px"><i class="fa-solid fa-trash"></i></button></td>'
          + '</tr>';
      });
    });
    body.innerHTML = h + '</tbody></table>';
  }

  function avtSemaine(n) { AVT.semaine = avtDecale(AVT.semaine, n); loadAvertos(); }

  async function avtRetirer(id) {
    var ok = await MDT_CONFIRM('Retirer cet avertissement ?\n\nLes avertissements suivants de l\'agent sont renumérotés. S\'il repasse sous 3, ses heures de la semaine sont rétablies.',
      { title: 'Retirer l\'avertissement', okLabel: 'Retirer', icon: 'fa-trash' });
    if (!ok) return;
    fetch(DP_API + '?action=averto_del', { method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ id: id }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success) {
          var n = parseInt(d.services_restaures, 10) || 0;
          toast(n ? 'Retiré — ' + n + ' service(s) rétabli(s)' : 'Avertissement retiré', true);
          loadAvertos();
        } else toast((d && d.error) || 'Refusé', false);
      })
      .catch(function () { toast('Erreur réseau', false); });
  }
boot();
</script>
<script src="/assets/imgpicker.js"></script>
<script src="/assets/credit.js" defer></script>
</body>
</html>
