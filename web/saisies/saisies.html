<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="saisies"]{ --accent:#f97316; --accent-2:#fb923c; --accent-rgb:249,115,22; }
.app a { color:inherit; text-decoration:none; }
.app a:hover { text-decoration:none; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 70px; }
.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#1a0d02; }
.app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.app .btn-ghost:hover { border-color:var(--accent); }
.btn-sm { padding:7px 12px; font-size:.82em; }
.btn-danger { background:transparent; border:1px solid var(--border); color:var(--muted); }
.btn-danger:hover { border-color:var(--danger); color:var(--danger); }
.crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:7px; font-size:.82em; color:var(--muted); margin-bottom:18px; }
.crumbs a { color:var(--muted); } .crumbs a:hover { color:var(--accent-2); }
.crumbs .sep { opacity:.5; } .crumbs .here { color:var(--text); font-weight:600; overflow-wrap:anywhere; min-width:0; }
.sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.sec-head h1 { font-size:1.5em; display:flex; align-items:center; gap:11px; flex-wrap:wrap; min-width:0; overflow-wrap:anywhere; }
.sec-head h1 .ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.05em; flex:0 0 auto; background:rgba(var(--accent-rgb),.15); color:var(--accent-2); }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:11px; margin-bottom:20px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 16px; }
.stat-card .sv { font-size:1.7em; font-weight:800; }
.stat-card .sl { color:var(--muted); font-size:.8em; margin-top:1px; }
.section-title { font-size:.82em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; margin:0 0 12px; }
.gest-nav { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.gest-nav a { padding:9px 14px; font-size:.85em; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; }
.gest-nav a.active { color:var(--accent-2); border-bottom-color:var(--accent); }
.gest-nav a:hover { color:var(--text); }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
.search { position:relative; flex:1 1 240px; min-width:190px; }
.search i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.9em; }
.search input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 14px 11px 36px; color:var(--text); font-family:inherit; font-size:.92em; }
.search input:focus { outline:none; border-color:var(--accent); }
.filter { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.85em; cursor:pointer; }
.filter:focus { outline:none; border-color:var(--accent); }
.count { color:var(--muted-2); font-size:.8em; margin-bottom:10px; }
.doc-list { display:flex; flex-direction:column; gap:9px; }
.s-row { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 16px; cursor:pointer; transition:.15s; display:flex; align-items:center; gap:13px; border-left:3px solid var(--border); }
.s-row:hover { border-color:var(--accent); }
.s-ic { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:.9em; }
.s-body { flex:1; min-width:0; }
.s-title { font-weight:700; overflow-wrap:break-word; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.s-sub { color:var(--muted); font-size:.82em; margin-top:2px; display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.s-when { font-size:.76em; color:var(--muted-2); flex:0 0 auto; white-space:nowrap; text-align:right; }
.badge { font-size:.66em; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.badge-stolen { color:var(--danger); background:rgba(239,68,68,.14); }
.badge-poste { color:var(--muted); background:var(--surface-2); border:1px solid var(--border); }
.load-more { display:block; margin:16px auto 0; }
.article { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 26px; }
.a-head { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.a-ic { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:1.2em; }
.a-htext { flex:1; min-width:0; } .a-htext h1 { font-size:1.3em; overflow-wrap:break-word; }
.a-sub { color:var(--muted); font-size:.85em; margin-top:3px; }
.a-actions { display:flex; flex-wrap:wrap; gap:8px; }
.kv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:11px; margin-top:20px; }
.kv { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
.kv .k { font-size:.7em; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:700; }
.kv .v { margin-top:3px; overflow-wrap:break-word; }
.stolen-box { margin-top:20px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3); border-radius:11px; padding:14px 16px; }
.stolen-box .st-h { color:var(--danger); font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.weapon-img { width:100%; max-width:220px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); margin-top:14px; }
.inv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.inv-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px; text-align:center; cursor:pointer; transition:.15s; display:block; }
.inv-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.inv-card .iv-img { width:100%; height:78px; object-fit:contain; margin-bottom:8px; }
.inv-card .iv-ph { width:100%; height:78px; display:flex; align-items:center; justify-content:center; font-size:2em; color:var(--muted-2); margin-bottom:8px; }
.inv-card .iv-name { font-weight:700; font-size:.86em; overflow-wrap:break-word; }
.inv-card .iv-count { color:var(--accent-2); font-weight:800; margin-top:3px; }
.inv-card .iv-stolen { font-size:.72em; color:var(--danger); margin-top:2px; }
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .es-ic { font-size:2.4em; opacity:.4; margin-bottom:12px; }
#denied, #view-fatal, #view-error { display:none; text-align:center; padding:80px 20px; }
#denied .lock, #view-fatal .lock, #view-error .ecode { font-size:2.8em; margin-bottom:12px; }
#denied .lock { color:var(--danger); } #view-fatal .lock { color:var(--warning); } #view-error .ecode { font-weight:800; color:var(--accent); }
#denied h2, #view-fatal h2, #view-error h2 { font-size:1.25em; margin-bottom:8px; }
#denied p, #view-fatal p, #view-error p { color:var(--muted); max-width:460px; margin:0 auto 20px; line-height:1.6; }
.view { display:none; } .view.on { display:block; }
.ov { display:none; position:fixed; inset:0; background:rgba(2,6,23,.7); z-index:8000; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
.ov.open { display:flex; }
.editor { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:640px; padding:24px 26px; }
.editor h2 { font-size:1.2em; margin-bottom:18px; }
.editor .field { margin-bottom:14px; }
.editor label { display:block; font-size:.78em; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); margin-bottom:6px; }
.editor input, .editor select, .editor textarea { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:11px 13px; color:var(--text); font-family:inherit; font-size:.95em; }
.editor textarea { min-height:70px; resize:vertical; }
.editor input:focus, .editor select:focus, .editor textarea:focus { outline:none; border-color:var(--accent); }
.ed-row { display:flex; gap:10px; flex-wrap:wrap; } .ed-row > .field { flex:1 1 140px; margin-bottom:0; }
.type-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.type-tab { padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; font-size:.84em; font-weight:600; }
.type-tab.on { border-color:var(--accent); color:var(--accent-2); background:rgba(var(--accent-rgb),.1); }
.acc-row { display:flex; gap:14px; flex-wrap:wrap; }
.acc-row label { display:flex; align-items:center; gap:7px; font-size:.86em; text-transform:none; letter-spacing:0; color:var(--text); font-weight:500; cursor:pointer; }
.acc-row input { width:auto; }
.ed-foot { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
.tagset-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); } .tagset-row:last-child { border-bottom:none; }
@media (max-width:640px){ .wrap{ padding:18px 14px 60px; } .article{ padding:18px 16px; } .editor{ padding:18px 16px; } .ov{ padding:20px 12px; } .s-when{ display:none; } }
</style>
</head>

}
function renderEditor(s) {
  var h = '<h2>' + (s ? 'Modifier la saisie' : 'Nouvelle saisie') + '</h2>';
  h += '<div class="ed-row"><div class="field"><label>Agent</label><input type="text" id="ed-agent" placeholder="MM | Nom Prénom" value="' + esc(s ? s.agent : '') + '"></div>' +
    '<div class="field"><label>Date</label><input type="date" id="ed-date" value="' + esc(s ? (s.date_saisie || '') : '') + '"></div>' +
    '<div class="field"><label>Poste</label><select id="ed-poste"><option value="sud"' + (s && s.poste === 'nord' ? '' : ' selected') + '>Sud</option><option value="nord"' + (s && s.poste === 'nord' ? ' selected' : '') + '>Nord</option></select></div></div>';
  h += '<div class="field"><label>Type</label><div class="type-tabs" id="ed-tabs">' + Object.keys(TYPE_META).map(function(k){ return '<div class="type-tab' + (k === edType ? ' on' : '') + '" onclick="setEdType(\'' + k + '\')"><i class="fa-solid ' + TYPE_META[k].ic + '"></i> ' + TYPE_META[k].label + '</div>'; }).join('') + '</div></div>';
  h += '<div id="ed-typefields"></div>';
  h += '<div class="field"><label>Saisi sur (personne)</label><input type="text" id="ed-ss" placeholder="Nom du suspect (optionnel)" value="' + esc(s ? (s.saisi_sur || '') : '') + '"></div>';
  h += '<div class="field"><label>Motif</label><textarea id="ed-motif" placeholder="Motif de la saisie…">' + esc(s ? (s.motif || '') : '') + '</textarea></div>';
  h += '<div class="field"><label>Notes</label><textarea id="ed-notes" placeholder="Notes complémentaires (optionnel)…">' + esc(s ? (s.notes || '') : '') + '</textarea></div>';
  h += '<div class="ed-foot"><button class="btn btn-ghost" onclick="closeEditor()">Annuler</button><button class="btn btn-primary" id="ed-save" onclick="saveSaisie()"><i class="fa-solid fa-check"></i> Enregistrer</button></div>';
  document.getElementById('editor-box').innerHTML = h;
  attachSaisieAC();
  renderTypeFields(s);
}
function setEdType(t) { edType = t; document.querySelectorAll('#ed-tabs .type-tab').forEach(function(el, i){ el.classList.toggle('on', Object.keys(TYPE_META)[i] === t); }); renderTypeFields(S_BY_ID[edId] || null); }
function renderTypeFields(s) {
  var box = document.getElementById('ed-typefields'), h = '';
  if (edType === 'arme') {
    h += '<div class="field"><label>Modèle</label><input type="text" id="ed-am" placeholder="Modèle d\'arme" value="' + esc(s && s.type === 'arme' ? (s.arme_modele || '') : '') + '"></div>';
    h += '<div class="field"><label>N° de série</label><input type="text" id="ed-as" placeholder="Numéro de série" value="' + esc(s && s.type === 'arme' ? (s.arme_serial || '') : '') + '"></div>';
    h += '<div class="field"><label>Accessoires</label><div class="acc-row">' + ACC_OPTS.map(function(a){ return '<label><input type="checkbox" value="' + esc(a) + '"' + (edAcc[a] ? ' checked' : '') + '> ' + esc(a) + '</label>'; }).join('') + '</div></div>';
    if (SD_ARMES.length) h += '<div class="field"><label>Analyse SD liée (optionnel)</label><select id="ed-sd"><option value="">— Aucune —</option>' + SD_ARMES.map(function(a){ return '<option value="' + esc(a.id) + '"' + (s && s.sd_analyse_id === a.id ? ' selected' : '') + '>' + esc(a.case_name || a.id) + '</option>'; }).join('') + '</select></div>';
  } else if (edType === 'drogue') {
    h += '<div class="field"><label>Variété</label><input type="text" id="ed-dv" placeholder="Variété" value="' + esc(s && s.type === 'drogue' ? (s.drogue_variete || '') : '') + '"></div>';
    h += '<div class="field"><label>Quantité</label><input type="text" id="ed-dq" placeholder="Ex : 12 sachets" value="' + esc(s && s.type === 'drogue' ? (s.drogue_quantite || '') : '') + '"></div>';
  } else {
    h += '<div class="field"><label>Description</label><input type="text" id="ed-od" placeholder="Description de l\'objet" value="' + esc(s && s.type === 'objet' ? (s.objet_description || '') : '') + '"></div>';
    h += '<div class="field"><label>Quantité</label><input type="text" id="ed-oq" placeholder="Ex : 3" value="' + esc(s && s.type === 'objet' ? (s.objet_quantite || '') : '') + '"></div>';
  }
  box.innerHTML = h;
  if (window.MDT_AUTOCOMPLETE && edType==='arme'){ var em=document.getElementById('ed-am'); if(em) MDT_AUTOCOMPLETE.attach(em,{source:function(){return WEAPON_OPTIONS;},force:true}); }
}
function saveSaisie() {
  var agent = document.getElementById('ed-agent').value.trim();
  var motif = document.getElementById('ed-motif').value.trim();
  if (!agent) { toast('Agent requis', false); return; }
  if (!motif) { toast('Motif requis', false); return; }
  var payload = { agent: agent, type: edType, motif: motif, saisi_sur: document.getElementById('ed-ss').value.trim(), notes: document.getElementById('ed-notes').value.trim(), poste: document.getElementById('ed-poste').value, date_saisie: document.getElementById('ed-date').value };
  if (edType === 'arme') {
    payload.arme_modele = document.getElementById('ed-am').value.trim();
    payload.arme_serial = document.getElementById('ed-as').value.trim();
    payload.arme_accessoires = Array.prototype.map.call(document.querySelectorAll('#ed-typefields .acc-row input:checked'), function(c){ return c.value; }).join(', ');
    var sd = document.getElementById('ed-sd'); payload.sd_analyse_id = sd ? sd.value : '';
  } else if (edType === 'drogue') { payload.drogue_variete = document.getElementById('ed-dv').value.trim(); payload.drogue_quantite = document.getElementById('ed-dq').value.trim(); }
  else { payload.objet_description = document.getElementById('ed-od').value.trim(); payload.objet_quantite = document.getElementById('ed-oq').value.trim(); }
  if (edId) payload.id = edId;
  var btn = document.getElementById('ed-save'); btn.disabled = true;
  fetch(API + '?action=' + (edId ? 'update' : 'create'), { method:'POST', headers: jsonHeaders(), body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(d){ btn.disabled = false; if (d && d.success) { toast(edId ? 'Saisie modifiée' : 'Saisie enregistrée', true); var nid = edId || d.id; closeEditor(); reloadBootstrap(function(){ MDT_ROUTER.go('/saisies/' + encodeURIComponent(nid)); }); } else toast((d && d.error) || 'Erreur', false); })
    .catch(function(){ btn.disabled = false; toast('Erreur réseau', false); });
}
function closeEditor() { document.getElementById('ov-editor').classList.remove('open'); }

function openStolen(id) {
  document.getElementById('modal-box').innerHTML = '<h2>Marquer l\'arme comme volée</h2>' +
    '<div class="field"><label>Raison / circonstances</label><textarea id="st-raison" placeholder="Comment l\'arme a-t-elle été perdue/volée ?"></textarea></div>' +
    '<div class="field"><label>Agent déclarant</label><input type="text" id="st-agent" placeholder="MM | Nom"></div>' +
    '<div class="ed-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="markStolen(\'' + esc(id) + '\')"><i class="fa-solid fa-triangle-exclamation"></i> Marquer volée</button></div>';
  document.getElementById('ov-modal').classList.add('open');
  if (window.MDT_AUTOCOMPLETE) { var sa = document.getElementById('st-agent'); if (sa) MDT_AUTOCOMPLETE.attach(sa, { source: function(){ return AGENT_OPTIONS; } }); }
}
function markStolen(id) {
  var raison = document.getElementById('st-raison').value.trim();
  if (!raison) { toast('Raison requise', false); return; }
  fetch(API + '?action=mark_stolen', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id, raison: raison, agent: document.getElementById('st-agent').value.trim() }) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { toast('Arme marquée volée', true); closeModal(); reloadBootstrap(function(){ MDT_ROUTER.refresh(); }); } else toast('Erreur', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}
function unmarkStolen(id) {
  confirmModal('Retirer le statut « volée » de cette arme ?', function(){
    fetch(API + '?action=unmark_stolen', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { toast('Statut retiré', true); reloadBootstrap(function(){ MDT_ROUTER.refresh(); }); } else toast('Erreur', false); })
      .catch(function(){ toast('Erreur réseau', false); });
  });
}

function confirmDelete(id) {
  confirmModal('Supprimer définitivement cette saisie ? Cette action est irréversible.', function(){
    fetch(API + '?action=delete', { method:'POST', headers: jsonHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { toast('Saisie supprimée', true); reloadBootstrap(function(){ MDT_ROUTER.go('/saisies/'); }); } else toast('Erreur', false); })
      .catch(function(){ toast('Erreur réseau', false); });
  });
}
function confirmModal(msg, onYes) {
  document.getElementById('modal-box').innerHTML = '<h2>Confirmation</h2><p style="color:var(--muted);line-height:1.6;margin-bottom:8px">' + esc(msg) + '</p><div class="ed-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" id="cm-yes"><i class="fa-solid fa-check"></i> Confirmer</button></div>';
  document.getElementById('ov-modal').classList.add('open');
  document.getElementById('cm-yes').onclick = function(){ closeModal(); onYes(); };
}
function closeModal() { document.getElementById('ov-modal').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeEditor(); closeModal(); } });

boot();
</script>
<script src="/assets/credit.js" defer></script>
</body>
</html>
