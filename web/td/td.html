<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT - Training Division</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="td"]{ --accent:#10b981; --accent-2:#34d399; --accent-rgb:16,185,129; }
.app a { color:inherit; text-decoration:none; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 70px; }
.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#052e1c; }
.app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.app .btn-ghost:hover { border-color:var(--accent); }
.sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.sec-head h1 { font-size:1.5em; display:flex; align-items:center; gap:11px; flex-wrap:wrap; min-width:0; }
.sec-head h1 .ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.05em; flex:0 0 auto; background:rgba(var(--accent-rgb),.15); color:var(--accent-2); }
.sec-head .sub { color:var(--muted); font-size:.9em; margin-top:4px; }
.section-title { font-size:.82em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; margin:26px 0 12px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:15px 17px; }
.stat-card .sv { font-size:1.9em; font-weight:800; line-height:1; }
.stat-card .sl { color:var(--muted); font-size:.8em; margin-top:6px; }
.stat-card.accent .sv { color:var(--accent-2); }
.stat-card.good .sv { color:#34d399; }
.stat-card.warn .sv { color:#f59e0b; }
.stat-card.bad .sv { color:#ef4444; }
.tile-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:13px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 17px; display:flex; gap:13px; align-items:flex-start; transition:.15s; }
.tile.live { cursor:pointer; }
.tile.live:hover { border-color:var(--accent); transform:translateY(-2px); }
.tile.soon { opacity:.62; }
.tile .t-ic { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.1em; flex:0 0 auto; background:rgba(var(--accent-rgb),.13); color:var(--accent-2); }
.tile .t-b { min-width:0; }
.tile .t-title { font-weight:700; font-size:.98em; display:flex; align-items:center; gap:8px; }
.tile .t-desc { color:var(--muted); font-size:.82em; margin-top:3px; line-height:1.35; }
.badge-soon { font-size:.64em; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:var(--surface-2); color:var(--muted-2); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }
#denied, #view-fatal, #view-error { display:none; text-align:center; padding:60px 20px; }
#denied .lock, #view-fatal .lock { width:64px; height:64px; border-radius:50%; background:rgba(var(--accent-rgb),.12); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:1.6em; margin:0 auto 18px; }
#view-error .ecode { font-size:3em; font-weight:800; color:var(--accent-2); }
#denied h2, #view-fatal h2, #view-error h2 { margin:6px 0 8px; }
#denied p, #view-fatal p, #view-error p { color:var(--muted); margin-bottom:18px; }
.view { display:none; } .view.on { display:block; }
.crumb-back { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:.85em; margin-bottom:14px; }
.crumb-back:hover { color:var(--accent-2); }
.tb { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.ep-list { display:flex; flex-direction:column; gap:10px; }
.ep-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 16px; display:flex; align-items:center; gap:14px; }
.ep-ord { color:var(--muted-2); font-weight:800; font-size:1.05em; min-width:26px; text-align:center; flex:0 0 auto; }
.ep-info { flex:1; min-width:0; }
.ep-info .en { font-weight:700; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.ep-info .es { font-size:.8em; color:var(--muted); margin-top:3px; }
.ep-badge { font-size:.66em; font-weight:700; text-transform:uppercase; letter-spacing:.03em; border-radius:999px; padding:2px 9px; }
.ep-badge.notation { background:rgba(59,130,246,.18); color:#60a5fa; }
.ep-badge.temps { background:rgba(245,158,11,.18); color:#fbbf24; }
.ep-badge.simple { background:rgba(148,163,184,.18); color:#94a3b8; }
.ep-act { display:flex; gap:5px; flex:0 0 auto; }
.ep-act button { background:var(--surface-2); border:1px solid var(--border); color:var(--muted); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:.8em; }
.ep-act button:hover { color:var(--text); border-color:var(--accent); }
.ep-act button.del:hover { color:#ef4444; border-color:#ef4444; }
.ep-act button:disabled { opacity:.32; cursor:default; }
.ov { display:none; position:fixed; inset:0; background:rgba(2,6,23,.7); z-index:8000; align-items:flex-start; justify-content:center; padding:44px 20px; overflow-y:auto; }
.ov.open { display:flex; }
.modal-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:520px; padding:22px 24px; }
.modal-box h2 { font-size:1.15em; margin-bottom:16px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:.78em; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); margin-bottom:6px; }
.field input, .field select { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:11px 13px; color:var(--text); font-family:inherit; font-size:.95em; }
.field input:focus, .field select:focus { outline:none; border-color:var(--accent); }
.modal-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
/* Recrutement */
.sess-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:13px; }
.sess-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 17px; cursor:pointer; transition:.15s; position:relative; }
.sess-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.sess-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.sess-promo { font-weight:700; font-size:1.02em; }
.sess-meta { color:var(--muted); font-size:.82em; margin-top:4px; }
.sess-del { background:transparent; border:none; color:var(--muted-2); cursor:pointer; font-size:.85em; padding:2px 5px; border-radius:6px; flex:0 0 auto; }
.sess-del:hover { color:#ef4444; }
.lock-tag { display:inline-flex; align-items:center; gap:5px; background:rgba(245,158,11,.14); color:#fbbf24; padding:2px 9px; border-radius:999px; font-size:.66em; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.sess-card .lock-tag { position:absolute; top:11px; right:12px; }
.v-chips { display:flex; gap:6px; margin-top:11px; flex-wrap:wrap; }
.v-chip { font-size:.74em; font-weight:700; border-radius:7px; padding:2px 9px; min-width:26px; text-align:center; }
.v-chip.oui { background:rgba(16,185,129,.16); color:#34d399; }
.v-chip.mais { background:rgba(59,130,246,.16); color:#60a5fa; }
.v-chip.rep { background:rgba(245,158,11,.16); color:#fbbf24; }
.v-chip.non { background:rgba(239,68,68,.16); color:#f87171; }
.v-chip.pend { background:var(--surface-2); color:var(--muted-2); }
.sess-form { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
@media(max-width:560px){ .sess-form { grid-template-columns:1fr; } }
.add-rec { display:flex; gap:9px; margin-bottom:14px; flex-wrap:wrap; }
.add-rec input { flex:1 1 140px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.92em; }
.add-rec input:focus { outline:none; border-color:var(--accent); }
.rec-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; margin-bottom:10px; overflow:hidden; }
.rec-head { display:flex; align-items:center; gap:13px; padding:12px 15px; cursor:pointer; }
.rec-head:hover { background:var(--surface-2); }
.rec-num { color:var(--muted-2); font-weight:800; min-width:24px; text-align:center; flex:0 0 auto; }
.rec-id { flex:1; min-width:0; }
.rec-id .rn { font-weight:700; }
.rec-id .rs { font-size:.78em; color:var(--muted); margin-top:1px; }
.rec-verdicts { display:flex; gap:4px; flex:0 0 auto; flex-wrap:wrap; }
.vb { background:var(--surface-2); border:1px solid var(--border); color:var(--muted); border-radius:7px; padding:5px 9px; font-size:.72em; font-weight:700; cursor:pointer; font-family:inherit; }
.vb:hover:not(:disabled) { color:var(--text); border-color:var(--accent); }
.vb:disabled { cursor:default; opacity:.7; }
.rec-chev { color:var(--muted-2); transition:.2s; flex:0 0 auto; }
.rec-card.open .rec-chev { transform:rotate(180deg); }
.rec-body { display:none; padding:0 15px 14px; }
.rec-card.open .rec-body { display:block; }
.rec-table { width:100%; border-collapse:collapse; }
.rec-table th { text-align:left; font-size:.72em; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:700; padding:8px 8px; border-bottom:1px solid var(--border); }
.rec-table td { padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
.rec-table .ep-nm { font-weight:600; font-size:.9em; }
.rec-table tr.ep-grp td { background:var(--surface-2); font-weight:700; font-size:.76em; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:7px 9px; border-bottom:1px solid var(--border); }
.rec-table tr.ep-grp .fl-dot { width:9px; height:9px; display:inline-block; vertical-align:middle; margin-right:7px; border-radius:50%; }
.cell-in { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); font-family:inherit; font-size:.88em; }
.cell-in:focus { outline:none; border-color:var(--accent); }
.cell-ta { width:100%; min-height:38px; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); font-family:inherit; font-size:.85em; resize:vertical; line-height:1.4; }
.cell-ta:focus { outline:none; border-color:var(--accent); }
/* Fiches E5 */
.toolbar-s { position:relative; margin-bottom:16px; }
.toolbar-s i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.9em; }
.toolbar-s input { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px 11px 36px; color:var(--text); font-family:inherit; font-size:.92em; }
.toolbar-s input:focus { outline:none; border-color:var(--accent); }
.fiche-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:13px; }
.fiche-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 17px; cursor:pointer; transition:.15s; position:relative; }
.fiche-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.fiche-card .lock-tag { position:absolute; top:11px; right:12px; }
.fc-cadet { font-weight:700; font-size:1.02em; overflow-wrap:anywhere; }
.fc-meta { color:var(--muted); font-size:.82em; margin-top:4px; }
.fc-foot { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.fc-prog { color:var(--muted-2); font-size:.82em; font-weight:700; }
.v-badge { font-size:.72em; font-weight:800; border-radius:999px; padding:3px 10px; text-transform:uppercase; letter-spacing:.02em; }
.v-badge.ok { background:rgba(16,185,129,.16); color:#34d399; }
.v-badge.no { background:rgba(239,68,68,.14); color:#f87171; }
.fiche-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:16px; }
.fiche-meta input:disabled { opacity:.7; }
.ppa-chk { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:.9em; cursor:pointer; padding-top:8px; }
.ppa-chk input { width:18px; height:18px; accent-color:var(--accent); }
.verdict-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-radius:13px; padding:13px 17px; margin-bottom:8px; border:1px solid var(--border); }
.verdict-bar.ok { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.35); }
.verdict-bar.no { background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.28); }
.vb-badge { font-weight:800; font-size:.9em; }
.verdict-bar.ok .vb-badge { color:#34d399; } .verdict-bar.no .vb-badge { color:#f87171; }
.vb-num { color:var(--muted); font-size:.88em; margin-left:8px; }
.vb-right { color:var(--muted-2); font-size:.82em; }
.crit-list { display:flex; flex-direction:column; gap:8px; }
.crit-card { background:var(--surface); border:1px solid var(--border); border-radius:11px; overflow:hidden; }
.crit-head { display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; }
.crit-head:hover { background:var(--surface-2); }
.crit-tog { flex:0 0 auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted-2); cursor:pointer; font-size:.8em; }
.crit-tog.on { background:#10b981; border-color:#10b981; color:#052e1c; }
.crit-tog:disabled { cursor:default; opacity:.75; }
.crit-nom { flex:1; min-width:0; font-weight:600; font-size:.92em; overflow-wrap:anywhere; }
.crit-eval { font-size:.74em; color:#34d399; background:rgba(16,185,129,.12); border-radius:999px; padding:2px 9px; flex:0 0 auto; }
.crit-rc { font-size:.78em; color:var(--muted-2); flex:0 0 auto; }
.crit-chev { color:var(--muted-2); transition:.2s; flex:0 0 auto; }
.crit-card.open .crit-chev { transform:rotate(180deg); }
.crit-body { display:none; padding:2px 14px 13px; border-top:1px solid var(--border); }
.crit-card.open .crit-body { display:block; }
.rmk { padding:8px 0; border-bottom:1px solid var(--border); }
.rmk-t { font-size:.88em; overflow-wrap:anywhere; }
.rmk-m { font-size:.74em; color:var(--muted-2); margin-top:3px; }
.rmk-empty { color:var(--muted-2); font-size:.82em; padding:8px 0; }
.rmk-add { display:flex; gap:8px; margin-top:10px; }
.rmk-add input { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 11px; color:var(--text); font-family:inherit; font-size:.86em; }
.rmk-add input:focus { outline:none; border-color:var(--accent); }
.note-add { display:flex; gap:9px; align-items:flex-start; margin-bottom:14px; }
.note-add textarea { flex:1; min-height:52px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:.9em; resize:vertical; line-height:1.4; }
.note-add textarea:focus { outline:none; border-color:var(--accent); }
.journal { display:flex; flex-direction:column; gap:8px; }
.jnl { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; }
.jnl-t { font-size:.9em; overflow-wrap:anywhere; white-space:pre-wrap; }
.jnl-m { font-size:.75em; color:var(--muted-2); margin-top:5px; display:flex; align-items:center; gap:8px; }
.jnl-x { background:transparent; border:none; color:var(--muted-2); cursor:pointer; font-size:.9em; margin-left:auto; }
.jnl-x:hover { color:#ef4444; }
.ref-group { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 17px; margin-bottom:12px; }
.ref-head { font-weight:700; display:flex; align-items:center; gap:9px; margin-bottom:11px; }
.ref-head i { color:var(--accent-2); }
.ref-count { font-size:.76em; color:var(--muted-2); font-weight:600; background:var(--surface-2); border-radius:999px; padding:2px 9px; }
.ref-cadets { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:9px; }
.ref-cadet { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 12px; transition:.15s; }
.ref-cadet:hover { border-color:var(--accent); }
.rc-nom { font-size:.88em; font-weight:600; overflow-wrap:anywhere; min-width:0; }
/* ============ First Lincoln — constructeur ============ */
.btn-sm { padding:7px 12px; font-size:.8em; }
.btn-danger { background:rgba(239,68,68,.14); color:#f87171; }
.btn-danger:hover { background:rgba(239,68,68,.24); }
.fl-hub-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:15px; }
.fl-type-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; transition:.15s; position:relative; }
.fl-type-card.clickable { cursor:pointer; }
.fl-type-card.clickable:hover { border-color:var(--accent); transform:translateY(-2px); }
.fl-type-card.draft { opacity:.82; }
.fl-cover { height:112px; background:linear-gradient(135deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.05)); position:relative; display:flex; align-items:center; justify-content:center; color:var(--accent-2); font-size:2.1em; }
.fl-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.fl-cover .fl-state { position:absolute; top:10px; right:11px; font-size:.64em; font-weight:800; text-transform:uppercase; letter-spacing:.05em; border-radius:999px; padding:3px 10px; backdrop-filter:blur(4px); }
.fl-state.pub { background:rgba(16,185,129,.9); color:#052e1c; }
.fl-state.dft { background:rgba(148,163,184,.85); color:#0b1220; }
.fl-card-b { padding:14px 16px 16px; display:flex; flex-direction:column; flex:1; }
.fl-card-b .fl-name { font-weight:800; font-size:1.05em; display:flex; align-items:center; gap:8px; }
.fl-card-b .fl-desc { color:var(--muted); font-size:.82em; margin-top:5px; line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fl-metrics { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.fl-metric { font-size:.72em; font-weight:700; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:3px 9px; }
.fl-metric b { color:var(--text); }
.fl-card-foot { display:flex; gap:7px; margin-top:13px; }
.fl-card-foot .btn { flex:0 0 auto; }
.fl-card-foot .grow { flex:1; }
.sit-badge { font-size:.66em; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:999px; padding:2px 9px; }
.sit-badge.always { background:rgba(16,185,129,.16); color:#34d399; }
.sit-badge.conditional { background:rgba(245,158,11,.16); color:#fbbf24; }
.sit-badge.never { background:rgba(148,163,184,.18); color:#94a3b8; }
/* builder header */
.flb-head { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:16px; }
.flb-cover { height:120px; background:linear-gradient(135deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.05)); position:relative; }
.flb-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.flb-head-b { padding:15px 18px 17px; }
.flb-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.flb-title-row h1 { font-size:1.35em; display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0; }
.flb-title-row h1 span.nm { overflow-wrap:anywhere; }
.flb-desc { color:var(--muted); font-size:.88em; margin-top:7px; line-height:1.45; max-width:640px; }
.flb-actions { display:flex; gap:8px; flex-wrap:wrap; flex:0 0 auto; }
/* totals bar */
.flb-totals { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.flb-tot { flex:1 1 130px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 15px; }
.flb-tot .tv { font-size:1.5em; font-weight:800; line-height:1; }
.flb-tot .tl { color:var(--muted); font-size:.76em; margin-top:5px; }
.flb-tot.prat .tv { color:var(--accent-2); } .flb-tot.quest .tv { color:#60a5fa; } .flb-tot.seuil .tv { color:#fbbf24; }
/* tabs */
.flb-tabs { display:flex; gap:5px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto; }

<script>
var API = '/td/td_api.php';
function authHeaders(extra) { var h = extra || {}; try { var t = localStorage.getItem('mdt_auth_token') || ''; if (t) h['Authorization'] = 'Bearer ' + t; } catch(e) {} return h; }
function toast(msg, ok) { if (window.MDT_TOAST) { ok ? MDT_TOAST.ok(msg) : MDT_TOAST.err(msg); } }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function can(p) { return !!PERMS[p]; }

var PERMS = {}, ME = {}, STATS = {};

var SUBMODULES = [
  { key:'epreuves',   label:'Épreuves',        icon:'fa-list-check',        desc:'Configuration des épreuves de formation',        href:'/td/epreuves',      live:true },
  { key:'recrutement',label:'Recrutement',     icon:'fa-user-plus',         desc:'Sessions d\'évaluation des recrues',              href:'/td/recrutement',   live:true },
  { key:'fiches',     label:'Fiches cadets',   icon:'fa-id-card',           desc:'Suivi individuel, notations, journal',           href:'/td/fiches',        live:true },
  { key:'notations',  label:'Barème',          icon:'fa-star',              desc:'Critères de notation des cadets',                href:'/td/notations',     live:true },
  { key:'referents',  label:'Référents',       icon:'fa-user-graduate',     desc:'Cadets regroupés par référent',                  href:'/td/referents',     live:true },
  { key:'documentation', label:'Documentation', icon:'fa-book',           desc:'Fiches pédagogiques de la division',             href:'/documents/training-division', live:true, extern:true },
  { key:'fl',         label:'First Lincoln',   icon:'fa-clipboard-list',    desc:'Examens sur mesure : barèmes + passations notées',href:'/td/first-lincoln', live:true, inst:true }
];

function boot() {
  fetch(API + '?action=bootstrap', { headers: authHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.error) { if (d && d.code === 'E-SEC-401') document.getElementById('denied').style.display = 'block'; else showFatal(); return; }
      if (!d.access) { document.getElementById('denied').style.display = 'block'; return; }
      PERMS = d.perms || {}; ME = d.me || {}; STATS = d.stats || {};
      startRouter();
    })
    .catch(function(e){ if (window.console && console.error) console.error('[TD] boot', e); showFatal(); });
}
function showFatal() { document.getElementById('view-fatal').style.display = 'block'; }
function reloadBootstrap(cb) {
  fetch(API + '?action=bootstrap', { headers: authHeaders() }).then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.access) { PERMS = d.perms || PERMS; STATS = d.stats || STATS; if (cb) cb(); else MDT_ROUTER.refresh(); } })
    .catch(function(){ toast('Rechargement impossible', false); });
}
function viewShow(id) {
  ['denied','view-fatal','view-error'].forEach(function(x){ document.getElementById(x).style.display = 'none'; });
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === id); });
  window.scrollTo(0, 0);
}
function showError(code, title, msg) {
  document.getElementById('err-code').textContent = code;
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent = msg || '';
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  ['denied','view-fatal'].forEach(function(x){ document.getElementById(x).style.display = 'none'; });
  document.getElementById('view-error').style.display = 'block';
  window.scrollTo(0, 0);
}

function statCard(cls, val, label) {
  return '<div class="stat-card ' + cls + '"><div class="sv">' + val + '</div><div class="sl">' + esc(label) + '</div></div>';
}
function showHome() {
  var s = STATS || {}, fl = s.first_lincoln || {};
  var h = '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-graduation-cap"></i></span> Training Division</h1>'
    + '<div class="sub">' + (ME.name ? 'Bonjour, ' + esc(ME.name) + '. ' : '') + 'Vue d\'ensemble de la formation.</div></div></div>';

  h += '<div class="section-title">En un coup d\'œil</div>';
  h += '<div class="stat-grid">'
    + statCard('accent', s.fiches || 0, 'Fiches cadets')
    + statCard('', s.sessions || 0, 'Sessions de recrutement')
    + statCard('', s.epreuves || 0, 'Épreuves')
    + statCard('good', fl.reussi || 0, 'First Lincoln réussis')
    + statCard('warn', fl.en_cours || 0, 'First Lincoln en cours')
    + '</div>';

  h += '<div class="section-title">First Lincoln</div>';

var FL_EVALS = [], FLE = null, FLE_SAVE_T = null;
var FL_VERD = { reussi:{l:'Réussi',c:'ok'}, echoue:{l:'Échoué',c:'no'}, eliminatoire:{l:'Éliminatoire',c:'elim'}, en_cours:{l:'En cours',c:'wait'} };
function flVBadge(v) { var m = FL_VERD[v] || FL_VERD.en_cours; return '<span class="fle-vb '+m.c+'">'+m.l+'</span>'; }
function flVLabel(v) { return (FL_VERD[v] || FL_VERD.en_cours).l; }
function flRound(x) { return Math.round(+((+x).toPrecision(12))); }
function flNormScore(v, max, step) { if (v===undefined || v===null || v==='' || isNaN(+v)) return null; var n = Math.max(0, Math.min(+v, +max||0)); if (+step>0) n = flRound(n/+step)*+step; return n; }
function flComputeLocal(ref, scores, quest, daFailed) {
  scores = scores || {}; quest = quest || {};
  var mode = (ref.type && ref.type.situation_mode) || 'always', cfg = ref.config || {};
  var seuil = cfg.seuil_validation!==undefined ? (+cfg.seuil_validation) : 80;
  var qmax = cfg.total_questionnaire_max!==undefined ? (+cfg.total_questionnaire_max) : 30;
  var prat = 0, elim = [];
  (ref.sections||[]).forEach(function(sec){ (sec.criteres||[]).forEach(function(cr){
    var cid = cr.id, n = flNormScore(scores[cid], cr.max_pts, cr.step);
    if (n !== null) prat += n;
    if (cr.elim && scores[cid+'_elim']===true) elim.push(cr.label);
  }); });
  var q = 0; (ref.categories||[]).forEach(function(cat){ (cat.questions||[]).forEach(function(qq){ if (quest[qq.id]===true) q += (+qq.points||0); }); });
  if (q > qmax) q = qmax;
  var compte = (mode==='always') || (mode==='conditional' && daFailed);
  if (!compte) { prat = 0; elim = []; }
  var global = compte ? (prat + q) : q;
  return { total_pratique:Math.round(prat*10)/10, total_questionnaire:Math.round(q*10)/10, total_global:Math.round(global*10)/10, faute_eliminatoire:elim.length>0, faute_detail:elim.join(', '), seuil:seuil, pratique_compte:compte };
}

function flScorer(c, cur) {

function flPrune(ref) {
  ref.sections = (ref.sections || []).filter(function(s){ return s.active !== false; });
  ref.sections.forEach(function(s){ s.criteres = (s.criteres || []).filter(function(c){ return c.active !== false; }); });
  ref.categories = (ref.categories || []).filter(function(c){ return c.active !== false; });
  ref.categories.forEach(function(c){ c.questions = (c.questions || []).filter(function(q){ return q.active !== false; }); });
  return ref;
}
function flTotals(ref) {
  var pratMax = 0; (ref.sections||[]).forEach(function(s){ (s.criteres||[]).forEach(function(c){ pratMax += (+c.max_pts||0); }); });
  var qStd = 0, qBonus = 0; (ref.categories||[]).forEach(function(cat){ (cat.questions||[]).forEach(function(q){ if (q.bonus) qBonus += (+q.points||0); else qStd += (+q.points||0); }); });
  var cfg = ref.config || {};
  return { pratMax:Math.round(pratMax*10)/10, qStd:qStd, qBonus:qBonus, questCap:(cfg.total_questionnaire_max!==undefined?(+cfg.total_questionnaire_max||0):qStd), seuil:(cfg.seuil_validation!==undefined?(+cfg.seuil_validation||0):0) };
}

function reloadFLB() {
  fetch(API + '?action=fl_type_full&id=' + encodeURIComponent(FLB.id), { headers: authHeaders() }).then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success && d.referentiel) { FLB.ref = flPrune(d.referentiel); renderFLBuilder(); } }).catch(function(){ toast('Rechargement impossible', false); });
}
function flTabBtn(k, ic, label) { return '<button class="flb-tab'+(FLB.tab===k?' on':'')+'" onclick="flSetTab(\''+k+'\')"><i class="fa-solid '+ic+'"></i> '+label+'</button>'; }
function flSetTab(k) { FLB.tab = k; renderFLBuilder(); }
function renderFLBuilder() {
  var ref = FLB.ref, t = ref.type, inst = can('td_manage'), host = document.getElementById('view-flbuilder'), tot = flTotals(ref);
  var cover = t.image_url ? '<img src="'+esc(t.image_url)+'" alt="">' : '';
  var h = '<a class="crumb-back" href="/td/first-lincoln"><i class="fa-solid fa-arrow-left"></i> Barèmes</a>';
  h += '<div class="flb-head"><div class="flb-cover">'+cover+'</div><div class="flb-head-b"><div class="flb-title-row"><div style="min-width:0">'
    + '<h1><i class="fa-solid fa-clipboard-list" style="color:var(--accent-2)"></i> <span class="nm">'+esc(t.label)+'</span> <span class="sit-badge '+t.situation_mode+'">'+esc(FL_SIT[t.situation_mode]||t.situation_mode)+'</span> '+(t.active?'<span class="fl-state pub" style="position:static">Publié</span>':'<span class="fl-state dft" style="position:static">Brouillon</span>')+'</h1>'
    + (t.description?'<div class="flb-desc">'+esc(t.description)+'</div>':'') + '</div>';
  if (inst) h += '<div class="flb-actions"><button class="btn btn-ghost btn-sm" onclick="editFLType()"><i class="fa-solid fa-sliders"></i> Éditer</button>'
    + '<button class="btn btn-ghost btn-sm" onclick="setFLPub('+(t.active?0:1)+')"><i class="fa-solid '+(t.active?'fa-eye-slash':'fa-eye')+'"></i> '+(t.active?'Dépublier':'Publier')+'</button></div>';
  h += '</div></div></div>';
  h += '<div class="flb-totals"><div class="flb-tot prat"><div class="tv">'+tot.pratMax+'</div><div class="tl">Points pratique (max)</div></div>'
    + '<div class="flb-tot quest"><div class="tv">'+tot.questCap+'</div><div class="tl">Questionnaire (plafond)</div></div>'
    + '<div class="flb-tot seuil"><div class="tv">'+tot.seuil+'</div><div class="tl">Seuil de validation</div></div></div>';
  h += '<div class="flb-tabs">' + flTabBtn('pratique','fa-list-check','Pratique') + flTabBtn('questionnaire','fa-circle-question','Questionnaire') + flTabBtn('reglages','fa-gear','Réglages') + '</div>';
  h += '<div id="flb-tabc"></div>';
  host.innerHTML = h; viewShow('view-flbuilder');
  renderFLBTab();
}
function renderFLBTab() {
  var c = document.getElementById('flb-tabc'); if (!c) return;
  if (FLB.tab === 'questionnaire') { c.innerHTML = renderFLBQuest(); flWireQuest(); }
  else if (FLB.tab === 'reglages') { c.innerHTML = renderFLBConfig(); }
  else { c.innerHTML = renderFLBPratique(); flWirePratique(); }
}
function renderFLBPratique() {
  var ref = FLB.ref, inst = can('td_manage'), secs = ref.sections || [], h = '';
  if (!secs.length) h += '<div class="fl-empty"><div class="ei"><i class="fa-solid fa-layer-group"></i></div>Aucune section d\'évaluation pratique.'+(inst?' Ajoute-en une ci-dessous.':'')+'</div>';
  h += '<div class="fl-sec-list" id="fl-seclist">' + secs.map(function(s, si){
    var pts = 0; (s.criteres||[]).forEach(function(c){ pts += (+c.max_pts||0); }); pts = Math.round(pts*10)/10;
    var ic = s.image_url ? '<img src="'+esc(s.image_url)+'" alt="">' : '<i class="fa-solid '+(s.icon?esc(s.icon):'fa-flag')+'"></i>';
    var head = '<div class="fl-sec-head" style="border-left-color:'+(s.color?esc(s.color):'var(--accent)')+'">'
      + (inst?'<span class="fl-drag" title="Glisser pour réordonner"><i class="fa-solid fa-grip-vertical"></i></span>':'')
      + '<span class="fl-sec-ic"'+(s.color?' style="background:'+hexA(s.color,.16)+';color:'+esc(s.color)+'"':'')+'>'+ic+'</span>'
      + '<div class="fl-sec-t"><div class="sn">'+esc(s.label)+'</div><div class="sm">'+(s.criteres?s.criteres.length:0)+' critère'+((s.criteres&&s.criteres.length>1)?'s':'')+'</div></div>'
      + '<span class="fl-sec-pts">'+pts+' pts</span>'
      + (inst?'<div class="fl-crit-acts"><button class="fl-mini" title="Éditer la section" onclick="editFLSection('+si+')"><i class="fa-solid fa-pen"></i></button><button class="fl-mini del" title="Supprimer" onclick="delFLSection('+si+')"><i class="fa-solid fa-trash"></i></button></div>':'') + '</div>';
    var crits = '<div class="fl-crit-list" id="fl-critlist-'+si+'">' + (s.criteres||[]).map(function(c, ci){ return renderFLCrit(si, c, ci, inst); }).join('') + '</div>';
    var addC = inst ? '<button class="fl-add crit" onclick="addFLCrit('+si+')"><i class="fa-solid fa-plus"></i> Ajouter un critère</button>' : '';
    return '<div class="fl-sec" data-id="'+esc(s.id)+'"'+(inst?' draggable="true"':'')+'>'+head+'<div class="fl-sec-body">'+crits+addC+'</div></div>';
  }).join('') + '</div>';
  if (inst) h += '<button class="fl-add block" onclick="addFLSection()"><i class="fa-solid fa-plus"></i> Ajouter une section</button>';
  return h;
}
function renderFLCrit(si, c, ci, inst) {
  var th = c.image_url ? '<img src="'+esc(c.image_url)+'" alt="">' : '<i class="fa-regular fa-image" style="opacity:.4"></i>';
  var elim = c.elim ? ' <span class="fl-elim" title="'+esc(c.elim_desc||'Faute éliminatoire')+'"><i class="fa-solid fa-triangle-exclamation"></i> Élim</span>' : '';
  var desc = c.description ? '<div class="cd">'+esc(c.description)+'</div>' : '';
  var acts = inst ? '<div class="fl-crit-acts"><button class="fl-mini" title="Éditer" onclick="editFLCrit('+si+','+ci+')"><i class="fa-solid fa-pen"></i></button><button class="fl-mini del" title="Supprimer" onclick="delFLCrit('+si+','+ci+')"><i class="fa-solid fa-trash"></i></button></div>' : '';
  return '<div class="fl-crit" data-id="'+esc(c.id)+'"'+(inst?' draggable="true"':'')+'>'
    + (inst?'<span class="fl-drag"><i class="fa-solid fa-grip-vertical"></i></span>':'')
    + '<span class="fl-crit-th">'+th+'</span>'
    + '<div class="fl-crit-t"><div class="cn">'+esc(c.label)+elim+'</div>'+desc+'</div>'
    + '<span class="fl-crit-pts">'+(+c.max_pts||0)+'<span class="st">pas '+(+c.step||1)+'</span></span>'+acts+'</div>';
}
function flWirePratique() {
  if (!can('td_manage')) return;
  flMakeSortable(document.getElementById('fl-seclist'), 'sec', function(cont){ flPersistOrder(cont, 'section', function(order){ FLB.ref.sections = flSortBy(FLB.ref.sections, order); }); });
  (FLB.ref.sections||[]).forEach(function(s, si){
    flMakeSortable(document.getElementById('fl-critlist-'+si), 'crit'+si, (function(sidx){ return function(cont){ flPersistOrder(cont, 'critere', function(order){ FLB.ref.sections[sidx].criteres = flSortBy(FLB.ref.sections[sidx].criteres, order); }); }; })(si));
  });
}
function renderFLBQuest() {
  var ref = FLB.ref, inst = can('td_manage'), cats = ref.categories || [], h = '';
  if (!cats.length) h += '<div class="fl-empty"><div class="ei"><i class="fa-solid fa-circle-question"></i></div>Aucune catégorie de questions.'+(inst?' Ajoute-en une ci-dessous.':'')+'</div>';
  h += '<div class="fl-cat-list" id="fl-catlist">' + cats.map(function(cat, qi){
    var qs = cat.questions || [], pts = 0; qs.forEach(function(q){ if (!q.bonus) pts += (+q.points||0); });
    var head = '<div class="fl-cat-head">'
      + (inst?'<span class="fl-drag"><i class="fa-solid fa-grip-vertical"></i></span>':'')
      + '<span class="fl-dot" style="background:'+(cat.color?esc(cat.color):'var(--accent)')+'"></span>'
      + '<div class="fl-cat-t">'+esc(cat.label)+'</div><span class="fl-cat-c">'+qs.length+' Q · '+pts+' pts</span>'
      + (inst?'<div class="fl-crit-acts"><button class="fl-mini" title="Éditer" onclick="editFLCat('+qi+')"><i class="fa-solid fa-pen"></i></button><button class="fl-mini del" title="Supprimer" onclick="delFLCat('+qi+')"><i class="fa-solid fa-trash"></i></button></div>':'') + '</div>';
    var ql = '<div class="fl-q-list" id="fl-qlist-'+qi+'">' + qs.map(function(q, qqi){ return renderFLQ(qi, q, qqi, inst); }).join('') + '</div>';
    var addQ = inst ? '<button class="fl-add crit" onclick="addFLQ('+qi+')"><i class="fa-solid fa-plus"></i> Ajouter une question</button>' : '';
    return '<div class="fl-cat" data-id="'+esc(cat.id)+'"'+(inst?' draggable="true"':'')+'>'+head+'<div class="fl-cat-body">'+ql+addQ+'</div></div>';
  }).join('') + '</div>';
  if (inst) h += '<button class="fl-add block" onclick="addFLCat()"><i class="fa-solid fa-plus"></i> Ajouter une catégorie</button>';
  return h;
}
function renderFLQ(qi, q, qqi, inst) {
  var th = q.image_url ? '<img src="'+esc(q.image_url)+'" alt="">' : '<i class="fa-regular fa-image" style="opacity:.4"></i>';
  var rep = q.reponse ? '<div class="qr"><i class="fa-solid fa-check" style="font-size:.85em"></i> '+esc(q.reponse)+'</div>' : '';
  var pts = q.bonus ? '<span class="fl-q-pts bonus">+'+(+q.points||0)+' bonus</span>' : '<span class="fl-q-pts">'+(+q.points||0)+' pt'+((+q.points||0)>1?'s':'')+'</span>';
  var acts = inst ? '<div class="fl-crit-acts"><button class="fl-mini" title="Éditer" onclick="editFLQ('+qi+','+qqi+')"><i class="fa-solid fa-pen"></i></button><button class="fl-mini del" title="Supprimer" onclick="delFLQ('+qi+','+qqi+')"><i class="fa-solid fa-trash"></i></button></div>' : '';
  return '<div class="fl-q" data-id="'+esc(q.id)+'"'+(inst?' draggable="true"':'')+'>'
    + (inst?'<span class="fl-drag" style="margin-top:2px"><i class="fa-solid fa-grip-vertical"></i></span>':'')
    + '<span class="fl-q-th">'+th+'</span><div class="fl-q-t"><div class="qq">'+esc(q.question)+'</div>'+rep+'</div>'+pts+acts+'</div>';
}
function flWireQuest() {
  if (!can('td_manage')) return;
  flMakeSortable(document.getElementById('fl-catlist'), 'cat', function(cont){ flPersistOrder(cont, 'qcat', function(order){ FLB.ref.categories = flSortBy(FLB.ref.categories, order); }); });
  (FLB.ref.categories||[]).forEach(function(cat, qi){
    flMakeSortable(document.getElementById('fl-qlist-'+qi), 'q'+qi, (function(cidx){ return function(cont){ flPersistOrder(cont, 'question', function(order){ FLB.ref.categories[cidx].questions = flSortBy(FLB.ref.categories[cidx].questions, order); }); }; })(qi));
  });
}
function renderFLBConfig() {

  if (inst) h += '<div style="margin-top:14px"><button class="btn btn-primary" onclick="saveFLConfig()"><i class="fa-solid fa-floppy-disk"></i> Enregistrer les réglages</button></div>';
  h += '</div></div>';

}
function saveFLConfig() {
  flPost('fl_config_save', { type_id:FLB.id, config:{ seuil_validation:document.getElementById('cfg-seuil').value, total_questionnaire_max:document.getElementById('cfg-qmax').value } }, function(){ toast('Réglages enregistrés', true); reloadFLB(); });
}

function setFLPub(active) { flPost('fl_type_active', { id:FLB.id, active:active }, function(){ toast(active?'Barème publié':'Barème dépublié', true); reloadFLB(); }); }
function addFLSection() { openFLSection(null); }
function editFLSection(si) { openFLSection(si); }
function openFLSection(si) {
  if (!can('td_manage')) return;
  var has = (si !== null && si !== undefined), s = has ? FLB.ref.sections[si] : {};
  FLB_IMG = s.image_url || ''; FL_EDIT = { kind:'section', si:(has?si:null) };
  openModal('<h2>'+(has?'Modifier la section':'Nouvelle section')+'</h2>'
    + '<div class="field"><label>Nom de la section</label><input type="text" id="fe-label" value="'+esc(s.label||'')+'" placeholder="Ex : Conduite & maîtrise du véhicule"></div>'
    + '<div class="fl-row2"><div class="field"><label>Icône (Font Awesome)</label><input type="text" id="fe-icon" value="'+esc(s.icon||'')+'" placeholder="fa-car"></div>'
    + '<div class="field"><label>Couleur</label><input type="color" class="color-in" id="fe-color" value="'+esc(s.color||'#10b981')+'"></div></div>'
    + flImgField('Image (optionnel)')
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveFLSection()">Enregistrer</button></div>');

}
function saveFLSection() {
  var label = (document.getElementById('fe-label').value||'').trim(); if (!label) { toast('Nom requis', false); return; }
  var payload = { kind:'section', label:label, icon:(document.getElementById('fe-icon').value||'').trim(), color:document.getElementById('fe-color').value, image_url:FLB_IMG };
  if (FL_EDIT.si !== null) payload.id = FLB.ref.sections[FL_EDIT.si].id; else payload.parent_id = FLB.id;

}
async function delFLSection(si) { var s = FLB.ref.sections[si]; if (!s) return; if (!await MDT_CONFIRM('Supprimer la section « '+(s.label||'')+' » et tous ses critères ?')) return; flPost('fl_ent_delete', { kind:'section', id:s.id }, function(){ toast('Section supprimée', true); reloadFLB(); }); }

function saveFLQ() {
  var q = (document.getElementById('fe-q').value||'').trim(); if (!q) { toast('Question requise', false); return; }
  var payload = { kind:'question', question:q, reponse:(document.getElementById('fe-rep').value||'').trim(), points:document.getElementById('fe-pts').value, bonus:document.getElementById('fe-bonus').checked, image_url:FLB_IMG };
  if (FL_EDIT.qqi !== null) payload.id = FLB.ref.categories[FL_EDIT.qi].questions[FL_EDIT.qqi].id; else payload.parent_id = FLB.ref.categories[FL_EDIT.qi].id;
  flPost('fl_ent_save', payload, function(){ closeModal(); toast('Enregistré', true); reloadFLB(); });
}
async function delFLQ(qi, qqi) { var q = FLB.ref.categories[qi].questions[qqi]; if (!q) return; if (!await MDT_CONFIRM('Supprimer cette question ?')) return; flPost('fl_ent_delete', { kind:'question', id:q.id }, function(){ toast('Question supprimée', true); reloadFLB(); }); }
function flChildrenWithId(container) { var out = [], ch = container.children; for (var i = 0; i < ch.length; i++) { if (ch[i].getAttribute && ch[i].getAttribute('data-id') != null) out.push(ch[i]); } return out; }
function flDragAfter(container, y) {
  var els = flChildrenWithId(container).filter(function(el){ return !el.classList.contains('dragging'); });
  var closest = null, closestOff = -Infinity;
  els.forEach(function(c){ var box = c.getBoundingClientRect(); var off = y - box.top - box.height/2; if (off < 0 && off > closestOff) { closestOff = off; closest = c; } });
  return closest;
}
function flMakeSortable(container, group, onDrop) {
  if (!container) return;
  flChildrenWithId(container).forEach(function(el){
    if (el.getAttribute('draggable') !== 'true') return;
    el.addEventListener('dragstart', function(e){ FL_DRAG = { el:el, group:group, container:container }; el.classList.add('dragging'); if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.getAttribute('data-id')||''); } catch(_){} } });
    el.addEventListener('dragend', function(){ el.classList.remove('dragging'); if (FL_DRAG && FL_DRAG.el === el) { FL_DRAG = null; onDrop(container); } });
  });
  container.addEventListener('dragover', function(e){ if (!FL_DRAG || FL_DRAG.group !== group || FL_DRAG.container !== container) return; e.preventDefault(); var after = flDragAfter(container, e.clientY); if (after == null) container.appendChild(FL_DRAG.el); else container.insertBefore(FL_DRAG.el, after); });
}
function flSortBy(arr, order) { return (arr||[]).slice().sort(function(a, b){ return order.indexOf(a.id) - order.indexOf(b.id); }); }
function flPersistOrder(container, kind, applyFn) {
  var order = flChildrenWithId(container).map(function(el){ return el.getAttribute('data-id'); });
  applyFn(order); renderFLBTab(); flPost('fl_ent_reorder', { kind:kind, order:order }, null);
}

boot();
</script>
