<!DOCTYPE html>
<html lang="fr" data-module="penal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT - Code Pénal</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
html[data-module="penal"]{ --accent:#a855f7; --accent-2:#c084fc; --accent-rgb:168,85,247; }
.app a { color:inherit; text-decoration:none; }
.wrap { max-width:1500px; margin:0 auto; padding:24px 22px 90px; }
.app .btn { padding:10px 16px; border:none; border-radius:10px; font-weight:700; font-size:.88em; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px; transition:.15s; }
.app .btn-primary { background:var(--accent); color:#1a0733; } .app .btn-primary:hover { background:var(--accent-2); }
.app .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); } .app .btn-ghost:hover { border-color:var(--accent); }
.btn-sm { padding:7px 12px; font-size:.82em; }
.sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.sec-head h1 { font-size:1.5em; display:flex; align-items:center; gap:11px; }
.sec-head h1 .ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:rgba(var(--accent-rgb),.15); color:var(--accent-2); }
.sec-head .sub { color:var(--muted); font-size:.6em; font-weight:400; margin-top:3px; }
.subtabs { display:inline-flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:4px; margin-bottom:18px; flex-wrap:wrap; }
.subtabs a { border:none; background:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:.85em; padding:8px 15px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.subtabs a.on { background:var(--accent); color:#1a0733; }
#denied, #view-fatal, #view-error { display:none; text-align:center; padding:60px 20px; }
#denied .lock, #view-fatal .lock { width:64px; height:64px; border-radius:50%; background:rgba(var(--accent-rgb),.12); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:1.6em; margin:0 auto 18px; }
#view-error .ecode { font-size:3em; font-weight:800; color:var(--accent-2); }
.view { display:none; } .view.on { display:block; }
.empty-state { text-align:center; padding:44px 20px; color:var(--muted); }
.loading { text-align:center; padding:50px; color:var(--muted-2); }
/* filtres catégorie */
.cat-filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.cat-chip { border:1px solid var(--border); background:var(--surface); color:var(--muted); font-weight:700; font-size:.82em; padding:6px 13px; border-radius:999px; cursor:pointer; transition:.13s; }
.cat-chip.on { color:#fff; }
.pen-search { position:relative; flex:1; min-width:200px; max-width:360px; }
.pen-search i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-size:.85em; }
.pen-search input { width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; color:var(--text); font-family:inherit; font-size:.9em; }
.pen-search input:focus { outline:none; border-color:var(--accent); }
/* table code */
.pen-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
table.pen { width:100%; border-collapse:collapse; font-size:.86em; }
table.pen th { text-align:left; font-size:.7em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; padding:11px 12px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; white-space:nowrap; }
table.pen td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.pen tr.grp td { font-weight:800; font-size:.8em; text-transform:uppercase; letter-spacing:.06em; color:#fff; }
table.pen tbody tr:not(.grp):hover { background:rgba(var(--accent-rgb),.05); }
.code-badge { display:inline-block; min-width:38px; text-align:center; font-weight:800; font-size:.92em; padding:3px 9px; border-radius:7px; color:#fff; }
.money { font-weight:800; white-space:nowrap; } .muted { color:var(--muted-2); } .jdays { color:var(--muted-2); font-size:.85em; }
.chip-casier { font-size:.68em; font-weight:800; padding:2px 8px; border-radius:6px; background:rgba(239,68,68,.15); color:#f87171; }
.chip-doj { font-size:.68em; font-weight:800; padding:2px 8px; border-radius:6px; }
.chip-doj.proc { background:rgba(245,158,11,.16); color:#fbbf24; } .chip-doj.juge { background:rgba(239,68,68,.16); color:#f87171; }
.mini { font-size:.78em; color:var(--muted-2); }
/* simulateur */
.sim-grid { display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; } @media(max-width:900px){ .sim-grid { grid-template-columns:1fr; } }
.sim-add { position:relative; margin-bottom:16px; }
.sim-dd { position:absolute; left:0; right:0; top:calc(100% + 5px); background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:0 14px 34px rgba(0,0,0,.4); z-index:40; max-height:320px; overflow-y:auto; display:none; }
.sim-dd.show { display:block; } .sim-opt { display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer; font-size:.87em; } .sim-opt:hover { background:var(--surface-2); }
.sim-empty { text-align:center; padding:40px 20px; color:var(--muted-2); border:1px dashed var(--border); border-radius:13px; }
/* Catalogue complet dans le simulateur : parcourir les 168 infractions sans connaître les codes */
.cat-panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; overflow:hidden; }
.cat-panel-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 14px; border-bottom:1px solid var(--border); }
.cat-panel-head .ttl { font-weight:800; font-size:.85em; display:flex; align-items:center; gap:8px; }
.cat-panel-head .ttl i { color:var(--accent-2); }
.cat-panel-head .cnt { color:var(--muted-2); font-weight:600; font-size:.78em; }
.cat-toggle { margin-left:auto; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); border-radius:9px; padding:5px 11px; font-size:.78em; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.cat-toggle:hover { border-color:var(--accent); color:var(--text); }
.cat-body { max-height:440px; overflow-y:auto; }
.cat-body.closed { display:none; }
.cat-grp { position:sticky; top:0; z-index:2; padding:7px 14px; font-weight:800; font-size:.72em; text-transform:uppercase; letter-spacing:.06em; color:#fff; }
.cat-row { display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer; border-bottom:1px solid var(--border); font-size:.86em; }
.cat-row:hover { background:rgba(var(--accent-rgb),.07); }
.cat-row .lbl { flex:1; min-width:0; }
.cat-row .lbl b { margin-right:6px; }
.cat-row .add { color:var(--muted-2); font-size:.9em; }
.cat-row:hover .add { color:var(--accent-2); }
.cat-none { padding:26px 14px; text-align:center; color:var(--muted-2); font-size:.86em; }
.sim-item { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 15px; margin-bottom:11px; }
.sim-item-head { display:flex; align-items:center; gap:10px; margin-bottom:4px; } .sim-item-head .t { font-weight:700; flex:1; min-width:0; } .sim-item-head .rm { background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:1em; padding:4px 6px; } .sim-item-head .rm:hover { color:#f87171; }
.sim-line { color:var(--muted-2); font-size:.82em; margin-bottom:9px; }
.sim-circ { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.sim-circ label { display:inline-flex; align-items:center; gap:6px; font-size:.8em; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; cursor:pointer; }
.sim-qty { display:flex; align-items:center; gap:9px; margin-top:6px; font-size:.85em; } .sim-qty input { width:110px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text); font-family:inherit; }
.sim-amount { margin-left:auto; font-weight:800; color:var(--accent-2); white-space:nowrap; }
.sim-total { background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:18px; position:sticky; top:16px; }
.sim-total h3 { font-size:.8em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); margin-bottom:14px; }
.sim-row { display:flex; align-items:baseline; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); } .sim-row:last-of-type { border-bottom:none; }
.sim-row .k { color:var(--muted); font-size:.86em; } .sim-row .v { font-weight:800; }
.sim-row .v.big { font-size:1.5em; color:var(--accent-2); }
/* gestion inline */
.pen-in { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 7px; color:var(--text); font-family:inherit; font-size:.95em; }
.pen-in:hover { border-color:var(--border); } .pen-in:focus { outline:none; border-color:var(--accent); background:var(--surface-2); }
.pen-in.code { width:60px; font-weight:800; } .pen-in.price { width:90px; } .pen-in.prison { width:80px; }
.pen-del { background:none; border:none; color:var(--muted-2); cursor:pointer; padding:4px 7px; border-radius:6px; } .pen-del:hover { color:#f87171; background:rgba(239,68,68,.1); }
.savestate { font-size:.85em; color:var(--muted-2); margin-left:10px; }
</style>
</head>
<body class="app">
<div class="app-bg"></div>
<div class="wrap">
  <div id="denied"><div class="lock"><i class="fa-solid fa-lock"></i></div><h2>Accès refusé</h2><p>Ta session n'est pas valide ou a expiré. Reconnecte-toi depuis le menu.</p><a class="btn btn-ghost" href="/"><i class="fa-solid fa-arrow-left"></i> Retour au menu</a></div>
  <div id="view-fatal"><div class="lock"><i class="fa-solid fa-plug-circle-xmark"></i></div><h2>Module indisponible</h2><p>Impossible de charger le Code Pénal.</p><button class="btn btn-primary" onclick="window.location.reload()"><i class="fa-solid fa-rotate-right"></i> Réessayer</button></div>
  <div id="view-error"><div class="ecode" id="err-code">404</div><h2 id="err-title">Page introuvable</h2><p id="err-msg"></p><a class="btn btn-ghost" href="/penal/"><i class="fa-solid fa-scale-balanced"></i> Simulateur</a></div>
  <div id="view-simulateur" class="view"></div>
  <div id="view-code" class="view"></div>
  <div id="view-gestion" class="view"></div>
</div>

<script>
window.MDT_SHELL = {
  module: 'penal', title: 'Code Pénal', icon: 'fa-scale-balanced', back: { href: '/', label: 'Menu' },
  nav: [
    { key:'sim', label:'Simulateur d\'amende', icon:'fa-calculator', href:'/penal/' },
    { key:'code', label:'Code pénal', icon:'fa-book', href:'/penal/code' },
    { key:'gestion', label:'Gestion', icon:'fa-sliders', href:'/penal/gestion' }
  ]
};
</script>
<script src="/login/secure.js"></script>
<script src="/assets/app-boot.js"></script>
<script src="/assets/skeleton.js"></script>
<script src="/assets/select.js"></script>
<script src="/assets/chatwidget.js"></script>
<script src="/assets/modules.js"></script>
<script src="/assets/toast.js"></script>
<script src="/assets/app-shell.js"></script>
<script src="/assets/router.js"></script>
<script src="/assets/dock.js"></script>
<script src="/assets/ui-dialog.js"></script>
<script>
var API = '/penal/penal_api.php';
var INFRACTIONS = [], BY_ID = {}, IS_ADMIN = false;
var CAT_COLORS = { B:'#3b82f6', C:'#eab308', D:'#f97316', E:'#dc2626' };
var CAT_LABELS = { B:'Contraventions', C:'Délits mineurs', D:'Délits majeurs', E:'Crimes' };
function authHeaders(extra) { var h = extra || {}; try { var t = localStorage.getItem('mdt_auth_token') || ''; if (t) h['Authorization'] = 'Bearer ' + t; } catch(e) {} return h; }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function hexA(hex, a) { hex = String(hex||'').replace('#',''); if (hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; if (hex.length<6) return 'rgba(148,163,184,'+a+')'; return 'rgba('+parseInt(hex.substr(0,2),16)+','+parseInt(hex.substr(2,2),16)+','+parseInt(hex.substr(4,2),16)+','+a+')'; }
function money(n) { n = parseInt(n,10)||0; return n.toLocaleString('fr-FR') + ' $'; }
function toast(msg, ok) { if (window.MDT_TOAST) { ok ? MDT_TOAST.ok(msg) : MDT_TOAST.err(msg); } }
function viewShow(id) { ['denied','view-fatal','view-error'].forEach(function(x){ document.getElementById(x).style.display='none'; }); document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id===id); }); window.scrollTo(0,0); }
function showError(code, title, msg) { document.getElementById('err-code').textContent=code; document.getElementById('err-title').textContent=title; document.getElementById('err-msg').textContent=msg||''; document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');}); document.getElementById('view-error').style.display='block'; window.scrollTo(0,0); }
function showFatal() { document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');}); document.getElementById('view-fatal').style.display='block'; }
function catChip(cat) { var c = CAT_COLORS[cat]||'#64748b'; return '<span class="code-badge" style="background:'+c+'">'+esc(cat)+'</span>'; }
function dojChip(doj) { if (doj==='Jugement') return '<span class="chip-doj juge">Jugement</span>'; if (doj==='Procureur') return '<span class="chip-doj proc">Procureur</span>'; return '<span class="jdays">—</span>'; }

function boot() {
  fetch(API + '?action=list', { headers: authHeaders() }).then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){
      if (!x.ok || !x.d || !x.d.success) { if (x.d && x.d.code === 'E-SEC-401') { document.getElementById('denied').style.display='block'; } else showFatal(); return; }
      INFRACTIONS = x.d.infractions || []; IS_ADMIN = !!x.d.is_admin; BY_ID = {}; INFRACTIONS.forEach(function(i){ BY_ID[i.id] = i; });
      startRouter();
    }).catch(function(){ showFatal(); });
}
function reload(cb) {
  fetch(API + '?action=list', { headers: authHeaders() }).then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { INFRACTIONS = d.infractions || []; BY_ID = {}; INFRACTIONS.forEach(function(i){ BY_ID[i.id]=i; }); } if (cb) cb(); }).catch(function(){ if (cb) cb(); });
}
function shellActive(k) { if (typeof window.MDT_SHELL_SET_ACTIVE === 'function') MDT_SHELL_SET_ACTIVE(k); }
function startRouter() {
  MDT_ROUTER.define({
    base: '/penal',
    routes: [ { path:'/', view:'sim' }, { path:'/code', view:'code' }, { path:'/gestion', view:'gestion' } ],
    onRoute: onRoute,
    onNotFound: function(){ showError('404','Page introuvable',''); }
  }).start();
}
function onRoute(m) {
  var v = m.route.view;
  if (v === 'sim') { shellActive('sim'); return showSim(); }
  if (v === 'code') { shellActive('code'); return showCode(); }
  if (v === 'gestion') { shellActive('gestion'); return showGestion(); }
}

var SIM = [];
function showSim() {
  var el = document.getElementById('view-simulateur');
  el.innerHTML = '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-calculator"></i></span> Simulateur d\'amende</h1><div class="sub">Parcours le catalogue ou cherche une infraction, puis coche les circonstances.</div></div></div>'
    + '<div class="sim-grid"><div><div class="sim-add"><div class="pen-search"><i class="fa-solid fa-magnifying-glass"></i><input id="sim-q" placeholder="Chercher une infraction (code ou libellé)…" autocomplete="off" oninput="simFilter()" onfocus="simFilter()"></div><div class="sim-dd" id="sim-dd"></div></div>'
    + '<div class="cat-panel"><div class="cat-panel-head"><span class="ttl"><i class="fa-solid fa-list"></i> Toutes les infractions</span><span class="cnt" id="cat-count"></span>'
    + '<button type="button" class="cat-toggle" id="cat-toggle" onclick="catToggle()"><i class="fa-solid fa-chevron-up"></i> Replier</button></div>'
    + '<div class="cat-panel-head" id="cat-chips" style="border-bottom:1px solid var(--border)"></div>'
    + '<div class="cat-body" id="cat-body"></div></div>'
    + '<div id="sim-list"></div></div>'
    + '<div class="sim-total" id="sim-total"></div></div>';
  viewShow('view-simulateur');
  document.addEventListener('click', simDocClick);
  renderCatChips(); renderCatalog();
  renderSimList(); renderSimTotal();
}
var SIM_CAT = '';
function catToggle() {
  var b = document.getElementById('cat-body'), t = document.getElementById('cat-toggle');
  if (!b || !t) return;
  var closed = b.classList.toggle('closed');
  t.innerHTML = closed ? '<i class="fa-solid fa-chevron-down"></i> Déplier' : '<i class="fa-solid fa-chevron-up"></i> Replier';
}
function renderCatChips() {
  var z = document.getElementById('cat-chips'); if (!z) return;
  var h = '<span class="cat-chip' + (SIM_CAT === '' ? ' on' : '') + '" style="' + (SIM_CAT === '' ? 'background:var(--accent);border-color:var(--accent)' : '') + '" data-cat="">Toutes</span>';
  ['B','C','D','E'].forEach(function (c) {
    var n = INFRACTIONS.filter(function (i) { return i.cat === c; }).length;
    h += '<span class="cat-chip' + (SIM_CAT === c ? ' on' : '') + '" style="' + (SIM_CAT === c ? 'background:' + CAT_COLORS[c] + ';border-color:' + CAT_COLORS[c] : '') + '" data-cat="' + c + '">' + c + ' · ' + CAT_LABELS[c] + ' <span style="opacity:.7">(' + n + ')</span></span>';
  });
  z.innerHTML = h;
  z.querySelectorAll('.cat-chip').forEach(function (ch) {
    ch.onclick = function () { SIM_CAT = ch.getAttribute('data-cat'); renderCatChips(); renderCatalog(); };
  });
}
function renderCatalog() {
  var b = document.getElementById('cat-body'); if (!b) return;
  var q = (document.getElementById('sim-q') || {}).value || '';
  q = q.trim().toLowerCase();
  var list = INFRACTIONS.filter(function (i) {
    return (!SIM_CAT || i.cat === SIM_CAT) && (!q || (i.code + ' ' + i.label).toLowerCase().indexOf(q) !== -1);
  });
  var cnt = document.getElementById('cat-count');
  if (cnt) cnt.textContent = list.length + ' / ' + INFRACTIONS.length + (q ? ' (filtrées)' : '');
  if (!list.length) { b.innerHTML = '<div class="cat-none">Aucune infraction ne correspond.</div>'; return; }
  var h = '', last = null;
  list.forEach(function (i) {
    if (i.cat !== last) {
      last = i.cat;
      h += '<div class="cat-grp" style="background:' + (CAT_COLORS[i.cat] || '#64748b') + '">' + esc(i.cat) + ' · ' + esc(CAT_LABELS[i.cat] || '') + '</div>';
    }
    h += '<div class="cat-row" data-id="' + i.id + '" title="Ajouter au simulateur">' + catChip(i.cat)
      + '<span class="lbl"><b>' + esc(i.code) + '</b>' + esc(i.label) + '</span>'
      + '<span class="money">' + money(i.price) + (i.per_unit ? ' /u' : '') + '</span>'
      + '<i class="fa-solid fa-plus add"></i></div>';
  });
  b.innerHTML = h;
  b.querySelectorAll('.cat-row[data-id]').forEach(function (r) {
    r.onclick = function () { simAdd(parseInt(r.getAttribute('data-id'), 10)); };
  });
}
function simDocClick(ev){ var dd=document.getElementById('sim-dd'); if(!dd)return; var add=ev.target.closest?ev.target.closest('.sim-add'):null; if(!add) dd.classList.remove('show'); }
function simFilter() {
  renderCatalog();
  var inp = document.getElementById('sim-q'), dd = document.getElementById('sim-dd'); if (!inp||!dd) return;
  var q = inp.value.trim().toLowerCase();
  if (!q) { dd.classList.remove('show'); return; }
  var res = INFRACTIONS.filter(function(i){ return (i.code+' '+i.label).toLowerCase().indexOf(q) !== -1; });
  if (!res.length) { dd.innerHTML = '<div class="sim-opt muted">Aucune infraction</div>'; dd.classList.add('show'); return; }
  dd.innerHTML = res.map(function(i){ return '<div class="sim-opt" data-id="'+i.id+'">'+catChip(i.cat)+' <b>'+esc(i.code)+'</b> '+esc(i.label)+' <span class="sim-amount">'+money(i.price)+(i.per_unit?' /u':'')+'</span></div>'; }).join('');
  dd.classList.add('show');
  dd.querySelectorAll('.sim-opt[data-id]').forEach(function(o){ o.onclick = function(){ simAdd(parseInt(o.getAttribute('data-id'),10)); }; });
}
function simAdd(id) { var inf = BY_ID[id]; if (!inf) return; SIM.push({ id:id, circ:(inf.circonstances||[]).map(function(){return false;}), qty:1, sum:0 }); document.getElementById('sim-q').value=''; document.getElementById('sim-dd').classList.remove('show'); renderCatalog(); renderSimList(); renderSimTotal(); if (window.MDT_TOAST) MDT_TOAST.ok(inf.code + ' ajouté'); }
function simRemove(idx) { SIM.splice(idx,1); renderSimList(); renderSimTotal(); }
function simLineAmount(s) {
  var inf = BY_ID[s.id]; if (!inf) return 0;
  if (inf.circonstances && inf.circonstances.length && inf.tiers && inf.tiers.length) { var n = s.circ.filter(Boolean).length; return inf.tiers[Math.min(n, inf.tiers.length-1)]; }
  if (inf.per_unit) return (parseInt(inf.price,10)||0) * (Math.max(0,parseInt(s.qty,10)||0));
  if (inf.multiplier) return (Math.max(0,parseInt(s.sum,10)||0)) * inf.multiplier;
  return parseInt(inf.price,10)||0;
}
function renderSimList() {
  var el = document.getElementById('sim-list'); if (!el) return;
  if (!SIM.length) { el.innerHTML = '<div class="sim-empty"><i class="fa-solid fa-scale-balanced" style="font-size:1.6em;display:block;margin-bottom:10px;opacity:.5"></i>Aucune infraction. Utilise la recherche ci-dessus.</div>'; return; }
  el.innerHTML = SIM.map(function(s, idx){
    var inf = BY_ID[s.id]; if (!inf) return '';
    var h = '<div class="sim-item"><div class="sim-item-head">'+catChip(inf.cat)+'<span class="t"><b>'+esc(inf.code)+'</b> '+esc(inf.label)+'</span><span class="sim-amount">'+money(simLineAmount(s))+'</span><button class="rm" onclick="simRemove('+idx+')" title="Retirer"><i class="fa-solid fa-xmark"></i></button></div>';
    if (inf.note) h += '<div class="sim-line"><i class="fa-solid fa-circle-info"></i> '+esc(inf.note)+'</div>';
    if (inf.circonstances && inf.circonstances.length) {
      h += '<div class="sim-line">Circonstances aggravantes ('+s.circ.filter(Boolean).length+' cochée(s)) :</div><div class="sim-circ">';
      h += inf.circonstances.map(function(c, ci){ return '<label><input type="checkbox" '+(s.circ[ci]?'checked':'')+' onchange="simCirc('+idx+','+ci+',this.checked)"> '+esc(c)+'</label>'; }).join('');
      h += '</div>';
    } else if (inf.per_unit) {
      h += '<div class="sim-qty"><span>Quantité :</span><input type="number" min="0" value="'+esc(s.qty)+'" oninput="simQty('+idx+',this.value)"> <span class="mini">× '+money(inf.price)+' / unité</span></div>';
    } else if (inf.multiplier) {
      h += '<div class="sim-qty"><span>Somme concernée :</span><input type="number" min="0" value="'+esc(s.sum)+'" oninput="simSum('+idx+',this.value)"> <span class="mini">× '+inf.multiplier+'</span></div>';
    }
    return h + '</div>';
  }).join('');
}
function simCirc(idx, ci, v) { SIM[idx].circ[ci] = !!v; renderSimList(); renderSimTotal(); }
function simQty(idx, v) { SIM[idx].qty = v; syncSimAmounts(); }
function simSum(idx, v) { SIM[idx].sum = v; syncSimAmounts(); }
function syncSimAmounts() {
  var items = document.querySelectorAll('#sim-list .sim-item');
  SIM.forEach(function(s, idx){ var el = items[idx]; if (el) { var a = el.querySelector('.sim-item-head .sim-amount'); if (a) a.textContent = money(simLineAmount(s)); } });
  renderSimTotal();
}
function renderSimTotal() {
  var el = document.getElementById('sim-total'); if (!el) return;
  var total = 0, casier = false, doj = '', prisonNum = 0, prisonTxt = [];
  SIM.forEach(function(s){ var inf = BY_ID[s.id]; if (!inf) return; total += simLineAmount(s); if (inf.casier) casier = true;
    if (inf.doj === 'Jugement') doj = 'Jugement'; else if (inf.doj === 'Procureur' && doj !== 'Jugement') doj = 'Procureur';
    var p = String(inf.prison||'').trim(); if (p) { if (/^\d+(\.\d+)?$/.test(p)) prisonNum += parseFloat(p); else prisonTxt.push(inf.code+':'+p); }
  });
  var prisonStr = prisonNum > 0 ? (prisonNum + ' mois') : ''; if (prisonTxt.length) prisonStr += (prisonStr?' + ':'') + prisonTxt.join(', '); if (!prisonStr) prisonStr = '—';
  el.innerHTML = '<h3>Récapitulatif</h3>'
    + '<div class="sim-row"><span class="k">Amende totale</span><span class="v big">'+money(total)+'</span></div>'
    + '<div class="sim-row"><span class="k">Prison</span><span class="v">'+esc(prisonStr)+'</span></div>'
    + '<div class="sim-row"><span class="k">Casier judiciaire</span><span class="v">'+(casier?'<span style="color:#f87171">Oui</span>':'Non')+'</span></div>'
    + '<div class="sim-row"><span class="k">Passage requis</span><span class="v">'+(doj?dojChip(doj):'—')+'</span></div>'
    + '<div class="sim-row"><span class="k">Infractions</span><span class="v">'+SIM.length+'</span></div>'
    + '<button class="btn btn-primary btn-sm" style="width:100%;margin-top:14px;justify-content:center" onclick="simCopy()"'+(SIM.length?'':' disabled')+'><i class="fa-solid fa-copy"></i> Copier le récapitulatif</button>';
}
function simCopy() {
  if (!SIM.length) return;
  var total = 0, lines = [];
  SIM.forEach(function(s){ var inf = BY_ID[s.id]; if (!inf) return; var a = simLineAmount(s); total += a; var extra = ''; var n = s.circ.filter(Boolean).length; if (n) extra = ' ('+n+' circ.)'; if (inf.per_unit) extra = ' (x'+s.qty+')'; lines.push(inf.code+' '+inf.label+extra+' — '+money(a)); });
  var txt = '=== RÉCAPITULATIF PÉNAL ===\n' + lines.join('\n') + '\n\nAMENDE TOTALE : ' + money(total);
  try { navigator.clipboard.writeText(txt).then(function(){ toast('Récapitulatif copié', true); }, function(){ toast('Copie impossible', false); }); } catch(e) { toast('Copie impossible', false); }
}

var CODE_CAT = '', CODE_Q = '';
function showCode() {
  var el = document.getElementById('view-code');
  el.innerHTML = '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-book"></i></span> Code pénal</h1><div class="sub">'+INFRACTIONS.length+' infractions · référence</div></div></div>' + penTableShell(false) + '<div id="pen-body"></div>';
  viewShow('view-code'); wireFilters(false); renderPenTable(false);
}
function penTableShell(edit) {
  var chips = '<span class="cat-chip'+(CODE_CAT===''?' on':'')+'" style="'+(CODE_CAT===''?'background:var(--accent);border-color:var(--accent)':'')+'" data-cat="">Toutes</span>';
  ['B','C','D','E'].forEach(function(c){ chips += '<span class="cat-chip'+(CODE_CAT===c?' on':'')+'" style="'+(CODE_CAT===c?'background:'+CAT_COLORS[c]+';border-color:'+CAT_COLORS[c]:'')+'" data-cat="'+c+'">'+c+' · '+CAT_LABELS[c]+'</span>'; });
  return '<div class="cat-filters">'+chips+'<div class="pen-search"><i class="fa-solid fa-magnifying-glass"></i><input id="pen-q" placeholder="Rechercher…" value="'+esc(CODE_Q)+'" oninput="penSearch(this.value)"></div>'+(edit?'<span id="pen-save" class="savestate"></span><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="penNew()"><i class="fa-solid fa-plus"></i> Nouvelle infraction</button>':'')+'</div>';
}
function wireFilters(edit) {
  document.querySelectorAll('#view-'+(edit?'gestion':'code')+' .cat-chip').forEach(function(ch){ ch.onclick = function(){ CODE_CAT = ch.getAttribute('data-cat'); (edit?showGestion:showCode)(); }; });
}
function penSearch(v) { CODE_Q = v; renderPenTable(document.getElementById('view-gestion').classList.contains('on')); }
function penFiltered() {
  var q = (CODE_Q||'').toLowerCase();
  return INFRACTIONS.filter(function(i){ return (!CODE_CAT || i.cat===CODE_CAT) && (!q || (i.code+' '+i.label).toLowerCase().indexOf(q)!==-1); });
}
function renderPenTable(edit) {
  var el = document.getElementById('pen-body'); if (!el) return;
  var rows = penFiltered();
  var h = '<div class="pen-wrap"><table class="pen"><thead><tr><th>Code</th><th>Infraction</th><th>Amende</th><th>Prison</th><th>Casier</th><th>Juge/Proc</th><th>Peine compl.</th>'+(edit?'<th></th>':'')+'</tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="'+(edit?8:7)+'"><div class="empty-state">Aucune infraction.</div></td></tr>';
  var lastCat = null;
  rows.forEach(function(i){
    if (i.cat !== lastCat) { lastCat = i.cat; h += '<tr class="grp"><td colspan="'+(edit?8:7)+'" style="background:'+CAT_COLORS[i.cat]+'">'+esc(i.cat)+' · '+CAT_LABELS[i.cat]+'</td></tr>'; }
    h += edit ? penRowEdit(i) : penRowRead(i);
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
  if (edit) wireGestion();
}
function tiersTxt(i) { var out = []; if (i.tiers && i.tiers.length) out.push('Paliers : '+i.tiers.map(money).join(' / ')); if (i.circonstances && i.circonstances.length) out.push(i.circonstances.length+' circonstance(s)'); return out.join(' · '); }
function penRowRead(i) {
  var price = i.per_unit ? money(i.price)+' <span class="mini">/u</span>' : (i.multiplier ? '<span class="mini">somme ×'+i.multiplier+'</span>' : money(i.price));
  return '<tr><td>'+catChip(i.code)+'</td><td>'+esc(i.label)+(tiersTxt(i)?'<div class="mini">'+esc(tiersTxt(i))+'</div>':'')+'</td><td class="money">'+price+'</td><td>'+(i.prison?esc(i.prison):'<span class="jdays">—</span>')+'</td><td>'+(i.casier?'<span class="chip-casier">Oui</span>':'<span class="jdays">—</span>')+'</td><td>'+dojChip(i.doj)+'</td><td class="mini">'+(esc(i.note||'')||'—')+'</td></tr>';
}

function showGestion() {
  var el = document.getElementById('view-gestion');
  if (!IS_ADMIN) { el.innerHTML = '<div class="empty-state"><i class="fa-solid fa-lock" style="font-size:1.6em;display:block;margin-bottom:12px;color:var(--accent-2)"></i>La gestion du code pénal est réservée à l\'administration.<div style="margin-top:16px"><a class="btn btn-ghost" href="/penal/">← Simulateur</a></div></div>'; viewShow('view-gestion'); return; }
  el.innerHTML = '<div class="sec-head"><div><h1><span class="ic"><i class="fa-solid fa-sliders"></i></span> Gestion du code pénal</h1><div class="sub">Édition en ligne · '+INFRACTIONS.length+' infractions</div></div></div>' + penTableShell(true) + '<div id="pen-body"></div>';
  viewShow('view-gestion'); wireFilters(true); renderPenTable(true);
}
function penRowEdit(i) {
  var dojSel = ['','Procureur','Jugement'].map(function(o){ return '<option value="'+o+'"'+(i.doj===o?' selected':'')+'>'+(o||'—')+'</option>'; }).join('');
  return '<tr data-id="'+i.id+'">'
    + '<td><input class="pen-in code" data-f="code" value="'+esc(i.code)+'"></td>'
    + '<td><input class="pen-in" data-f="label" value="'+esc(i.label)+'"></td>'
    + '<td><input class="pen-in price" type="number" data-f="price" value="'+esc(i.price)+'"></td>'
    + '<td><input class="pen-in prison" data-f="prison" value="'+esc(i.prison||'')+'"></td>'
    + '<td style="text-align:center"><input type="checkbox" data-f="casier" '+(i.casier?'checked':'')+'></td>'
    + '<td><select class="pen-in" data-f="doj">'+dojSel+'</select></td>'
    + '<td><input class="pen-in" data-f="note" value="'+esc(i.note||'')+'" placeholder="—"></td>'
    + '<td style="white-space:nowrap"><button class="pen-del" title="Paliers / circonstances" onclick="penTiers('+i.id+')"><i class="fa-solid fa-layer-group"></i></button><button class="pen-del" title="Supprimer" onclick="penDelete('+i.id+')"><i class="fa-solid fa-trash"></i></button></td></tr>';
}
var PEN_T = {};
function wireGestion() {
  var tbl = document.querySelector('#pen-body table.pen'); if (!tbl) return;
  tbl.addEventListener('input', function(ev){ var t = ev.target; if (!t.getAttribute) return; var f = t.getAttribute('data-f'); if (!f) return; var tr = t.closest('tr[data-id]'); if (!tr) return; penEdit(parseInt(tr.getAttribute('data-id'),10)); });
  tbl.addEventListener('change', function(ev){ var t = ev.target; if (t.getAttribute && t.getAttribute('data-f')==='casier') { var tr = t.closest('tr[data-id]'); if (tr) penEdit(parseInt(tr.getAttribute('data-id'),10)); } });
}
function penEdit(id) { if (PEN_T[id]) clearTimeout(PEN_T[id]); penSetSave('saving'); PEN_T[id] = setTimeout(function(){ penSave(id); }, 700); }
function penSetSave(s) { var el = document.getElementById('pen-save'); if (!el) return; el.innerHTML = s==='saving'?'<i class="fa-solid fa-spinner fa-spin"></i> …':s==='saved'?'<i class="fa-solid fa-check"></i> Enregistré':s==='err'?'<span style="color:#f87171"><i class="fa-solid fa-triangle-exclamation"></i> Erreur</span>':''; }
function penCollect(id) {
  var tr = document.querySelector('#pen-body tr[data-id="'+id+'"]'); if (!tr) return null;
  var inf = BY_ID[id] || {}; var o = { id:id, tiers:inf.tiers||[], circonstances:inf.circonstances||[], per_unit:inf.per_unit||0, multiplier:inf.multiplier, cat:inf.cat };
  tr.querySelectorAll('[data-f]').forEach(function(t){ var f = t.getAttribute('data-f'); o[f] = t.type==='checkbox' ? (t.checked?1:0) : t.value; });
  return o;
}
function penSave(id) {
  var o = penCollect(id); if (!o) return;
  fetch(API + '?action=save', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify(o) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.success) { penSetSave('saved'); var inf = BY_ID[id]; if (inf) { ['code','label','prison','note','doj'].forEach(function(f){ if(o[f]!==undefined) inf[f]=o[f]; }); inf.price=parseInt(o.price,10)||0; inf.casier=o.casier?1:0; } } else { penSetSave('err'); toast((x.d&&x.d.error)||'Refusé', false); } })
    .catch(function(){ penSetSave('err'); toast('Erreur réseau', false); });
}
async function penNew() {
  var code = await MDT_PROMPT('Code de la nouvelle infraction (ex : B42, C50, D53, E27) :'); if (!code) return; code = code.trim();
  var cat = code.charAt(0).toUpperCase(); if (['B','C','D','E'].indexOf(cat)===-1) { toast('Le code doit commencer par B, C, D ou E', false); return; }
  fetch(API + '?action=save', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify({ code:code, cat:cat, label:'Nouvelle infraction', price:0 }) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){ if (x.ok && x.d && x.d.success) { toast('Infraction créée', true); reload(function(){ CODE_CAT=cat; showGestion(); }); } else toast((x.d&&x.d.error)||'Refusé', false); })
    .catch(function(){ toast('Erreur réseau', false); });
}
async function penDelete(id) {
  var inf = BY_ID[id]; if (!inf) return;
  if (!await MDT_CONFIRM('Supprimer l\'infraction ' + inf.code + ' « ' + inf.label + ' » ?\n\nDéfinitif.', { title: 'Supprimer une infraction', okLabel: 'Supprimer', danger: true, icon: 'fa-trash' })) return;
  fetch(API + '?action=delete', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify({ id:id }) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { toast('Supprimée', true); reload(function(){ showGestion(); }); } else toast((d&&d.error)||'Refusé', false); }).catch(function(){ toast('Erreur réseau', false); });
}
async function penTiers(id) {
  var inf = BY_ID[id]; if (!inf) return;
  var t = await MDT_PROMPT('Paliers de prix (montants séparés par des virgules, le 1er = prix de base) pour '+inf.code+' :', (inf.tiers||[]).join(', '));
  if (t === null) return;
  var tiers = t.split(',').map(function(x){ return parseInt(x.trim(),10); }).filter(function(x){ return !isNaN(x); });
  var c = await MDT_PROMPT('Circonstances aggravantes (une par ligne) pour '+inf.code+' :', (inf.circonstances||[]).join('\n'));
  if (c === null) return;
  var circ = c.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  var o = penCollect(id) || { id:id, code:inf.code, cat:inf.cat, label:inf.label, price:inf.price, prison:inf.prison, doj:inf.doj, note:inf.note, casier:inf.casier, per_unit:inf.per_unit, multiplier:inf.multiplier };
  o.tiers = tiers; o.circonstances = circ;
  fetch(API + '?action=save', { method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify(o) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d && d.success) { toast('Paliers/circonstances enregistrés', true); reload(function(){ showGestion(); }); } else toast((d&&d.error)||'Refusé', false); }).catch(function(){ toast('Erreur réseau', false); });
}

boot();
</script>
</body>
</html>
