<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP MDT — Page introuvable</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font,'Inter',system-ui,sans-serif); background:var(--bg,#0f172a); color:var(--text,#e2e8f0);
       min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.er { max-width:560px; width:100%; text-align:center; position:relative; z-index:1; }
.badge { display:inline-flex; align-items:center; gap:9px; padding:7px 15px; border-radius:999px;
         background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.35); color:var(--accent-2,#60a5fa);
         font-size:.74rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; margin-bottom:26px; }
.badge .dot { width:7px; height:7px; border-radius:50%; background:var(--accent-2,#60a5fa); animation:p 1.8s ease-in-out infinite; }
@keyframes p { 0%,100%{opacity:1} 50%{opacity:.25} }
.code { font-size:clamp(84px,20vw,150px); font-weight:900; line-height:.9; letter-spacing:-.045em;
        background:linear-gradient(180deg,var(--text,#e2e8f0) 15%,rgba(100,116,139,.22) 100%);
        -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; }
h1 { font-size:1.4rem; font-weight:800; margin-bottom:11px; }
p { color:var(--muted,#94a3b8); font-size:.94rem; line-height:1.65; margin-bottom:30px; }
.acts { display:flex; gap:11px; justify-content:center; flex-wrap:wrap; }
.b { display:inline-flex; align-items:center; gap:9px; padding:12px 22px; border-radius:11px; font-weight:700;
     font-size:.89rem; text-decoration:none; border:1px solid transparent; cursor:pointer; font-family:inherit; }
.b.p { background:var(--accent,#3b82f6); color:#04121f; }
.b.p:hover { filter:brightness(1.1); }
.b.g { background:var(--surface,#1e293b); color:var(--muted,#94a3b8); border-color:var(--border,#334155); }
.b.g:hover { color:var(--text,#e2e8f0); border-color:var(--accent,#3b82f6); }
.path { margin-top:28px; font-size:.76rem; color:var(--muted-2,#64748b); word-break:break-all; }
.path code { background:var(--surface,#1e293b); border:1px solid var(--border,#334155); border-radius:7px;
             padding:3px 8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted,#94a3b8); }
.glow { position:fixed; inset:0; pointer-events:none; z-index:0;
        background:radial-gradient(680px circle at 50% 32%, rgba(59,130,246,.10), transparent 62%); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="er">
  <div class="badge"><span class="dot"></span> San Andreas State Police</div>
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être erroné, ou la page a été déplacée lors d'une mise à jour de l'outil.</p>
  <div class="acts">
    <a class="b p" href="/">Retour au menu</a>
    <a class="b g" href="#" id="back">Page précédente</a>
  </div>
  <div class="path">Adresse demandée : <code id="url">—</code></div>
</div>
<script>
document.getElementById('url').textContent = location.pathname + location.search;
document.getElementById('back').onclick = function (e) {
  e.preventDefault();
  if (history.length > 1) history.back(); else location.href = '/';
};
</script>
<script src="/assets/credit.js" defer></script>
</body>
</html>
